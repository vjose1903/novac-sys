<h4 class="mb-3">Introduzca fecha y hora de factura pendiente:</h4>
<div class="row">
  <div class="col-5 rowFecha ">
    <input type="text" [bsConfig]="dpConfig" placeholder="mm/dd/aaaa" class="form-control" [(ngModel)]="fecha" #dp="bsDatepicker" placement="bottom" bsDatepicker />
  </div>
  <div class="col-7">
    <ngb-timepicker id="timepiker_______" [(ngModel)]="time" [size]="'small'" [meridian]="meridian"></ngb-timepicker>
  </div>
</div>
<div class="row mt-3">
  <div class="col-md-12">
    <div class="from-group">
      <button type="button" mdbBtn (click)="accion(false)" class="btn-sm mr-2 btn-light">Cancelar</button>
      <button type="button" mdbBtn (click)="makeDateTime()" class="btn-sm btn-success">Confirmar</button>
    </div>
  </div>
</div>
