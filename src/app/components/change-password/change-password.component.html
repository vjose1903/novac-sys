<form [formGroup]="form">
  <div class="row">
    <div class="col-sm-12">
      <div class="from-group">
        <label class="control-label">Contraseña: </label>
        <input type="password" formControlName="password" placeholder="Introduzca contraseña" class="form-control" autocomplete="off" />
        <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['password'].valid && (form.controls['password'].dirty || form.controls['password'].touched)">
          Introduzca el numero de telefono
        </div>
      </div>
    </div>
    <div class="col-sm-12">
      <div class="from-group">
        <label class="control-label">Confirmar contraseña: </label>
        <input type="password" formControlName="confirmPassword" placeholder="Introduzca contraseña" class="form-control" autocomplete="off" />
        <div *ngIf="form.controls['confirmPassword'].errors['required']">Este Campo es obligatorio Minimo 5 caracteres</div>
        <div *ngIf="form.controls['confirmPassword'].errors['compares']">Las contraseñas no coinciden</div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <div class="from-group">
        <input (click)="accion(false)" class="btn-sm btn-light" value="Cancelar" id="btn-verde" />
        <input [disabled]="!form.valid" type="submit" (click)="submit(form.value)" class="btn-sm" value="Confirmar cambio" id="btn-verde" />
      </div>
    </div>
  </div>
</form>
