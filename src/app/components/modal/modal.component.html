<!-- ================================================================================================================================ -->
<!-- ELIMINAR -->
<!-- ================================================================================================================================ -->
<div *ngIf="showModal" class="overlay" (keypress)="prueba($event)">
  <p-dialog
    *ngIf="tipoModal === 'borrar' && seleccionModal"
    header="Confirmar"
    [(visible)]="showModal"
    [modal]="true"
    [responsive]="true"
    [style]="{ width: '350px', minWidth: '200px' }"
    [minY]="70"
    [baseZIndex]="10000"
    (onHide)="reinicioModal()"
    blockScroll="false"
  >
    <p>Desea eliminar {{ seleccionModal.nombre }}</p>
    <p-footer>
      <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
      <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
    </p-footer>
  </p-dialog>

  <!-- ================================================================================================================================ -->
  <!--  CANCELAR  FACTURA-->
  <!-- ================================================================================================================================ -->

  <p-dialog
    *ngIf="tipoModal === 'cancelar'"
    header="Confirmar"
    [(visible)]="showModal"
    [modal]="false"
    [responsive]="true"
    [style]="{ width: '350px', minWidth: '200px' }"
    [minY]="70"
    [baseZIndex]="10000"
    (onHide)="reinicioModal()"
    blockScroll="false"
  >
    <p>Seguro que desea cancelar la factura</p>
    <p-footer>
      <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
      <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
    </p-footer>
  </p-dialog>

  <!-- ================================================================================================================================ -->
  <!--  IMPRIMIR  FACTURA-->
  <!-- ================================================================================================================================ -->

  <p-dialog
    *ngIf="tipoModal === 'imprimir'"
    header="Confirmar"
    [(visible)]="showModal"
    [modal]="false"
    [responsive]="true"
    [style]="{ width: '350px', minWidth: '200px' }"
    [minY]="70"
    [baseZIndex]="10000"
    (onHide)="reinicioModal()"
    blockScroll="false"
  >
    <p>Seguro que desea imprimir la factura</p>
    <p-footer>
      <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
      <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
    </p-footer>
  </p-dialog>

  <!-- ================================================================================================================================ -->
  <!-- FILTRAR ARTICULO -->
  <!-- ================================================================================================================================ -->

  <p-dialog
    *ngIf="tipoModal === 'buscar' && seleccionModal && infoArticulos"
    header="Buscar articulo"
    [(visible)]="showModal"
    [focusTrap]="true"
    [focusOnShow]="true"
    [modal]="false"
    [responsive]="true"
    [style]="{ width: '600px', minWidth: '400px' }"
    [minY]="70"
    (onHide)="reinicioModal()"
    id="tablaSearch"
    (onShow)="prueba()"
    blockScroll="false"
  >
    <!-- *ngIf="seleccionModal.listaArticulos.length > 0 && paraFiltroArticulos" -->
    <app-tablas
      [focusRow]="true"
      [paraFiltroArticulos]="paraFiltroArticulos"
      (clickRow)="devolverCLick($event)"
      [info]="infoArticulos"
      [data]="seleccionModal.listaArticulos"
      [search]="false"
      (noArticulo)="noArticulo()"
      (reinicioModal)="reinicioModal()"
    ></app-tablas>
  </p-dialog>

  <!-- ================================================================================================================================ -->
  <!-- FILTRAR CLIENTE -->
  <!-- ================================================================================================================================ -->

  <p-dialog
    *ngIf="tipoModal === 'buscarCliente' && seleccionModal && infoCliente"
    header="Buscar cliente"
    [(visible)]="showModal"
    [focusTrap]="true"
    [focusOnShow]="true"
    [modal]="false"
    [responsive]="true"
    [style]="{ width: '600px', minWidth: '400px' }"
    [minY]="70"
    (onHide)="reinicioModal()"
    (onShow)="prueba()"
    blockScroll="false"
  >
    <app-tablas
      *ngIf="seleccionModal"
      [focusRow]="true"
      (clickRow)="devolverCLick($event)"
      [info]="infoCliente"
      [data]="seleccionModal"
      [search]="true"
      (reinicioModal)="reinicioModal()"
    ></app-tablas>
  </p-dialog>
</div>
