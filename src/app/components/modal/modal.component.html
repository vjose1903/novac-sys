<!-- ================================================================================================================================ -->
<!-- REMOVER DE LA LISTA -->
<!-- ================================================================================================================================ -->
<div *ngIf="showModal" class="overlay" (keypress)="prueba($event)">
  <p-dialog
    *ngIf="tipoModal === 'remover' && seleccionModal"
    header="Confirmar"
    [(visible)]="showModal"
    [modal]="true"
    [responsive]="true"
    [style]="{ width: '350px', minWidth: '200px' }"
    [minY]="70"
    [baseZIndex]="10000"
    (onHide)="reinicioModal()"
    blockScroll="true"
  >
    <p>Desea remover {{ seleccionModal.nombre }} de la lista</p>
    <p-footer>
      <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
      <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
    </p-footer>
  </p-dialog>
  <!-- ================================================================================================================================ -->
  <!-- ELIMINAR -->
  <!-- ================================================================================================================================ -->
  <div *ngIf="showModal" class="overlay" (keypress)="prueba($event)">
    <p-dialog
      *ngIf="tipoModal === 'borrar' && seleccionModal"
      header="Confirmar"
      [(visible)]="showModal"
      [modal]="true"
      [responsive]="true"
      [style]="{ width: '350px', minWidth: '200px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <p>Desea eliminar {{ seleccionModal.nombre }}</p>
      <p-footer>
        <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
        <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
      </p-footer>
    </p-dialog>

    <!-- ================================================================================================================================ -->
    <!--  ESCOGER FECHA  -->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'pendiente'"
      header="Factura pendiente"
      [(visible)]="showModal"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '550px', minWidth: '550px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <app-pendiente-form (cancel)="accion($event)" (getDate)="getDatePendiente($event)"></app-pendiente-form>
    </p-dialog>
    <!-- ================================================================================================================================ -->
    <!--  MOVIMIENTO INVENTARIO  -->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'inventario'"
      header="Movimientos de inventario"
      [(visible)]="showModal"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '450px', minWidth: '200px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <div class="p-2">
        <app-movimientos-form [data]="seleccionModal" (cancel)="accion($event)"></app-movimientos-form>
      </div>
    </p-dialog>
    <!-- ================================================================================================================================ -->
    <!--  CAMBIAR CONTRASEÑA  -->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'password'"
      header="Cambiar contraseña"
      [(visible)]="showModal"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '350px', minWidth: '200px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <app-change-password [user]="seleccionModal" (cancel)="accion($event)"></app-change-password>
    </p-dialog>
    <!-- ================================================================================================================================ -->
    <!--  FORMULARIO CANTIDAD EFECTIVO  -->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'cambio'"
      header="Cantidad de efectivo"
      [(visible)]="showModal"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '500px', minWidth: '500px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <app-form-cantidad-efectivo [data]="seleccionModal" (cancel)="accion(false)" (getDevuelta)="getDevuelta($event)"></app-form-cantidad-efectivo>
    </p-dialog>
    <!-- ================================================================================================================================ -->
    <!--  CANCELAR LA PRODUCCION-->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'cancelarP'"
      header="Confirmar"
      [(visible)]="showModal"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '350px', minWidth: '200px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <p>Seguro que desea cancelar la produccion</p>
      <p-footer>
        <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
        <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
      </p-footer>
    </p-dialog>
    <!-- ================================================================================================================================ -->
    <!--  CANCELAR  BUSQUEDA-->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'cancelarBusqueda'"
      header="Confirmar"
      [(visible)]="showModal"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '350px', minWidth: '200px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <p>Seguro que desea cancelar la busqueda de factura</p>
      <p-footer>
        <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
        <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
      </p-footer>
    </p-dialog>
    <!-- ================================================================================================================================ -->
    <!--  CANCELAR  FACTURA-->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'cancelar'"
      header="Confirmar"
      [(visible)]="showModal"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '350px', minWidth: '200px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <p>
        Seguro que desea cancelar la factura <b *ngIf="identificadorFact">{{ identificadorFact }}</b>
      </p>
      <p-footer>
        <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
        <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
      </p-footer>
    </p-dialog>

    <!-- ================================================================================================================================ -->
    <!--  IMPRIMIR  FACTURA-->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'imprimir'"
      header="Confirmar"
      [(visible)]="showModal"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '350px', minWidth: '200px' }"
      [minY]="70"
      [baseZIndex]="10000"
      (onHide)="reinicioModal()"
      blockScroll="true"
    >
      <p>Seguro que desea imprimir la factura</p>
      <p-footer>
        <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
        <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
      </p-footer>
    </p-dialog>

    <!-- ================================================================================================================================ -->
    <!-- FILTRAR ARTICULO -->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'buscar' && seleccionModal && infoArticulos"
      header="Buscar articulo"
      [(visible)]="showModal"
      [focusTrap]="true"
      [focusOnShow]="true"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '900px', minWidth: '400px' }"
      [minY]="70"
      (onHide)="reinicioModal()"
      id="tablaSearch"
      (onShow)="prueba()"
      blockScroll="true"
    >
      <!-- *ngIf="seleccionModal.listaArticulos.length > 0 && paraFiltroArticulos" -->
      <app-tablas
        [focusRow]="true"
        [metodo]="metodo"
        [paraFiltroArticulos]="paraFiltroArticulos"
        (clickRow)="devolverCLick($event)"
        [info]="infoArticulos"
        [data]="seleccionModal.listaArticulos"
        [search]="false"
        (noArticulo)="noArticulo()"
        (reinicioModal)="reinicioModal()"
        [scrollContainer]="'scroll-container'"
      ></app-tablas>
    </p-dialog>

    <!-- ================================================================================================================================ -->
    <!-- FILTRAR CLIENTE -->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'buscarCliente' && seleccionModal && infoCliente"
      [header]="tituloModal"
      [(visible)]="showModal"
      [focusTrap]="true"
      [focusOnShow]="true"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '900px', minWidth: '400px' }"
      [minY]="70"
      (onHide)="reinicioModal()"
      (onShow)="prueba()"
      blockScroll="true"
    >
      <app-tablas
        *ngIf="seleccionModal"
        [paraFiltroClientes]="paraFiltroClientes"
        [focusRow]="true"
        (clickRow)="devolverCLick($event)"
        [info]="infoCliente"
        [data]="seleccionModal"
        [search]="true"
        [scrollContainer]="'scroll-container'"
        (reinicioModal)="reinicioModal()"
      ></app-tablas>
    </p-dialog>
    <!-- ================================================================================================================================ -->
    <!-- MOSTRAR FACTURA -->
    <!-- ================================================================================================================================ -->

    <p-dialog
      *ngIf="tipoModal === 'mostrarFactura' && seleccionModal"
      header="Mostrar Factura"
      [dismissableMask]="false"
      [(visible)]="showModal"
      [focusTrap]="true"
      [focusOnShow]="true"
      [modal]="false"
      [responsive]="true"
      [style]="{ width: '1200px', minWidth: '400px' }"
      [minY]="70"
      (onHide)="reinicioModal()"
      (onShow)="prueba()"
      blockScroll="true"
    >
      <div class="p-2">
        <app-formar-factura [factura]="this.seleccionModal"></app-formar-factura>
      </div>
      <p-footer>
        <ng-container class="p-1\" *ngIf="lugar === 'cancelar_factura'">
          <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">Cerrar</button>
          <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Cancelar factura</button>
        </ng-container>
      </p-footer>
    </p-dialog>
  </div>
</div>
