<p-dialog
  *ngIf="ModalEliminar && seleccionModal"
  header="Confirmar"
  [(visible)]="showModal"
  [modal]="true"
  [responsive]="true"
  [style]="{ width: '350px', minWidth: '200px' }"
  [minY]="70"
  [baseZIndex]="10000"
  (onHide)="reinicioModal()"
>
  <p>Desea eliminar {{ seleccionModal.nombre }}</p>
  <p-footer>
    <button type="button" mdbBtn (click)="accion(false)" class="btn-sm btn-light">No</button>
    <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
  </p-footer>
</p-dialog>

<p-dialog
  *ngIf="ModalShearch && seleccionModal && infoArticulos"
  header="Buscar articulo"
  [(visible)]="showModal"
  [modal]="false"
  [responsive]="true"
  [style]="{ width: '500px', minWidth: '400px' }"
  [minY]="70"
  [baseZIndex]="1000000"
  (onHide)="reinicioModal()"
>
  <app-tablas *ngIf="listaArticulos.length > 0 && paraFiltroArticulos" [paraFiltroArticulos]="paraFiltroArticulos" [info]="infoArticulos" [data]="listaArticulos"></app-tablas>

    <button type="button" mdbBtn (click)="accion(true)" class="btn-sm btn-success">Si</button>
  </p-footer> -->
</p-dialog>
