<div class="image-container" [ngClass]="{ noContainer: imageSrc }">
  <img style=" max-width: 98%; max-height: 98%;" id="blah" [src]="imageSrc" [ngClass]="{ 'd-none': !imageSrc }" alt="your image" />
</div>
<div class="d-flex justify-content-around" style="min-width: 13rem;">
  <input type="file" lang="es" id="imgInput" (change)="onFileChange($event)" accept=".jpg, .png, .jpeg, .svg" />
  <label for="imgInput" class="btn-file">
    <span>Buscar imagen</span>
  </label>
  <button mdbTooltip="Remover imagen" placement="top" (click)="borrar()" class="btn px-1 my-auto py-0 ml-2" id="btn-gris"><i class="fas fa-eraser"></i></button>
</div>
