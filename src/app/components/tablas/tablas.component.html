<div *ngIf="search" class="searchDiv">
  <label class="search-label" for="search">Busqueda </label>
  <input [(ngModel)]="searchText" id="search" class="search-input" />
</div>

<div class="{{ scrollContainer }}" style="border-radius: 10px 10px 0px 0px">
  <table *ngIf="info" #consorciosTable="mdbTable" mdbTable class="table" hover="true" small="true" id="VICtablas">
    <thead class="text-center head-table ">
      <tr>
        <th *ngFor="let row of info">{{ row.titulo }}</th>
        <th *ngIf="botones.titulo">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr
        mdbTableCol
        *ngFor="let row of data; let i = index"
        class="text-center"
        [ngClass]="{
          'bg-light': RowElement.id == IDROW
          
        }"
        style="cursor: pointer;"
        id="row-{{ i }}"
        #RowElement
        (click)="clickROW(row)"
      >
        <td *ngFor="let column of info">
          <span style="width: 100%">
            {{ row[column.key] }}
          </span>
        </td>
        <td class="btnAccion" *ngIf="botones.titulo">
          <app-btnacciones [row]="row" [botones]="botones" (deleteBTN)="delete($event)" (DevolverInfoBTN)="devolverInfo($event)"></app-btnacciones>
        </td>
      </tr>
    </tbody>
    <tfoot class="grey lighten-5 w-100"></tfoot>
  </table>
</div>
