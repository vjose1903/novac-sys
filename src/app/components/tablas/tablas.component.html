<div class="searchDiv">
  <label class="search-label" for="search">Busqueda </label>
  <input [(ngModel)]="searchText" id="search" class="search-input" />
</div>

<div class="scroll-container" style="border-radius: 10px 10px 0px 0px">
  <table *ngIf="info" #consorciosTable="mdbTable" mdbTable class="table" hover="true" small="true">
    <thead class="text-center head-table ">
      <tr>
        <th *ngFor="let titulo of info">{{ titulo.titulo }}</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr mdbTableCol *ngFor="let row of data; let i = index" class="text-center" style="cursor: pointer;">

        <td *ngFor="let column of info">{{ row[column.key] }}</td>

        <td class="btnAccion">
          <span mdbTooltip="Editar" placement="top" *ngIf="true">
            <i class="fas fa-pencil-alt"></i>
          </span>

          <span mdbTooltip="Borrar " placement="top" *ngIf="true">
            <i class="far fa-trash-alt"></i>
          </span>
        </td>
      </tr>
    </tbody>
    <tfoot class="grey lighten-5 w-100"></tfoot>
  </table>
</div>
