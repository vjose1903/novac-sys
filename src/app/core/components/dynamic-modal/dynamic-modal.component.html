<span *ngFor="let modalConfig of modalsConfig">
  <p-dialog
    *ngIf="modalConfig"
    #myModal
    [id]="modalConfig.id"
    [(visible)]="modalConfig.visible!"
    [breakpoints]="{ '767px': '90vw' }"
    [position]="modalConfig.position!"
    [contentStyleClass]="modalConfig.contentStyleClass!"
    [baseZIndex]="10000"
    [draggable]="false"
    [maximizable]="modalConfig.maximizable!"
    [modal]="true"
    [showHeader]="!!modalConfig.header"
    [blockScroll]="false"
    [resizable]="modalConfig.resizable!"
    [dismissableMask]="modalConfig.closableClickOutside!"
    [closeOnEscape]="modalConfig.closableEsc!"
    [closable]="modalConfig.closable! && !modalConfig.comfirmToClose"
    [transitionOptions]="modalConfig.transitionOptions!"
    (onHide)="handleCloseModal(modalConfig.id!)"
    [style]="{ height: modalConfig.height, width: modalConfig.width }"
    [contentStyle]="{ padding: modalConfig.padding, overflow: modalConfig.overflow }">
    <ng-template pTemplate="header">
      <div class="d-flex justify-content-between align-items-center w-100 h-100">
        <h4 class="mb-0">{{ modalConfig.header }}</h4>

        <div class="p-dialog-header-icons">
          <button *ngIf="modalConfig.comfirmToClose" id="confirm-close-button" (click)="confirmToClose(modalConfig.id!)" type="button" pripple="" class="p-ripple p-element p-dialog-header-icon p-dialog-header-close p-link" tabindex="-1">
            <span class="p-dialog-header-close-icon pi pi-times" ng-reflect-ng-class="pi pi-times"></span>
          </button>
        </div>
      </div>
    </ng-template>

    <div style="transition: all 0.5s">
      <div *ngIf="modalConfig.html; else componentTemplate" [innerHtml]="sanitizeHtml(modalConfig.html)" appFocus></div>

      <ng-template #componentTemplate>
        <ng-container [modalReceptorId]="modalConfig.id!"></ng-container>
      </ng-template>
    </div>

    <ng-template *ngIf="hasAnyBtn(modalConfig)" pTemplate="footer">
      <div class="d-flex justify-content-end align-items-center mt-2 gap-2">
        <ng-container *ngFor="let dynamic_boton of modalConfig?.botones">
          <span [pTooltip]="getButtonTooltip(dynamic_boton)" tooltipPosition="top">
            <button [disabled]="getButtonState(dynamic_boton)" class="btn btn-sm {{ dynamic_boton.clase }} progress-btn" (click)="dynamicFunction(modalConfig, dynamic_boton)">
              <i *ngIf="dynamic_boton.iconName" class="{{ dynamic_boton.iconName }}" [ngStyle]="{ 'font-size': dynamic_boton.iconSize ?? '20px', color: dynamic_boton.iconSize ?? 'white' }"></i>
              {{ dynamic_boton.label }}
            </button>
          </span>
        </ng-container>
      </div>
    </ng-template>
  </p-dialog>
</span>
