<div class="print-confirmation">
  <div class="print-confirmation-icon">
    <i class="fa-solid fa-file-invoice-dollar"></i>
  </div>

  <div class="print-confirmation-copy">
    <span>Seguro que desea concluir {{ useEl.includes(metodo) ? 'el' : 'la' }}</span>
    <strong>{{ documento?.descripcion }}</strong>
  </div>

  <label class="print-confirmation-option">
    <span>
      <i class="fa-solid fa-print"></i>
      Imprimir documento
    </span>
    <input class="apple-switch" type="checkbox" [(ngModel)]="is_print" />
  </label>
</div>
