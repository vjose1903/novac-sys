<form [formGroup]="form">
  <div class="row">
    <div class="col-12">
      <div class="form-group">
        <label class="control-label">Contraseña: </label>
        <input #inputPassword required type="password" formControlName="password" id="pass" placeholder="Introduzca contraseña" class="form-control" autocomplete="off" />
        <form-error-msg [control]="form.get('password')" [fieldElement]="inputPassword"></form-error-msg>

        
      </div>
    </div>
    <div class="col-12 mt-3">
      <div class="form-group">
        <label class="control-label">Confirmar contraseña: </label>
        <input #inputConfirmPassword required type="password" compare="password" formControlName="confirmPassword" placeholder="Introduzca contraseña" class="form-control" autocomplete="off" />
        <form-error-msg [control]="form.get('confirmPassword')" [fieldElement]="inputConfirmPassword"></form-error-msg>

        <!-- @if (!form.controls['confirmPassword'].valid && (form.controls['confirmPassword'].dirty || form.controls['confirmPassword'].touched)) {
          <div class="alerta text-danger ms-1" style="font-size: 12px">
            @if (form.controls['confirmPassword'].errors['required']) {
              <div>Este Campo es obligatorio Minimo 6 caracteres</div>
            }
            @if (form.controls['confirmPassword'].errors['compares']) {
              <div>Las contraseñas no coinciden</div>
            }
          </div>
        } -->
      </div>
    </div>
  </div>
</form>
