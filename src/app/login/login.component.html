<div class="home" style="background-color: var(--primary02)">
  <div class="col-4 d-flex justify-content-center">
    <mdb-card [cascade]="true" [narrower]="true" style="width: 32rem; max-width: 32rem">
      <div class="view view-cascade waves-light d-flex justify-content-center" mdbWavesEffect>
        <img [src]="imgLogo" class="img-fluid" />
        <a>
          <div class="mask rgba-white-slight"></div>
        </a>
      </div>

      <mdb-card-body [cascade]="true" class="px-5">
        <form [formGroup]="loginForm" class="" method="post">
          <div class="form-group" id="usuario-group">
            <label for="" class="formulario__label d-block">Usuario:</label>
            <input type="text" class="form-control" formControlName="usuario" id="Iusuario" autofocus (keyup.enter)="saltar('Ipassword')" />
            <span class="error text-danger mt-0">{{ errorU }}</span>
          </div>

          <div class="form-group" id="password-group">
            <label for="" class="formulario__label d-block">Contraseña:</label>
            <input type="password" class="form-control" formControlName="password" id="Ipassword" (keyup.enter)="saltar('send')" />
            <span class="error text-danger mt-0">{{ errorC }}</span>
          </div>
        </form>

        <div class="d-flex justify-content-center">
          <button [disabled]="formularioIsInvalid()" class="waves-light" (click)="login()" mdbWavesEffect id="boton" class="btn btn-success text-center">
            <i class="fas fa-sign-in-alt"></i> Ingresar
          </button>
        </div>
        <div class="d-flex justify-content-center my-2">
          <!-- <button class="waves-light" mdbWavesEffect (click)="reporteTest()" class="btn btn-warning text-center">Reporte</button> -->
          <!-- <button class="waves-light" mdbWavesEffect (click)="printTest()" class="btn btn-warning text-center">factura compra venta</button> -->
          <!-- <button class="waves-light" mdbWavesEffect (click)="printTest()" class="btn btn-warning text-center">factura compra venta</button>
          <button class="waves-light" mdbWavesEffect (click)="pruebaRecibo()" class="btn btn-danger text-center">recibo</button>-->
          <!-- <button class="waves-light" mdbWavesEffect (click)="pruebaConduce()" class="btn btn-primary text-center">conduce</button> -->
        </div>
      </mdb-card-body>
      <div class="text-center" style="width: 100%">
        <span class="version"> VjPOS v{{ getVersion() }} </span>
      </div>
    </mdb-card>
  </div>
</div>

<app-modal></app-modal>
