@if (formGroup) {
  <form [formGroup]="formGroup" (submit)="$event.preventDefault(); btn_aceptar()">
    <div class="row">
      <div class="col-12 p-0">
        <div class="form-group">
          <label class="control-label">Contraseña: </label>
          <input #inputPassword id="input_password" type="password" formControlName="password" placeholder="Introduzca contraseña" class="form-control" autocomplete="off" />
          <form-error-msg [control]="formGroup.get('password')" [fieldElement]="inputPassword"></form-error-msg>
        </div>
      </div>
    </div>
  </form>
}
