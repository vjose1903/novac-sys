<form [formGroup]="form" (keydown.enter)="$event.stopPropagation()">
  <div class="row">
    <div class="col-12">
      <div class="form-group" appMsgError="password" [form]="form">
        <label class="control-label">Contraseña: </label>
        <input required type="password" formControlName="password" id="pass" placeholder="Introduzca contraseña" class="form-control" autocomplete="off" (keyup.enter)="btn_aceptar()" />

        <span id="msgContainer"></span>
      </div>
    </div>
  </div>
</form>
