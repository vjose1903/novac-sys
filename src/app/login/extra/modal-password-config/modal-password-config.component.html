<form [formGroup]="form">
  <div class="row">
    <div class="col-12">
      <div class="form-group">
        <label class="control-label">Contraseña: </label>
        <input required type="password" formControlName="password" id="pass" placeholder="Introduzca contraseña" class="form-control" autocomplete="off" (keyup.enter)="btn_aceptar()" />
        @if (!form.controls['password'].valid && (form.controls['password'].dirty || form.controls['password'].touched)) {
        <div class="alerta text-danger ml-1" style="font-size: 12px">Campo obligatorio</div>
        }
      </div>
    </div>
  </div>
</form>
