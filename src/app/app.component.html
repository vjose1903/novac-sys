<div id="fondoC" *ngIf="loading" [ngClass]="{ fadeIn: loading, fadeOut: !loading }"
  class="h-100 w-100 position-absolute backnegro">
  <img class="img-fluid logoLoading rubberBand" src="assets/img/admLogo_opt.png" alt="" />
  <span class="text"> CARGANDO ... </span>
</div>
<div id="fondoC" *ngIf="noServer" class="h-100 w-100 position-absolute backnegro">
  <span [ngClass]="{ letraLogin: true }">El servidor está caido no puede realizar ninguna accion.</span>
</div>
<router-outlet></router-outlet>

<p-dialog id="modalProgress" header="Porcentaje de descarga" [(visible)]="displayPercent" [positionTop]="780" [positionLeft]="610"
  [modal]="true" [style]="{ width: '50vw' }" [baseZIndex]="10000" [draggable]="false" [resizable]="false">
  <div class="d-flex justify-content-between mb-2">
    <span class="negrita">Descargando...</span>
    <div class="mr-2">
      <span class="negrita">{{ objProgress?.transferred }} Mb / </span>
      <span class="negrita gris">{{ objProgress?.total }} Mb</span>
    </div>
  </div>
  <p-progressBar [value]="objProgress?.percent"></p-progressBar>
  <div class="mr-2">
    <span class="negrita">Tiempo restante: {{ tiempo_restante_mostrar }} </span>
  </div>
</p-dialog>
