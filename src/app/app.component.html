@if (!isReady()) {
  <div class="h-100 w-100 splash-container">
    <h2 class="msg">Cargando archivo de configuración</h2>
    <img class="logo" src="assets/img/logo_splash.png" />
    <img class="rayas" src="assets/img/splash_screen_rayas.png" />
    <img class="inspot" src="assets/img/inspot_splash.png" />
  </div>
}

@if (isReady()) {
  @if (loading()) {
    <div id="fondoC" [ngClass]="{ fadeIn: loading(), fadeOut: !loading() }" class="h-100 w-100 position-absolute backnegro">
      <img class="img-fluid logoLoading rubberBand" [src]="imgLogo()" alt="" />
      <span class="text"> CARGANDO ... </span>
    </div>
  }

  <router-outlet></router-outlet>
}

<p-dialog [closable]="false" [closeOnEscape]="false" header="Porcentaje de descarga" [(visible)]="visible" [modal]="true" [style]="{ width: '50vw' }" [baseZIndex]="10000" [draggable]="false" [resizable]="false">
  @if (objPercent()) {
    <div class="d-flex justify-content-between mb-2 position-relative">
      <span class="negrita">Descargando actualización...</span>
      <div class="me-2">
        <span class="negrita">{{ objPercent()?.transferred }} MB / </span>
        <span class="negrita gris">{{ objPercent()?.total }} MB</span>
      </div>
    </div>
    <p-progressBar [value]="objPercent()?.percent"></p-progressBar>
  } @else {
    <div class="d-flex align-items-center justify-content-center gap-2 py-3">
      <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
      <span>Preparando descarga...</span>
    </div>
  }
</p-dialog>

<dynamic-modal></dynamic-modal>

<button class="d-none position-absolute" (click)="enfocarApp()"></button>
