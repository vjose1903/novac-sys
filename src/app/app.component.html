<div *ngIf="!configReady" class="h-100 w-100 splash-container">
  <h2 class="msg">Cargando archivo de configuración</h2>
  <img class="logo" src="assets/img/logo_splash.png"  draggable="false"/>
  <img class="rayas" src="assets/img/splash_screen_rayas.png"  draggable="false"/>
  <img class="inspot" src="assets/img/inspot_logo.png"  draggable="false"/>
</div>

<div id="fondoC" *ngIf="loading && configReady" [ngClass]="{ fadeIn: loading, fadeOut: !loading }" class="h-100 w-100 position-absolute backnegro">
  <img class="img-fluid logoLoading rubberBand" [src]="imgLogo" alt=""  draggable="false"/>
  <span class="text"> CARGANDO ... </span>
</div>

<ng-container *ngIf="configReady">
  <router-outlet></router-outlet>
</ng-container>

<p-dialog [closable]="false" [closeOnEscape]="false" header="Porcentaje de descarga" [(visible)]="visible" [modal]="true" [style]="{ width: '50vw' }" [baseZIndex]="10000" [draggable]="false" [resizable]="false">
  <div class="d-flex justify-content-between mb-2 position-relative">
    <span class="negrita">Descargando actualizacion...</span>
    <div class="mr-2">
      <span class="negrita">{{ objPercent?.transferred }} Mb / </span>
      <span class="negrita gris">{{ objPercent?.total }} Mb</span>
    </div>
  </div>
  <p-progressBar [value]="objPercent?.percent"></p-progressBar>
  <div class="mr-2">
    <span> </span>
  </div>
</p-dialog>

<app-new-modal></app-new-modal>
