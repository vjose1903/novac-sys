<div class="row">
  <div class="col-12 mb-5">
    <h3>Recibo de ingreso</h3>
  </div>
  <div class="col-5">
    <div class="card card-padding sombra">
      <div class="form-group">
        <label class="control-label">Tipo recibo: </label>
        <!-- (change)="selectTipoArticulo($event.target.value)" -->

        <select id="tipo_recibo" class="form-control" (change)="saltar('clienteI', $event.target.value)" value="">
          <option value="{{ null }}" selected disabled>Escoger tipo</option>
          <option value="pago_facturas">Pago factura</option>
          <option value="pago_facturas">Compra adelantada</option>
        </select>
      </div>
      <div class="form-group">
        <label class="control-label">Cliente: </label>
        <!-- (change)="selectTipoArticulo($event.target.value)" -->
        <input
          type="text"
          id="clienteI"
          (keydown.enter)="abrirModalFiltro($event.target.value)"
          (focus)="$event.target.select()"
          placeholder="Nombre Cliente"
          class="form-control mb-4"
          autocomplete="off"
        />
      </div>
    </div>
  </div>
  <div class="col-7">
    <div class="text-center">
      <h1 *ngIf="clienteAdepositar" class="text-bold">{{ clienteAdepositar.nombre + ' ' + clienteAdepositar.apellido }}</h1>
      <span *ngIf="clienteAdepositar"> Debe: RD$ {{ formatoNumero(clienteAdepositar.balance) }}</span>
    </div>
  </div>
  <div class="col-12 rowIngre">
    <div class="card card-padding sombra ingreCard">
      <app-tablas *ngIf="Facturas" [info]="info" [data]="Facturas" (getInfoChange)="getInfoChange($event)" [scrollContainer]="'scroll-container'" (DevolverInfo)="preuba($event)" [focusRow]="false"></app-tablas>
      <!-- 
      (DELETE)="abrirModal($event)" -->
    </div>
  </div>
</div>
