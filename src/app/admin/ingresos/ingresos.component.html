  <div class="col-7">
    <div class="text-center">
      <h1 *ngIf="clienteAdepositar" class="text-bold">{{ clienteAdepositar.nombre + ' ' + clienteAdepositar.apellido }}</h1>
      <span *ngIf="clienteAdepositar"> Debe: RD$ {{ formatoNumero(clienteAdepositar.balance) }}</span>
    </div>
  </div>
  <div class="col-12 rowIngre">
    <div *ngIf="Facturas" class="card card-padding sombra ingreCard">
      <div style="height: 90%;">
        <div class="w-100 d-flex justify-content-end">
          <i mdbTooltip="{{ getIcon().tooltip }}" placement="top" (click)="selectAll()" class="far {{ getIcon().icon }}  btnSelect"></i>
        </div>
        <app-tablas
          [info]="info"
          [data]="Facturas"
          (getInfoChange)="getInfoChange($event)"
          [scrollContainer]="'scroll-container ingresosScroll'"
          (DevolverInfo)="preuba($event)"
          [focusRow]="false"
        ></app-tablas>
      </div>
      <div class="d-flex justify-content-end">
        <input [disabled]="abilitarBtnConfirmar()" (click)="cancelarIgreso()" type="submit" class="btn btn-blanco mr-2" value="Cancelar" />
        <input [disabled]="abilitarBtnConfirmar()" (click)="confirmarIgreso()" type="submit" class="btn" value="Confirmar" id="btn-verde" />
      </div>
    </div>
  </div>
