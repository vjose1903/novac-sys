<div class="row">
  <div class="col-12 mb-3">
    <h3 class="negrita">Recibo de ingreso</h3>
  </div>
  <div class="col-5">
    <div class="card card-padding sombra">
      <div class="form-group">
        <label class="control-label">Cliente: </label>
        <!-- (change)="selectTipoArticulo($event.target.value)" -->
        <input
          type="text"
          id="clienteI"
          (keydown.enter)="abrirModalFiltro($event.target.value)"
          (focus)="$event.target.select()"
          placeholder="Nombre Cliente"
          class="form-control mb-4"
          autocomplete="off"
        />
      </div>
    </div>
  </div>
  <div class="col-7">
    <div class="text-center">
      <h1 *ngIf="clienteAdepositar" class="negrita">{{ clienteAdepositar.nombre + ' ' + clienteAdepositar.apellido }}</h1>
      <span *ngIf="clienteAdepositar"> Debe: RD$ {{ formatoNumero(clienteAdepositar.balance) }}</span>
    </div>
  </div>
  <div class="col-12 mt-4">
    <div *ngIf="Facturas" class="row">
      <div class="col-12">
        <div id="cardTabla" class="card card-padding sombra ingreCard" style="height: 39rem">
          <div style="height: 93%">
            <div class="w-100 d-flex justify-content-end">
              <i mdbTooltip="{{ getIcon().tooltip }}" placement="top" (click)="selectAll()" class="far {{ getIcon().icon }}  btnSelect"></i>
            </div>
            <app-tablas
              [info]="info"
              [data]="Facturas"
              (getInfoChange)="getInfoChange($event)"
              (clickIcon)="clickVerPagos($event)"
              [tablaHover]="false"
              [alto]="altoDiv"
              [focusRow]="false"
              [id_tabla]="'facturasPendientes'"
            ></app-tablas>
          </div>
        </div>
      </div>
      <div class="col-12 mt-3">
        <div class="d-flex justify-content-end">
          <input (click)="cancelarIgreso()" type="submit" class="btn btn-blanco mr-2" value="Cancelar" />
          <input [disabled]="abilitarBtnConfirmar()" (click)="confirmarIgreso()" type="submit" class="btn" value="Confirmar" id="btn-verde" />
        </div>
      </div>
    </div>
  </div>
</div>
