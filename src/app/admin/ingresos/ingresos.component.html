<div class="row">
  <div class="col-12 mb-5">
    <h3>Recibo de ingreso</h3>
  </div>
  <div class="col-5">
    <div class="card card-padding sombra">
      <div class="form-group">
        <label class="control-label">Tipo recibo: </label>
        <!-- (change)="selectTipoArticulo($event.target.value)" -->

        <select id="tipo_recibo" [(ngModel)]="tipo_recibo" class="form-control" (change)="saltar('clienteI', $event.target.value)" value="">
          <option value="{{ null }}" selected disabled>Escoger tipo</option>
          <option *ngFor="let tipo of tipoFacturas" value="{{ tipo.descripcion }}">{{ tipo.descripcion }}</option>
          <!-- <option value="compra_adelantada">Compra adelantada</option> -->
        </select>
      </div>
      <div class="form-group">
        <label class="control-label">Cliente: </label>
        <!-- (change)="selectTipoArticulo($event.target.value)" -->
        <input
          type="text"
          id="clienteI"
          (keydown.enter)="abrirModalFiltro($event.target.value)"
          (focus)="$event.target.select()"
          placeholder="Nombre Cliente"
          class="form-control mb-4"
          autocomplete="off"
        />
      </div>
    </div>
  </div>
  <div class="col-7">
    <div class="text-center">
      <h1 *ngIf="clienteAdepositar" class="text-bold">{{ clienteAdepositar.nombre + ' ' + clienteAdepositar.apellido }}</h1>
      <span *ngIf="clienteAdepositar"> Debe: RD$ {{ formatoNumero(clienteAdepositar.balance) }}</span>
    </div>
  </div>
  <div class="col-12 rowIngre">
    <div *ngIf="Facturas" class="card card-padding sombra ingreCard">
      <div style="height: 90%;">
        <div class="w-100 d-flex justify-content-end">
          <i mdbTooltip="{{ getIcon().tooltip }}" placement="top" (click)="selectAll()" class="far {{ getIcon().icon }}  btnSelect"></i>
        </div>
        <app-tablas
          [info]="info"
          [data]="Facturas"
          (getInfoChange)="getInfoChange($event)"
          [scrollContainer]="'scroll-container'"
          (DevolverInfo)="preuba($event)"
          [focusRow]="false"
        ></app-tablas>
      </div>
      <div class="d-flex justify-content-end">
        <input [disabled]="abilitarBtnConfirmar()" (click)="cancelarIgreso()" type="submit" class="btn btn-blanco mr-2" value="Cancelar" />
        <input [disabled]="abilitarBtnConfirmar()" (click)="confirmarIgreso()" type="submit" class="btn" value="Confirmar" id="btn-verde" />
      </div>
    </div>
  </div>
</div>
