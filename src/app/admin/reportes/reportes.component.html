<h4 class="negrita">Reportes</h4>
<div class="row">
  <div class="col-6 p-0">
    <div class="row">
      <div class="col-12 p-0 pr-2">
        <div class="card card-padding sombra">
          <span class="btnLetra" (click)="formarObjModal('cuadre')"><i class="fas fa-cash-register"></i> Cuadre de caja </span>
        </div>
      </div>
      <div class="col-12 p-0 pr-2 mt-3">
        <div class="card card-padding sombra">
          <h5 class="negrita subrayado">Ventas</h5>

          <span class="btnLetra" (click)="formarObjModal('ventas_diarias')"><i class="fas fa-calendar-day"></i> Relación de ventas diarias</span>
          <span class="btnLetra" (click)="formarObjModal('ventas_rango')"><i class="fas fa-calendar-alt"></i> Relación de ventas por fechas</span>
          <span class="btnLetra" (click)="formarObjModal('ventas_productos')"> <i class="fas fa-shopping-basket"></i> Relación de productos vendidos </span>
        </div>
      </div>
      <div class="col-12 p-0 pr-2 mt-3">
        <div class="card card-padding sombra">
          <h5 class="negrita subrayado">Productos</h5>
          <span class="btnLetra" (click)="formarObjModal('inventario')"> <i class="fas fa-boxes"></i> Inventario </span>
          <span class="btnLetra" (click)="formarObjModal('suplidor_prod')"> <i class="fas fa-user-tag"></i> Suplidor por producto </span>
        </div>
      </div>
    </div>
  </div>
  <div class="col-6 p-0 pl-2">
    <div class="row">
      <div class="col-12 p-0">
        <div class="card card-padding sombra">
          <h5 class="negrita subrayado">Cuentas</h5>
          <span class="btnLetra" (click)="formarObjModal('cuentas_cobrar_cliente')">
            <i class="fas fa-comments-dollar"></i>
            Relación de CxC por cliente
          </span>
          <span class="btnLetra" (click)="formarObjModal('cuentas_cobrar_ant_saldo')">
            <i class="fas fa-comment-dollar"></i> Relación de CxC por antiguedad de saldo
          </span>
        </div>
      </div>
      <div class="col-12 p-0 pl-2 mt-3">
        <div class="card card-padding sombra">
          <span class="btnLetra" (click)="formarObjModal('recibos')"> <i class="fas fa-hand-holding-usd"></i> Recibos ingreso </span>
        </div>
      </div>
    </div>
  </div>
</div>
