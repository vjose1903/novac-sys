<form [formGroup]="form">
  <div class="row">
    <div *ngIf="tipo_reporte === 'ventas_rango'" class="col-6">
      <label class="control-label">Desde: <span style="color: red">*</span> </label>
      <input
        type="text"
        [bsConfig]="dpConfig"
        placeholder="dd/mm/aaaa"
        class="form-control"
        formControlName="desde"
        #dp="bsDatepicker"
        placement="bottom"
        bsDatepicker
      />
      <div
        class="alerta text-danger ml-1"
        style="font-size: 12px"
        *ngIf="!form.controls['desde'].valid && (form.controls['desde'].dirty || form.controls['desde'].touched)"
      >
        Este campo es obligatorio
      </div>
    </div>
    <div *ngIf="tipo_reporte === 'ventas_rango'" class="col-6">
      <label class="control-label">Hasta: <span style="color: red">*</span> </label>
      <input
        type="text"
        [bsConfig]="dpConfig"
        placeholder="dd/mm/aaaa"
        class="form-control"
        formControlName="hasta"
        #dp="bsDatepicker"
        placement="bottom"
        bsDatepicker
      />
      <div
        class="alerta text-danger ml-1"
        style="font-size: 12px"
        *ngIf="!form.controls['hasta'].valid && (form.controls['hasta'].dirty || form.controls['hasta'].touched)"
      >
        Este campo es obligatorio
      </div>
    </div>
    <div class="col-12 {{ tipo_reporte === 'ventas_rango' ? 'mt-3' : '' }}">
      <label class="control-label">Condicion: <span style="color: red">*</span> </label>
      <select formControlName="condicion" class="form-control">
        <option *ngFor="let condicion of condiciones" value="{{ condicion.id }}">{{ condicion.label }}</option>
      </select>
    </div>
  </div>
</form>
<div class="mt-4 d-flex justify-content-end">
  <button (click)="accion(false)" type="submit" class="btn btn-blanco mr-2">Cerrar</button>
  <button [disabled]="!form.valid" (click)="accion(true)" type="submit" class="btn btn-verde">Aceptar</button>
</div>
