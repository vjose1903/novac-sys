<div class="mainRecibos">
  <div class="mb-2 titulo">
    <h3 class="negrita">Recibos de ingreso</h3>
  </div>
  <div *ngxPermissionsOnly="permissions.recibo_ingreso.create" class="mb-3 botonNuevo">
    <button class="btn btn-verde" (click)="navegar()">Nuevo recibo <i class="fas fa-hand-holding-usd"></i></button>
  </div>
  <div class="divTabla">
    <div #cardTabla id="cardTabla" class="cardListados">
      <dinamic-table [cardTabla]="cardTabla" [(data)]="lista_recibos" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
    </div>
  </div>
</div>
