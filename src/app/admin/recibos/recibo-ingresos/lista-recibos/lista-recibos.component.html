<div class="mainRecibos">
  <div class="mb-2 titulo">
    <div class="d-flex align-items-center gap-2">
      <h3 class="negrita mb-0">Recibos de ingreso</h3>
      <app-configuracion-recibos></app-configuracion-recibos>
    </div>
  </div>
  <div class="mb-3 botonNuevo d-flex align-items-center gap-2">
    <ng-container *ngxPermissionsOnly="permissions.recibo_ingreso.create">
      <button class="btn btn-verde" (click)="navegar()">Nuevo recibo <i class="fas fa-hand-holding-usd"></i></button>
    </ng-container>
  </div>
  <div class="divTabla">
    <div #cardTabla id="cardTabla" class="card cardListados">
      <dinamic-table [cardTabla]="cardTabla" [(data)]="lista_recibos" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
    </div>
  </div>
</div>
