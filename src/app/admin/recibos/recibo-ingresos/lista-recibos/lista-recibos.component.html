<div class="row">
  <div class="col-12 mb-2">
    <h3 class="negrita">Recibos de ingreso</h3>
  </div>
  <div class="col-12 mb-3">
    <button class="btn btn-verde" (click)="navegar()">Nuevo recibo <i class="fas fa-hand-holding-usd"></i></button>
  </div>
  <div class="col-12">
    <div #cardTabla id="cardTabla" class="card cardListados rec">
      
      <app-tablas
        class="h-100"
        *ngIf="lista_recibos"
        [padre]="cardTabla"
        [info]="info"
        [data]="lista_recibos"
        [tablaHover]="true"
        (clickIcon)="clickIcon($event)"
        (paginateChange)="getRecibos($event)"
        [focusRow]="false"
        [id_tabla]="'listaRecibos'"
      ></app-tablas>
    </div>
  </div>
</div>
