<div class="subCatArticuloContainer">
  <div class="row h-100 w-100">
    @if (hasPermissionsCreateUpdate) {
      <div class="col-6 ps-0 pt-3">
        <form [formGroup]="form" class="h-100" (keydown.enter)="$event.stopPropagation()">
          <div class="card card-padding sombra-light">
            <div class="form-group" appMsgError="descripcion" [form]="form">
              <label class="control-label mb-0">Descripcion: <span style="color: red">*</span></label>
              <input (focus)="htmlServ.selectValue($event)" type="text" id="campoDescripcion" formControlName="descripcion" class="form-control mb-2" autocomplete="off" />
              <span id="msgContainer"></span>
            </div>

            <div class="mt-3">
              <div class="d-flex align-items-center gap-2">
                <button [disabled]="!checkIfSomethingIsDiferrent()" (click)="borrar()" class="btn mr-2 btn-blanco">Cancelar</button>

                <div [pTooltip]="fun.hasValue(subCategoriaSelected) ? (!checkIfSomethingIsDiferrent() ? 'Para editar debe de tener un valor distinto al original' : '') : ''" tooltipPosition="right">
                  <button [disabled]="formIsInvalid()" type="submit" (click)="requests()" class="btn btn-verde">{{ subCategoriaSelected ? 'Editar' : 'Guardar' }}</button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    }

    <div class="{{ hasPermissionsCreateUpdate ? 'col-6' : 'col-12' }} p-0">
      <div #cardMarca class="h-100">
        <dinamic-table [cardTabla]="cardMarca" [(data)]="listaSubTipoArticulos" [seleccionado]="subCategoriaSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
      </div>
    </div>
  </div>
</div>
