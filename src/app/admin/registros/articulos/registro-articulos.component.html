<h1>Registro de articulos:</h1>
<div class="card" style="padding: 2rem">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6">
          <div class="form-group">
              <label class="control-label">Nombre <span style="color: red">*</span></label>
              <input type="text" formControlName="nombre" placeholder="Introduzca nombre" class="form-control"autocomplete="off">
              <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['nombre'].valid && (form.controls['nombre'].dirty ||form.controls['nombre'].touched)">Este Campo es obligatorio</div>
          </div>
      </div>
      <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6">
          <div class="from-group">
              <label class="control-label">Pais <span style="color: red">*</span></label>
             
              <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['pais'].valid &&  (form.controls['pais'].dirty ||form.controls['pais'].touched)">Este Campo es obligatorio</div>
          </div>	
      </div>
  </div>
  </form>
</div>
