<div class="row" style="height: calc(100% - 80px)">
  <div class="col-xs-12 col-md-6">
    <h1>{{ titulo }}</h1>
    <div class="contenedorRegistro">
      <div class="card card-padding">
        <form [formGroup]="form" (submit)="submit(form)">
          <div class="row">
            <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6">
              <div class="form-group">
                <label class="control-label">Nombre: <span style="color: red">*</span></label>
                <input type="text" formControlName="nombre" placeholder="Introduzca nombre" class="form-control mb-4" autocomplete="off" id="campoNombre" />
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['nombre'].valid && (form.controls['nombre'].dirty || form.controls['nombre'].touched)">
                  Este Campo es obligatorio
                </div>
              </div>
            </div>

            <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6">
              <div class="form-group">
                <label class="control-label">Tipo: <span style="color: red">*</span></label>
                <select formControlName="tipo_articulo_id" class="form-control mb-4" value="">
                  <option value="" disabled selected hidden>Tipo de articulo</option>
                  <option value="Producto terminad">Producto terminado</option>
                  <option value="Materia prima">Materia prima</option>
                  <option value="Veterinaria">Veterinaria</option>
                </select>
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['tipo_articulo_id'].valid && (form.controls['tipo_articulo_id'].dirty || form.controls['tipo_articulo_id'].touched)"
                >
                  Seleccione tipo de articulo
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-xs-12 col-sm-12 col-md-6 col-lg-4">
              <div class="from-group">
                <label class="control-label">Comprado en: <span style="color: red">*</span></label>
                <select formControlName="medida" class="form-control mb-4" value="">
                  <option value="" disabled selected hidden>Tipo</option>
                  <option value="Quintal">Quintal</option>
                  <option value="Caja">Caja</option>
                </select>
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['medida'].valid && (form.controls['medida'].dirty || form.controls['medida'].touched)">
                  Seleccione una opcion
                </div>
              </div>
            </div>
            <div class="col-xs-12 col-sm-12 col-md-6 col-lg-4">
              <div class="from-group">
                <label class="control-label">Costo: <span style="color: red">*</span></label>
                <input type="Number" formControlName="costo_principal" (blur)="calculatePrice()" placeholder="Introduzca costo" class="form-control mb-4" autocomplete="off" />
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['costo_principal'].valid && (form.controls['costo_principal'].dirty || form.controls['costo_principal'].touched)"
                >
                  Este Campo es obligatorio
                </div>
              </div>
            </div>
            <div class="col-xs-12 col-sm-12 col-md-6 col-lg-4">
              <div class="from-group">
                <label class="control-label">Precio venta: <span style="color: red">*</span></label>
                <input type="Number" formControlName="precio_principal" placeholder="Introduzca precio" class="form-control mb-4" autocomplete="off" />
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['precio_principal'].valid && (form.controls['precio_principal'].dirty || form.controls['precio_principal'].touched)"
                >
                  Este Campo es obligatorio
                </div>
              </div>
            </div>
          </div>
          <hr *ngIf="form.controls['medida'].value === 'Caja'" class="raya" />
          <div class="row" *ngIf="form.controls['medida'].value === 'Caja'">
            <span class="w-100 ml-3 text-green">Contenido Caja</span>
            <!-- <div class="col-xs-12 col-sm-12 {{ vendersePorSelected ? 'col-md-4' : 'col-md-6' }}">
              <div class="from-group">
                <label class="control-label">Venderse por: <span style="color: red">*</span></label>
                <select formControlName="medida_contenido" class="form-control mb-4" value="">
                  <option value="" disabled selected hidden>Tipo</option>
                  <option value="Libra">Libra</option>
                  <option value="Caja">Paquete</option>
                  <option value="Unidad">Unidad</option>
                  <option value="Unidad">Saco</option>
                </select>
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['medida'].valid && (form.controls['medida'].dirty || form.controls['medida'].touched)">
                  Seleccione una opcion
                </div>
              </div>
            </div> -->
            <div class="col-xs-12 col-sm-12 col-md-4">
              <div class="from-group">
                <label class="control-label">Contiene: </label>
                <input type="Number" formControlName="cantidad_contenido_padre" class="form-control mb-4" autocomplete="off" />
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['costo'].valid && (form.controls['costo'].dirty || form.controls['costo'].touched)">
                  Este Campo es obligatorio
                </div>
              </div>
            </div>
            <div class="col-xs-12 col-sm-12 col-md-8">
              <div class="from-group">
                <label class="control-label text-transparent">medida </label>
                <select formControlName="medida_contenido_hijo" class="form-control mb-4" value="">
                  <option value="" disabled selected hidden>Seleccione</option>
                  <!-- <option value="Unidad">Libra</option> -->
                  <option value="Unidad">Unidad</option>
                  <option value="Unidad">Sobre</option>
                  <option value="Unidad">Frasco</option>
                </select>
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['precio'].valid && (form.controls['precio'].dirty || form.controls['precio'].touched)">
                  Este Campo es obligatorio
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class=" col-md-8  col-sm8  col-lg-8  col-xs-12 mt-3">
              <div class="from-group">
                <a class="btn mr-2" id="btn-gris" (click)="atras()">Atras</a>
                <input [disabled]="!form.valid" type="submit" class="btn" value="{{ boton }}" id="btn-verde" />
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-xs-12 col-md-6">
    <h1>Listado articulos</h1>
    <div class="card cardPrincipal ">
      <app-tablas *ngIf="listaArticulos.length > 0 && info" [info]="info" [data]="listaArticulos"></app-tablas>
    </div>
  </div>
</div>
