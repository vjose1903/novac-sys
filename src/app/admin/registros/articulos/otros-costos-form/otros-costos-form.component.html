<div style="height: 100%">
  <div class="rowRegistro">
    <div class="formulario">
      <h3 class="mb-1">Formulario</h3>
      <div class="card card-padding sombra">
        <form [formGroup]="form">
          <div class="row">
            <div class="col-12 p-0">
              <div class="form-group mb-3" [appMsgError]="'descripcion'" [form]="form">
                <label class="control-label">Descripción: <span style="color: red">*</span></label>
                <input
                  (keyup)="capitalice('descripcion', $event.target.value, form)"
                  (focus)="$event.target.select()"
                  type="text"
                  id="descripcion"
                  formControlName="descripcion"
                  class="form-control"
                  autocomplete="off"
                />
                <span id="msgContainer_descripcion"></span>
              </div>
            </div>

            <div class="col-12 p-0">
              <div class="form-group mb-3" [appMsgError]="'key'" [form]="form">
                <label class="control-label">Clave: <span style="color: red">*</span></label>
                ({{ !!otroCostoSelect }})
                <input (keyup)="capitalice('key', $event.target.value, form)" (focus)="$event.target.select()" type="text" id="key" formControlName="key" class="form-control" autocomplete="off" />
                <span id="msgContainer_key"></span>
              </div>
            </div>

            <div class="col-6 pl-0">
              <div class="form-group mb-3" [appMsgError]="'costo'" [form]="form">
                <label class="control-label">Costo: <span style="color: red">*</span></label>
                <input (focus)="$event.target.select()" type="text" id="costo" formControlName="costo" class="form-control" autocomplete="off" (blur)="revisarPrecio('costo')"/>
                <span id="msgContainer_costo"></span>
              </div>
            </div>

            <div class="col-6 pr-0">
              <div class="form-group mb-3" [appMsgError]="'precio'" [form]="form">
                <label class="control-label">Precio: <span style="color: red">*</span></label>
                <input (focus)="$event.target.select()" type="text" id="precio" formControlName="precio" class="form-control" autocomplete="off" (blur)="revisarPrecio('precio')"/>
                <span id="msgContainer_precio"></span>
              </div>
            </div>
          </div>
        </form>

        <div class="mt-4">
          <a *ngIf="otroCostoSelect" class="btn mr-2" id="btn-blanco" (click)="borrar()">Cancelar</a>
          <input [disabled]="!form.valid" (click)="submit()" type="submit" class="btn" value="{{ boton }}" id="btn-verde" />
        </div>
      </div>
    </div>

    <div class="listado">
      <div class="titulo"><h3 class="mb-1">Listado</h3></div>

      <div #cardTabla id="cardTabla" class="card cardListados cardDiv">
        <app-tablas
          class="h-100"
          *ngIf="listado && info"
          [padre]="cardTabla"
          [info]="info"
          [data]="listado"
          [focusRow]="false"
          [botones]="botones"
          (DevolverInfo)="editarItem($event)"
          (DELETE)="eliminarReg($event)"
          [id_tabla]="'otrosCostos'"
          (paginateChange)="getOtrosCostos($event)"
        ></app-tablas>
      </div>
    </div>
  </div>
</div>
