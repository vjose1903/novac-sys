<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <h4 class="negrita mb-0">Registro de Bancos</h4>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" *ngIf="isCreando || formGroup.controls.id.value" class="form {{ isCreando || formGroup.controls.id.value ? 'showForm' : 'hideForm' }} ">
          <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
            <h4 class="mb-0">Formulario</h4>
          </div>

          <div class="card cardFormClass">
            <form [formGroup]="formGroup" (keydown.enter)="$event.stopPropagation()">
              <div class="row">
                <div class="col-12 p-0">
                  <form-auto-complete [formControlName]="bancoFormAttr.nombre" [(config)]="nombreBancoConfig" [suggestions]="bancosList" [multiple]="false" (keydownEnter)="saltar(nombreBancoConfig.fieldId)"></form-auto-complete>
                </div>

                <div class="col-6 pl-0">
                  <label class="control-label">Rnc: <span style="color: red">*</span></label>
                  <div class="form-group" appMsgError="rnc" [form]="formGroup">
                    <!-- (keydown.enter)="saltar('campoNombre')" -->
                    <p-inputMask
                      mask="999-99999-9"
                      tabindex="-1"
                      class="w-100"
                      styleClass="form-control with-right-btn"
                      (keydown.enter)="saltar(htmlServ.getId($event))"
                      [inputId]="bancoFormFieldId[bancoFormAttr.rnc]"
                      placeholder="___-_____-_"
                      [formControlName]="bancoFormAttr.rnc"
                      [autoClear]="false"
                    ></p-inputMask>
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-6 pr-0">
                  <div class="form-group" appMsgError="telefono" [form]="formGroup">
                    <label class="control-label">Telefono: <span style="color: red">*</span></label>

                    <!-- (keydown.enter)="saltar('campoEmail')" -->
                    <p-inputMask
                      mask="(999) 999-9999"
                      tabindex="-1"
                      styleClass="form-control"
                      class="w-100"
                      (keydown.enter)="saltar(htmlServ.getId($event))"
                      [inputId]="bancoFormFieldId[bancoFormAttr.telefono]"
                      placeholder="(___) ___-____"
                      [formControlName]="bancoFormAttr.telefono"
                      [autoClear]="false"
                    ></p-inputMask>

                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group" appMsgError="comentario" [form]="formGroup">
                    <label class="control-label">Comentario </label>
                    <textarea
                      [id]="bancoFormFieldId[bancoFormAttr.comentario]"
                      [appCapitalice]="'formGroup'"
                      [formControlName]="bancoFormAttr.comentario"
                      (blur)="htmlServ.trimValue(htmlServ.getId($event), formGroup.controls.comentario)"
                      (keyup)="htmlServ.trimStartValue(htmlServ.getId($event), formGroup.controls.comentario)"
                      (keydown.enter)="saltar(htmlServ.getId($event))"
                      class="form-control"
                      cols="30"
                      rows="3"
                      tabindex="-1"
                    ></textarea>
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0 mb-3">
                  <small class="ml-2" style="color: grey">Ejecutivo de cuentas</small>
                  <div class="ejecutivoDiv mt-2">
                    <div class="row w-100 h-100">
                      <div class="col-12 p-0"></div>
                      <div class="col-6 pl-0">
                        <div class="form-group mb-2" appMsgError="ejecutivo_cuenta" [form]="formGroup">
                          <label class="control-label">Nombre: <span style="color: red">*</span></label>
                          <input
                            type="text"
                            [formControlName]="bancoFormAttr.ejecutivo_cuenta"
                            [appCapitalice]="'formGroup'"
                            (keydown.enter)="saltar(htmlServ.getId($event))"
                            [id]="bancoFormFieldId[bancoFormAttr.ejecutivo_cuenta]"
                            class="form-control"
                            tabindex="-1"
                            autocomplete="off"
                          />
                          <span id="msgContainer"></span>
                        </div>
                      </div>

                      <div class="col-6 pr-0">
                        <div class="form-group mb-2" appMsgError="telefono_ejecutivo_cuenta" [form]="formGroup">
                          <label class="control-label">Telefono: <span style="color: red">*</span></label>

                          <!-- (keydown.enter)="saltar('campoEmail')" -->
                          <p-inputMask
                            mask="(999) 999-9999"
                            tabindex="-1"
                            styleClass="form-control"
                            class="w-100"
                            (keydown.enter)="saltar(htmlServ.getId($event))"
                            [inputId]="bancoFormFieldId[bancoFormAttr.telefono_ejecutivo_cuenta]"
                            placeholder="(___) ___-____"
                            [formControlName]="bancoFormAttr.telefono_ejecutivo_cuenta"
                            [autoClear]="false"
                          ></p-inputMask>

                          <span id="msgContainer"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <small class="ml-2" style="color: grey">Cuentas Bancarias</small>

                    <btn-icon-circular [id]="'btnFormCuentasBancarias'" [icon]="'fa-solid fa-plus'" [size]="'size-sm'" pTooltip="Agregar cuenta Bancaria" tooltipPosition="right" (clickFunction)="openModalCuentasBancarias()"> </btn-icon-circular>
                  </div>
                  <div class="formCuentasDiv">
                    <ng-container *ngIf="formGroup && formGroup.controls?.cuentas_bancarias.value?.length; else elseTemplate">
                      <div class="row">
                        <div class="col-12 col-md-6 p-1 pb-2" *ngFor="let cuenta of formGroup.controls.cuentas_bancarias.value">
                          <div class="divContainerCuentaBancaria" (click)="openModalCuentasBancarias(cuenta)">
                            <div class="innerGrid">
                              <div class="cuenta_divisa">
                                <img-component class="d-block" style="width: 2rem" [imagenSrc]="imgServ.getImgUrlServer(imgServ.getDivisaInfoById(cuenta.divisa_id, 'imagen.file_name'))"></img-component>
                              </div>

                              <div class="cuenta_info d-flex justify-content-center">
                                <h5 class="control-label mb-0">{{ cuenta.numero_cuenta }}</h5>
                                <small class="tipo_cuenta">{{ cuenta.tipo_cuenta_bancaria }}</small>
                              </div>
                            </div>
                            <small class="cuenta_comentario mt-2">{{ cuenta.descripcion }}</small>
                          </div>
                        </div>
                      </div>
                    </ng-container>
                    <ng-template #elseTemplate>
                      <h6 class="no-cuentas-message p-2 w-100 text-center mb-0">No tiene cuentas bancarias registradas</h6>
                    </ng-template>
                  </div>
                </div>
              </div>
            </form>
            <div class="p-0 mt-5 d-flex justify-content-between">
              <div class="d-flex gap-2">
                <button (click)="borrar()" class="btn btn-blanco" style="max-width: 6rem">Borrar</button>
                <!-- <button type="submit" (click)="test()" class="btn btn-gris" style="max-width: 6rem">test</button> -->

                <button [disabled]="formIsInvalid()" type="submit" (click)="requests()" class="btn btn-verde" style="max-width: 6rem">{{ formGroup.controls.id.value ? 'Editar' : 'Guardar' }}</button>
              </div>
              <div>
                <button class="btn btn-blanco" style="max-width: 6rem" (click)="borrar(false)">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <div class="list {{ isCreando || formGroup.controls.id.value ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 class="mb-0">Listado de bancos</h4>
          <div class="d-flex">
            <span [pTooltip]="formGroup.controls.id.value || isCreando ? 'Para abrir el formulario de tipo cuenta bancaria, debe de cerrar el formulario de articulos.' : ''" tooltipPosition="left">
              <button *ngxPermissionsOnly="allPermisosTipoCuentaBancaria" [disabled]="formGroup.controls.id.value || isCreando" (click)="openModalTipoCuentasBancarias()" class="btn btn-gris mr-3">Tipo cuentas bancarias</button>
            </span>
            <button *ngxPermissionsOnly="permissions.banco.create" [disabled]="formGroup.controls.id.value || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
          </div>
        </div>
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="listaBancos" [seleccionado]="formGroup.controls.id.value?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
