<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <h4 class="negrita mb-0">Registro de Bancos</h4>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" *ngIf="isCreando || bancoSelected" class="form {{ isCreando || bancoSelected ? 'showForm' : 'hideForm' }} ">
          <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
            <h4 class="mb-0">Formulario</h4>
          </div>

          <div class="card cardFormClass">
            <form [formGroup]="formGroup" (keydown.enter)="$event.preventDefault()">
              <div class="row">
                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="'nombre'" [form]="formGroup">
                    <label class="control-label">Nombre: <span style="color: red">*</span></label>
                    <input type="text" formControlName="nombre" [appCapitalice]="'formGroup'" id="campoNombre" class="form-control" autocomplete="off" />
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-6 pl-0">
                  <label class="control-label">Rnc: <span style="color: red">*</span></label>
                  <div class="form-group" [appMsgError]="'rnc'" [form]="formGroup">
                    <!-- (keydown.enter)="saltar('campoNombre')" -->
                    <p-inputMask mask="999-99999-9" tabindex="-1" class="w-100" styleClass="form-control with-right-btn" inputId="rnc" placeholder="___-_____-_" formControlName="rnc" [autoClear]="false"></p-inputMask>
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-6 pr-0">
                  <div class="form-group" [appMsgError]="'telefono'" [form]="formGroup">
                    <label class="control-label">Telefono: <span style="color: red">*</span></label>

                    <!-- (keydown.enter)="saltar('campoEmail')" -->
                    <p-inputMask mask="(999) 999-9999" tabindex="-1" styleClass="form-control" class="w-100" inputId="campoTelefono" placeholder="(___) ___-____" formControlName="telefono" [autoClear]="false"></p-inputMask>

                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="'comentario'" [form]="formGroup">
                    <label class="control-label">Comentario <span style="color: red">*</span></label>
                    <textarea id="campoComentario" [appCapitalice]="'formGroup'" formControlName="comentario" class="form-control" cols="30" rows="3"></textarea>
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="ejecutivoDiv">
                    <div class="row w-100 h-100">
                      <div class="col-12 p-0">
                        <h5 class="mb-4">Ejecutivo de cuentas</h5>
                      </div>
                      <div class="col-6 pl-0">
                        <div class="form-group mb-2" [appMsgError]="'ejecutivo_cuenta'" [form]="formGroup">
                          <label class="control-label">Nombre: <span style="color: red">*</span></label>
                          <input type="text" formControlName="ejecutivo_cuenta" [appCapitalice]="'formGroup'" id="campoNombre" class="form-control" autocomplete="off" />
                          <span id="msgContainer"></span>
                        </div>
                      </div>

                      <div class="col-6 pr-0">
                        <div class="form-group mb-2" [appMsgError]="'telefono_ejecutivo_cuenta'" [form]="formGroup">
                          <label class="control-label">Telefono: <span style="color: red">*</span></label>

                          <!-- (keydown.enter)="saltar('campoEmail')" -->
                          <p-inputMask mask="(999) 999-9999" tabindex="-1" styleClass="form-control" class="w-100" inputId="campoTelefono" placeholder="(___) ___-____" formControlName="telefono_ejecutivo_cuenta" [autoClear]="false"></p-inputMask>

                          <span id="msgContainer"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </form>
            <div class="form-group p-0 mt-5" style="display: flex; justify-content: space-between">
              <div>
                <button (click)="borrar()" class="btn mr-2 btn-blanco" style="max-width: 6rem">Borrar</button>

                <button [disabled]="formIsInvalid()" type="submit" (click)="requests()" class="btn ml-2 btn-verde" style="max-width: 6rem">{{ botonLabel }}</button>
              </div>
              <div>
                <button class="btn btn-blanco ml-2" style="max-width: 6rem" (click)="borrar(); isCreando = false">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <div class="list {{ isCreando || bancoSelected ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 class="mb-0">Listado de bancos</h4>
          <button *ngxPermissionsOnly="permissions.banco.create" [disabled]="bancoSelected || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
        </div>
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div  class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="listaBancos" [seleccionado]="bancoSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
