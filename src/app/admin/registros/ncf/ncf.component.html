<div class="row" style="height: calc(100% - 60px)">
  <div class="col-5 contenedorRegistro">
    <h4 class="negrita">{{ titulo }}</h4>
    <div class="card card-padding sombra">
      <div class="row">
        <div class="col-12 p-0">
          <div class="form-group">
            <label class="control-label">Tipo comprobante: <span style="color: red">*</span></label>
            <select
              (keydown.enter)="saltar('campoDesde')"
              id="tipo"
              [(ngModel)]="tipo_articulo_id"
              (change)="selectTipoFactura($event.target.value)"
              (blur)="checkTipoArticuloSelect()"
              class="form-control"
            >
              <option value="{{ -1 }}" disabled>Tipo de comprobantes</option>
              <ng-container *ngFor="let tipo of lista_tipos_facturas">
                <option *ngIf="tipo.referencia" value="{{ tipo.id }}">{{ tipo.descripcion }}</option>
              </ng-container>
            </select>
            <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="aletarTipoArticulo">Debe de seleccionar tipo de comprobante</div>
          </div>
        </div>
        <div class="col-6 p-0 pr-2">
          <div class="form-group mt-2">
            <label class="control-label">Desde: <span style="color: red">*</span></label>
            <input
              id="campoDesde"
              (keydown.enter)="saltar('campoHasta')"
              type="number"
              class="form-control input_cantidad"
              [(ngModel)]="Desde"
              (keyup)="checkInputs('desde')"
              (blur)="checkInputs('desde')"
            />
            <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="desdeAlert">Campo obligatorio.</div>
          </div>
        </div>
        <div class="col-6 p-0 pl-2">
          <div class="form-group mt-2">
            <label class="control-label">Hasta: <span style="color: red">*</span></label>
            <input
              id="campoHasta"
              (keydown.enter)="saltar('campoFechaCompra')"
              type="number"
              class="form-control input_cantidad"
              [(ngModel)]="Hasta"
              (keyup)="checkInputs('hasta')"
              (blur)="checkInputs('hasta')"
            />
            <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="hastaAlert">Campo obligatorio.</div>
          </div>
        </div>
        <div class="col-6 p-0 pr-2">
          <div class="form-group mt-2">
            <label class="control-label">Fecha compra: <span style="color: red">*</span></label>
            <input
              type="text"
              id="campoFechaCompra"
              (keydown.enter)="saltar('campoFechaValida')"
              [bsConfig]="dpConfig"
              placeholder="dd/mm/aaaa"
              class="form-control"
              [value]="fechaCompra"
              [(ngModel)]="fechaCompra"
              #dp="bsDatepicker"
              placement="bottom"
              bsDatepicker
              (ngModelChange)="setDateInputs(fechaCompra)"
            />
          </div>
        </div>
        <div class="col-6 p-0 pl-2">
          <div class="form-group mt-2">
            <label class="control-label">Fecha validez: </label>
            <input
              type="text"
              id="campoFechaValida"
              (keydown.enter)="saltar('send')"
              [bsConfig]="dpConfigValidez"
              placeholder="dd/mm/aaaa"
              [value]="fechaValidez"
              class="form-control"
              [(ngModel)]="fechaValidez"
              #dp="bsDatepicker"
              placement="bottom"
              bsDatepicker
            />
          </div>
        </div>
        <div *ngIf="is_editando" class="col-12">
          <div class="row">
            <div class="col-6">
              <div class="d-flex">
                <h5>Usado:</h5>
                <i class="ml-3 mt-1 {{ ncfSelected.usado ? 'fas fa-check' : 'fas fa-times' }} {{ ncfSelected.usado ? 'text-green' : 'text-red' }}"></i>
              </div>
            </div>
            <div class="col-6">
              <div class="d-flex">
                <h5>Activo:</h5>
                <i class="ml-3 mt-1 {{ ncfSelected.estado ? 'fas fa-check' : 'fas fa-times' }}  {{ ncfSelected.estado ? 'text-green' : 'text-red' }}"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 p-0 mt-3">
          <div class="form-group">
            <a class="btn mr-2" id="btn-blanco" (click)="borrar()">Borrar</a>
            <input [disabled]="formIsInvalid()" (click)="submit()" type="submit" class="btn ml-2" value="{{ boton }}" id="btn-verde" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-7">
    <h4>Listado articulos</h4>
    <div #cardTabla id="cardTabla" class="card cardListados">
      <div>
        <select class="form-control filtroNCF" [(ngModel)]="filtro" (change)="filtrarNCF()">
          <option value="0" disabled>Filtro por tipo de articulos</option>
          <option value="todos">Todos</option>
          <option *ngFor="let tipo of lista_tipos_facturas" value="{{ tipo.id }}">{{ tipo.descripcion }}</option>
        </select>
      </div>
      <app-tablas
        *ngIf="listaNCF && info"
        [padre]="cardTabla"
        [info]="info"
        [data]="listaNCF"
        [focusRow]="false"
        [id_tabla]="'lista_ncf'"
        [quitarAScorll]="-20"
        [botones]="botones"
        (DevolverInfo)="editarItem($event)"
        (paginateChange)="getPaquetesNCF($event)"
        (DELETE)="localAbrirModal($event)"
      ></app-tablas>
    </div>
  </div>
</div>
