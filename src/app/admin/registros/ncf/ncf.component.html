<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <h4 class="negrita mb-0">Registro de paquetes de comprobantes fiscales</h4>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" class="form {{ isCreando || ncfSelected ? 'showForm' : 'hideForm' }} " style="grid-template-rows: min-content min-content">
          <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
            <h4 class="mb-0">Formulario</h4>
          </div>
          <div class="card cardFormClass">
            <div class="row">
              <div class="col-12 p-0">
                <div class="form-group">
                  <label class="control-label">Tipo comprobante: <span style="color: red">*</span></label>
                  <select (keydown.enter)="saltar('campoDesde')" id="tipo" [(ngModel)]="tipo_articulo_id" (change)="selectTipoFactura(htmlServ.getValue($event))" (blur)="checkTipoArticuloSelect()" class="form-control">
                    <option value="{{ -1 }}" disabled>Tipo de comprobantes</option>
                    @for (tipo of lista_tipos_facturas; track tipo.id) { @if (tipo.referencia) {
                    <option value="{{ tipo.id }}">{{ tipo.descripcion }}</option>
                    } }
                  </select>
                  @if (aletarTipoArticulo) {
                  <div class="alerta text-danger ms-1" style="font-size: 12px">Debe de seleccionar tipo de comprobante</div>
                  }
                </div>
              </div>
              <div class="col-6 p-0 pe-2">
                <div class="form-group mt-2">
                  <label class="control-label">Desde: <span style="color: red">*</span></label>
                  <input id="campoDesde" (keydown.enter)="saltar('campoHasta')" type="number" class="form-control input_cantidad" [(ngModel)]="Desde" (keyup)="checkInputs('desde')" (blur)="checkInputs('desde')" />
                  @if (desdeAlert) {
                  <div class="alerta text-danger ms-1" style="font-size: 12px">Campo obligatorio.</div>
                  }
                </div>
              </div>
              <div class="col-6 p-0 ps-2">
                <div class="form-group mt-2">
                  <label class="control-label">Hasta: <span style="color: red">*</span></label>
                  <input id="campoHasta" (keydown.enter)="saltar('campoFechaCompra')" type="number" class="form-control input_cantidad" [(ngModel)]="Hasta" (keyup)="checkInputs('hasta')" (blur)="checkInputs('hasta')" />
                  @if (hastaAlert) {
                  <div class="alerta text-danger ms-1" style="font-size: 12px">Campo obligatorio.</div>
                  }
                </div>
              </div>
              <div class="col-6 p-0 pe-2">
                <div class="form-group mt-2">
                  <label class="control-label">Fecha compra: <span style="color: red">*</span></label>
                  <p-datepicker
                    inputId="campoFechaCompra"
                    [(ngModel)]="fechaCompra"
                    dateFormat="dd/mm/yy"
                    placeholder="dd/mm/aaaa"
                    (onSelect)="setDateInputs(fechaCompra)"
                    (onClose)="setDateInputs(fechaCompra)"
                    (keydown.enter)="saltar('campoFechaValida')"
                  ></p-datepicker>
                </div>
              </div>
              <div class="col-6 p-0 ps-2">
                <div class="form-group mt-2">
                  <label class="control-label">Fecha validez: </label>
                  <p-datepicker inputId="campoFechaValida" [(ngModel)]="fechaValidez" dateFormat="dd/mm/yy" placeholder="dd/mm/aaaa" (keydown.enter)="saltar('send')"></p-datepicker>
                </div>
              </div>
              @if (is_editando) {
              <div class="col-12 p-0">
                <div class="row">
                  <div class="col-6">
                    <div class="d-flex">
                      <h5>Usado:</h5>
                      <i class="ms-3 mt-1 {{ ncfSelected.usado ? 'fas fa-check' : 'fas fa-times' }} {{ ncfSelected.usado ? 'text-green' : 'text-red' }}"></i>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="d-flex">
                      <h5>Activo:</h5>
                      <i class="ms-3 mt-1 {{ ncfSelected.estado ? 'fas fa-check' : 'fas fa-times' }}  {{ ncfSelected.estado ? 'text-green' : 'text-red' }}"></i>
                    </div>
                  </div>
                </div>
              </div>
              }
              <div class="col-12 p-0 mt-3" style="display: flex; justify-content: space-between">
                <div>
                  <a class="btn me-2" id="btn-blanco" (click)="borrar()">Borrar</a>
                  <input [disabled]="formIsInvalid()" (click)="submit()" type="submit" class="btn ms-2" value="{{ boton }}" id="btn-verde" />
                </div>
                <div>
                  <input class="btn ms-2" value="Cerrar" id="btn-blanco" (click)="borrar(); isCreando = false" style="max-width: 6rem" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <div class="list {{ isCreando || ncfSelected ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 class="mb-0">Listado de comprobantes</h4>
          <button *ngxPermissionsOnly="permissions.secuencia_comprobante.create" [disabled]="ncfSelected || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
        </div>
        
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="listaNCF" [seleccionado]="ncfSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>

            <div class="filtroNCF" style="top: 0.6rem; left: 1rem">
              <select class="form-control select" [(ngModel)]="filtro" (change)="filtrarNCF()">
                <option value="0" disabled>Filtrar por tipo</option>
                <option value="todos">Todos</option>
                @for (tipo of lista_tipos_facturas; track tipo.id) {
                <option value="{{ tipo.id }}">{{ tipo.descripcion }}</option>
                }
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
