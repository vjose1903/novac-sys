<h5 class="mb-0">
  Periodo Fiscal <strong>{{ fecha_inicio }}</strong> - <strong>{{ fecha_cierre }}</strong>
</h5>

<div class="meses-container">
  <div
    *ngFor="let mes of meses"
    class="mes-item"
    [ngClass]="{ closed: detalle_periodo_fiscal[mes] == false, open: detalle_periodo_fiscal[mes] == true, hold: detalle_periodo_fiscal[mes] == null }"
    (click)="openOverlay($event, overlayCierreMensual, mes, detalle_periodo_fiscal[mes])">
    {{ mes }}
  </div>

  <p-popover #overlayCierreMensual [dismissable]="true" styleClass="no-carret cierreMensualOverlay" appendTo="body" (onHide)="cerrarOverlay()">
    <ng-template pTemplate>
      <div id="overlayCierreMensual">
        <ul class="overlayCierreMensual" role="menu">
          <li id="overlayCierreMensual-open" role="menuitem" class="c-pointer" [ngClass]="{ disable: disableOverlayOption('open') }" (click)="actionMonth('open')">
            <div class="d-flex align-items-center">
              <i class="fa-solid fa-folder-open mr-3"></i>
              <p id="dropdown-item" class="mr-3 mb-0">{{ overlay?.month_status == null ? 'Aperturar' : 'Reaperturar' }}</p>
            </div>
          </li>

          <li id="overlayCierreMensual-close" role="menuitem" class="c-pointer" [ngClass]="{ disable: disableOverlayOption('close') }" (click)="actionMonth('close')">
            <div class="d-flex align-items-center">
              <i class="fa-regular fa-folder mr-3"></i>
              <p id="dropdown-item" class="mr-3 mb-0">Cerrar</p>
            </div>
          </li>
        </ul>
      </div>
    </ng-template>
  </p-popover>
</div>
