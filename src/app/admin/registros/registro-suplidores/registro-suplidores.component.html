<div class="row" style="height: calc(100% - 60px)">
  <div class="col-5">
    <h4 class="negrita">{{ titulo }}</h4>
    <div class="contenedorRegistro">
      <div class="card card-padding sombra">
        <form [formGroup]="form" (ngSubmit)="submit(form)">
          <div class="row">
            <div class="col-md-6">
              <div>
                <label class="mr-2">
                  <input type="radio" value="1" class="mr-1" name="identificacion" id="identificacion-cedula" (click)="changeIdent(true)" />Cedula</label
                >
                <label>
                  <input type="radio" value="1" name="identificacion" id="identificacion-rnc" class="mr-1" (click)="changeIdent(false)" />Rnc
                  <span style="color: red">*</span>
                </label>
              </div>

              <div *ngIf="doc_is_cedula" class="form-group" [appMsgError]="'cedula'" [form]="form">
                <div class="input-group">
                  <input
                    type="text"
                    [textMask]="{ mask: pattern.cedula }"
                    class="form-control"
                    formControlName="cedula"
                    placeholder="___-_______-_"
                    autocomplete="off"
                    (keyup)="checkDocumento('cedula', $event)"
                  />

                  <div
                    (click)="setDocumentoPrincipal('cedula')"
                    class="input-group-append"
                    mdbTooltip="{{ doc_principal === 'cedula' ? 'Principal' : 'Seleccionar como principal' }}"
                    placement="right"
                  >
                    <span class="input-group-text"><i class="{{ doc_principal === 'cedula' ? 'far fa-star text-warning' : 'far fa-square' }}"></i></span>
                  </div>
                </div>
                <span id="msgContainer_cedula"></span>
              </div>

              <div *ngIf="!doc_is_cedula" class="form-group" [appMsgError]="'rnc'" [form]="form">
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    [textMask]="{ mask: pattern.rnc }"
                    formControlName="rnc"
                    placeholder="___-_____-_"
                    autocomplete="off"
                    (keyup)="checkDocumento('rnc', $event)"
                  />

                  <div
                    (click)="setDocumentoPrincipal('rnc')"
                    class="input-group-append"
                    mdbTooltip="{{ doc_principal === 'rnc' ? 'Principal' : 'Seleccionar como principal' }}"
                    placement="right"
                  >
                    <span class="input-group-text"><i class="{{ doc_principal === 'rnc' ? 'far fa-star text-warning' : 'far fa-square' }}"></i></span>
                  </div>
                </div>
                <span id="msgContainer_rnc"></span>
              </div>
            </div>

            <div class="col-md-6">
              <div class="form-group mb-2" [appMsgError]="'telefono'" [form]="form">
                <label class="control-label">Telefono: <span style="color: red">*</span></label>
                <input type="text" class="form-control" [textMask]="{ mask: pattern.phone }" formControlName="telefono" placeholder="(___) ___-____" autocomplete="off" />
                <span id="msgContainer_telefono"></span>
              </div>
            </div>

            <div class="col-md-12">
              <div class="form-group" [appMsgError]="'nombre'" [form]="form">
                <label class="control-label">Nombre: <span style="color: red">*</span></label>
                <input
                  type="text"
                  formControlName="nombre"
                  (keyup)="capitalice('nombre', $event.target.value)"
                  placeholder="Introduzca nombre"
                  class="form-control"
                  id="campoNombre"
                  autocomplete="off"
                  autofocus
                />
                <span id="msgContainer_nombre"></span>
              </div>
            </div>

            <div class="col-md-12">
              <div class="form-group" [appMsgError]="'email'" [form]="form">
                <label class="control-label">Email:</label>
                <input type="text" formControlName="email" placeholder="Introduzca email" class="form-control" autocomplete="off" />

                <span id="msgContainer_email"></span>
              </div>
            </div>

            <div class="col-md-12">
              <div class="form-group" [appMsgError]="'direccion'" [form]="form">
                <label class="control-label">Direccion: <span style="color: red">*</span></label>
                <textarea
                  formControlName="direccion"
                  (keyup)="capitalice('direccion', $event.target.value)"
                  placeholder="Ingrese la direccion"
                  cols="100"
                  rows="2"
                  class="form-control"
                ></textarea>
                <span id="msgContainer_direccion"></span>
              </div>
            </div>
          </div>
          <div class="col-md-12 p-0">
            <div class="form-group">
              <a class="btn mr-2" id="btn-blanco" (click)="borrar()">Borrar</a>
              <input [disabled]="abilitarSend()" type="submit" class="btn" value="{{ boton }}" id="btn-verde" />
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-7">
    <h4>Listado Suplidores</h4>
    <div #cardTabla id="cardTabla" class="card cardListados">
      <app-tablas
        *ngIf="listaSuplidores && info"
        [padre]="cardTabla"
        [info]="info"
        [botones]="botones"
        (DevolverInfo)="editarItem($event)"
        (DELETE)="abrirModal('borrar', $event.ARG)"
        [quitarAScorll]="-20"
        [data]="listaSuplidores"
        (paginateChange)="getSuplidores($event)"
        [focusRow]="false"
      ></app-tablas>
    </div>
  </div>
</div>
