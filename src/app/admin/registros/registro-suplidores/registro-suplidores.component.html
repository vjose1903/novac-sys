<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <div class="screen-title-block">
      <span class="screen-module-kicker">Registros</span>
      <h4 class="negrita mb-0">Registro de suplidor</h4>
    </div>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" class="form {{ isCreando || suplidorSelected ? 'showForm' : 'hideForm' }} ">
            <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
              <h4 class="mb-0">Formulario</h4>
            </div>
            <div class="card cardFormClass">
              @if (consultandoDocumento()) {
                <span class="form-badge">Consultando documento de identidad...</span>
              }
              <form [formGroup]="form">
                <div class="row">
                  <div class="col-6 p-0 pe-2">
                    <div>
                      <label class="me-2"> <input type="radio" value="1" class="me-1" name="identificacion" id="identificacion-cedula" (click)="changeIdent(true)" />Cedula</label>
                      <label>
                        <input type="radio" value="1" name="identificacion" id="identificacion-rnc" class="me-1" (click)="changeIdent(false)" />Rnc
                        <span style="color: red">*</span>
                      </label>
                    </div>
                    @if (doc_is_cedula) {
                      <div class="form-group" [appMsgError]="'cedula'" [form]="form">
                        <div class="input-group d-flex" style="flex-wrap: nowrap">
                          <div class="input-icon trailing muted">
                            <p-inputMask
                              (keydown.enter)="saltar('campoTelefono')"
                              (keyup)="checkDocumento('cedula', $event)"
                              mask="999-9999999-9"
                              tabindex="-1"
                              styleClass="form-control with-right-btn"
                              inputId="cedula"
                              placeholder="___-_______-_"
                              formControlName="cedula"
                              [autoClear]="false">
                            </p-inputMask>
                            @if (consultandoDocumento()) {
                              <i class="pi pi-spin pi-spinner"></i>
                            }
                          </div>
                          <div (click)="setDocumentoPrincipal('cedula')" class="input-group-append" pTooltip="{{ doc_principal === 'cedula' ? 'Principal' : 'Seleccionar como principal' }}" tooltipPosition="right">
                            <span class="input-group-text sufijo">
                              <i class="{{ doc_principal === 'cedula' ? 'far fa-star text-warning' : 'far fa-square' }}"></i>
                            </span>
                          </div>
                        </div>
                        <span id="msgContainer_cedula"></span>
                      </div>
                    }
                    @if (!doc_is_cedula) {
                      <div class="form-group" [appMsgError]="'rnc'" [form]="form">
                        <div class="input-group d-flex" style="flex-wrap: nowrap">
                          <div class="input-icon trailing muted">
                            <p-inputMask
                              (keydown.enter)="saltar('campoTelefono')"
                              (keyup)="checkDocumento('rnc', $event)"
                              mask="999-99999-9"
                              tabindex="-1"
                              styleClass="form-control with-right-btn"
                              inputId="rnc"
                              placeholder="___-_____-_"
                              formControlName="rnc"
                              [autoClear]="false">
                            </p-inputMask>
                            @if (consultandoDocumento()) {
                              <i class="pi pi-spin pi-spinner"></i>
                            }
                          </div>
                          <div (click)="setDocumentoPrincipal('rnc')" class="input-group-append" pTooltip="{{ doc_principal === 'rnc' ? 'Principal' : 'Seleccionar como principal' }}" tooltipPosition="right">
                            <span class="input-group-text sufijo">
                              <i class="{{ doc_principal === 'rnc' ? 'far fa-star text-warning' : 'far fa-square' }}"></i>
                            </span>
                          </div>
                        </div>
                        <span id="msgContainer_rnc"></span>
                      </div>
                    }
                  </div>
                  <div class="col-6 p-0 ps-2">
                    <div class="form-group mb-2" [appMsgError]="'telefono'" [form]="form">
                      <label class="control-label">Telefono: <span style="color: red">*</span></label>
                      <p-inputMask
                        (keydown.enter)="saltar('campoNombre')"
                        mask="(999) 999-9999"
                        tabindex="-1"
                        styleClass="form-control"
                        inputId="campoTelefono"
                        placeholder="(___) ___-____"
                        formControlName="telefono"
                        [autoClear]="false"></p-inputMask>
                      <span id="msgContainer_telefono"></span>
                    </div>
                  </div>
                  <div class="col-12 p-0">
                    <div class="form-group" [appMsgError]="'nombre'" [form]="form">
                      <label class="control-label">Nombre: <span style="color: red">*</span></label>
                      <input
                        type="text"
                        formControlName="nombre"
                        (keyup)="capitalice('nombre', htmlServ.getValue($event))"
                        placeholder="Introduzca nombre"
                        class="form-control"
                        (keydown.enter)="saltar('campoEmail')"
                        id="campoNombre"
                        autocomplete="off"
                        autofocus />
                      <span id="msgContainer_nombre"></span>
                    </div>
                  </div>
                  <div class="col-12 p-0">
                    <div class="form-group" [appMsgError]="'email'" [form]="form">
                      <label class="control-label">Email:</label>
                      <input type="text" id="campoEmail" (keydown.enter)="saltar('campoDir')" formControlName="email" placeholder="Introduzca email" class="form-control" autocomplete="off" />
                      <span id="msgContainer_email"></span>
                    </div>
                  </div>
                  <div class="col-12 p-0">
                    <div class="form-group" [appMsgError]="'direccion'" [form]="form">
                      <label class="control-label">Direccion: <span style="color: red">*</span></label>
                      <textarea id="campoDir" formControlName="direccion" (keyup)="capitalice('direccion', htmlServ.getValue($event))" placeholder="Ingrese la direccion" cols="100" rows="3" class="form-control"></textarea>
                      <span id="msgContainer_direccion"></span>
                    </div>
                  </div>
                  <div class="col-12 p-0 mt-3">
                    <div class="col-12 form-group" style="display: flex; justify-content: space-between">
                      <div>
                        <a class="btn me-2" id="btn-blanco" (click)="borrar()">Borrar</a>
                        <input [disabled]="formIsInvalid()" (click)="submit()" class="btn ms-2" value="{{ boton }}" id="btn-verde" style="max-width: 6rem" />
                      </div>
                      <div>
                        <input class="btn ms-2" value="Cerrar" id="btn-blanco" (click)="borrar(); isCreando = false" style="max-width: 6rem" />
                      </div>
                    </div>
                  </div>
                </div>
              </form>
            </div>
        </div>
      </ng-container>

      <div class="list {{ isCreando || suplidorSelected ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 classs="mb-0">Listado Suplidores</h4>
          <button *ngxPermissionsOnly="permissions.suplidor.create" [disabled]="suplidorSelected || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
        </div>
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="listaSuplidores" [seleccionado]="suplidorSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
