<div class="row" style="height: calc(100% - 60px)">
  <div class="col-xs-12 col-md-6">
    <h4>{{ titulo }}</h4>
    <div class="contenedorRegistro">
      <div class="card card-padding sombra">
        <form [formGroup]="form" (ngSubmit)="submit(form)">
          <div class="row">
            <div class="col-md-12 ">
              <div class="form-group">
                <label class="control-label">Nombre: <span style="color: red">*</span></label>
                <input type="text" formControlName="nombre" placeholder="Introduzca nombre" class="form-control" id="campoNombre" autocomplete="off" autofocus />
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['nombre'].valid && (form.controls['nombre'].dirty || form.controls['nombre'].touched)">
                  Este Campo es obligatorio
                </div>
              </div>
            </div>

            <div class="col-md-6 ">
              <div class="from-group mb-2">
                <label class="control-label">Telefono: <span style="color: red">*</span></label>
                <input type="text" class="form-control" [textMask]="{ mask: phoneMask }" formControlName="telefono" placeholder="(___) ___-____" autocomplete="off" />
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['telefono'].valid && (form.controls['telefono'].dirty || form.controls['telefono'].touched)"
                >
                  Introduzca el numero de telefono
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="from-group mb-2">
                <label class="control-label">Rnc: <span style="color: red">*</span></label>
                <input type="text" class="form-control" [textMask]="{ mask: rncMask }" formControlName="rnc" placeholder="___-_____-_" autocomplete="off" />
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="validarRayaAbajo('rnc') && form.controls['rnc'].dirty">
                  rnc incompleto
                </div>
              </div>
            </div>

            <div class="col-md-12 ">
              <div class="form-group">
                <label class="control-label">Email:</label>
                <input type="text" formControlName="email" placeholder="Introduzca email" class="form-control" autocomplete="off" />

                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['email'].valid && (form.controls['email'].dirty || form.controls['email'].touched)">
                  Introduzca un email valido
                </div>
              </div>
            </div>

            <div class="col-md-12 ">
              <div class="form-group">
                <label class="control-label">Direccion:</label>
                <textarea formControlName="direccion" placeholder="Ingrese la direccion" cols="100" rows="2" class="form-control"></textarea>
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['direccion'].valid && (form.controls['direccion'].dirty || form.controls['direccion'].touched)"
                >
                  Introduzca una direccion valida
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="from-group">
              <a class="btn mr-2" id="btn-gris" (click)="atras()">Atras</a>
              <a class="btn mr-2" id="btn-blanco" (click)="borrar()">Borrar</a>
              <input [disabled]="!form.valid" type="submit" class="btn" value="{{ boton }}" id="btn-verde" />
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-xs-12 col-md-6">
    <h4>Listado Suplidores</h4>
    <div class="card cardListados ">
      <app-tablas
        *ngIf="listaSuplidores && info"
        [info]="info"
        [botones]="botones"
        (DevolverInfo)="editarItem($event)"
        (DELETE)="abrirModal($event)"
        [data]="listaSuplidores"
        [focusRow]="false"
      ></app-tablas>
    </div>
  </div>
</div>
