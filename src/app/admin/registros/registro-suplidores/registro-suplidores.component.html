<div class="row" style="height: calc(100% - 60px)">
  <div class="col-5">
    <h4 class="negrita">{{ titulo }}</h4>
    <div class="contenedorRegistro">
      <div class="card card-padding sombra">
        <form [formGroup]="form" (ngSubmit)="submit(form)">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label class="control-label">Nombre: <span style="color: red">*</span></label>
                <input
                  type="text"
                  formControlName="nombre"
                  (keyup)="capitalice('nombre', $event.target.value)"
                  placeholder="Introduzca nombre"
                  class="form-control"
                  id="campoNombre"
                  autocomplete="off"
                  autofocus
                />
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['nombre'].valid && (form.controls['nombre'].dirty || form.controls['nombre'].touched)"
                >
                  Este Campo es obligatorio
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="from-group mb-2">
                <label class="control-label">Telefono: <span style="color: red">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  [textMask]="{ mask: phoneMask }"
                  formControlName="telefono"
                  placeholder="(___) ___-____"
                  autocomplete="off"
                />
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="validarRayaAbajo('telefono') && form.controls['telefono'].dirty">
                  Telefono incompleto
                </div>
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['telefono'].valid && (form.controls['telefono'].dirty || form.controls['telefono'].touched)"
                >
                  Introduzca el numero de telefono
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div>
                <label class="mr-2">
                  <input
                    type="radio"
                    value="1"
                    class="mr-1"
                    name="identificacion"
                    id="identificacion-cedula"
                    (click)="changeIdent(true)"
                  />Cedula</label
                >
                <label>
                  <input type="radio" value="1" name="identificacion" id="identificacion-rnc" class="mr-1" (click)="changeIdent(false)" />Rnc
                  <span style="color: red">*</span>
                </label>
              </div>

              <div *ngIf="documento_identidad" class="from-group">
                <div class="input-group">
                  <input
                    type="text"
                    [textMask]="{ mask: cedulaMask }"
                    (keyup)="validarRayaAbajo()"
                    class="form-control"
                    formControlName="cedula"
                    placeholder="___-_______-_"
                    autocomplete="off"
                  />

                  <div
                    (click)="setDocumentoPrincipal('cedula')"
                    class="input-group-append"
                    mdbTooltip="{{ doc_principal === 'cedula' ? 'Principal' : 'Seleccionar como principal' }}"
                    placement="right"
                  >
                    <span class="input-group-text"
                      ><i class="{{ doc_principal === 'cedula' ? 'far fa-star text-warning' : 'far fa-square' }}"></i
                    ></span>
                    <!-- <i class="far fa-square"></i> -->
                  </div>
                </div>
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="validarRayaAbajo('cedula') && form.controls['cedula'].dirty">
                  Cedula incompleta
                </div>
              </div>

              <div *ngIf="!documento_identidad" class="from-group">
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    [textMask]="{ mask: rncMask }"
                    formControlName="rnc"
                    placeholder="___-_____-_"
                    autocomplete="off"
                  />
                  <!-- <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['rnc'].valid && (form.controls['rnc'].dirty || form.controls['rnc'].touched)">
                    Este Campo es obligatorio
                  </div> -->

                  <div
                    (click)="setDocumentoPrincipal('rnc')"
                    class="input-group-append"
                    mdbTooltip="{{ doc_principal === 'rnc' ? 'Principal' : 'Seleccionar como principal' }}"
                    placement="right"
                  >
                    <span class="input-group-text"><i class="{{ doc_principal === 'rnc' ? 'far fa-star text-warning' : 'far fa-square' }}"></i></span>
                  </div>
                </div>
                <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="validarRayaAbajo('rnc') && form.controls['rnc'].dirty">
                  rnc incompleto
                </div>
              </div>
            </div>

            <div class="col-md-12">
              <div class="form-group">
                <label class="control-label">Email:</label>
                <input type="text" formControlName="email" placeholder="Introduzca email" class="form-control" autocomplete="off" />

                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['email'].valid && (form.controls['email'].dirty || form.controls['email'].touched)"
                >
                  Introduzca un email valido
                </div>
              </div>
            </div>

            <div class="col-md-12">
              <div class="form-group">
                <label class="control-label">Direccion:</label>
                <textarea
                  formControlName="direccion"
                  (keyup)="capitalice('direccion', $event.target.value)"
                  placeholder="Ingrese la direccion"
                  cols="100"
                  rows="2"
                  class="form-control"
                ></textarea>
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['direccion'].valid && (form.controls['direccion'].dirty || form.controls['direccion'].touched)"
                >
                  Introduzca una direccion valida
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="from-group">
              <!-- <a class="btn mr-2" id="btn-gris" (click)="atras()">Atras</a> -->
              <a class="btn mr-2" id="btn-blanco" (click)="borrar()">Borrar</a>
              <input [disabled]="abilitarSend()" type="submit" class="btn" value="{{ boton }}" id="btn-verde" />
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-7">
    <h4>Listado Suplidores</h4>
    <div #cardTabla id="cardTabla" class="card cardListados">
      <app-tablas
        *ngIf="listaSuplidores && info"
        [padre]="cardTabla" [info]="info"
        [botones]="botones"
        (DevolverInfo)="editarItem($event)"
        (DELETE)="abrirModal($event)"
        [quitarAScorll]="-20"
        [data]="listaSuplidores"
        (paginateChange)="getSuplidores($event)"
        [focusRow]="false"
      ></app-tablas>
    </div>
  </div>
</div>
