<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <h4 class="negrita mb-0">Divisas</h4>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" *ngIf="isCreando || divisaSelected" class="form {{ isCreando || divisaSelected ? 'showForm' : 'hideForm' }} ">
          <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
            <h4 class="mb-0">Formulario</h4>
          </div>

          <div class="card cardFormClass">
            <form [formGroup]="form">
              <div class="row">
                <div class="col-12 p-0">
                  <div class="form-group switchDiv d-flex align-items-center">
                    <input formControlName="is_principal" class="apple-switch" type="checkbox" />
                    <span class="ml-2 mb-0">Es divisa principal</span>
                    <span id="msgContainer"></span>
                  </div>
                </div>
                <div class="col-5 p-0">
                  <img-viewer-edit [src_img]="divisaSelected?.img_divisa || null" (getPhotoData)="getPhotoData($event)" [id]="'img'"></img-viewer-edit>
                </div>
                <div class="col-7">
                  <div class="row">
                    <div class="col-12 p-0">
                      <div class="form-group" [appMsgError]="'simbolo'" [form]="form">
                        <label class="control-label">Simbolo: <span style="color: red">*</span></label>
                        <input type="text" formControlName="simbolo" id="campoSimbolo" class="form-control" autocomplete="off" />
                        <span id="msgContainer"></span>
                      </div>
                    </div>

                    <div class="col-12 p-0">
                      <div class="form-group" [appMsgError]="'nombre'" [form]="form">
                        <label class="control-label">Nombre: <span style="color: red">*</span></label>
                        <input type="text" formControlName="nombre" [appCapitalice]="'formGroup'" id="campoNombre" class="form-control" autocomplete="off" />
                        <span id="msgContainer"></span>
                      </div>
                    </div>

                    <div *ngIf="botonLabel == 'Guardar'" class="col-12 p-0">
                      <div class="form-group" [appMsgError]="'current_tasa'" [form]="form">
                        <label class="control-label">Tasa actual: <span style="color: red">*</span></label>
                        <input type="text" formControlName="current_tasa" [appCapitalice]="'formGroup'" id="campoNombre" class="form-control" autocomplete="off" />
                        <span id="msgContainer"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </form>
            <div class="col-12 form-group p-0" style="display: flex; justify-content: space-between">
              <div>
                <a *ngIf="checkIfSomethingIsDiferrent()" class="btn mr-2" id="btn-blanco" (click)="borrar()">Borrar</a>

                <input type="button" [disabled]="formIsInvalid()" style="max-width: 6rem" (click)="requests()" class="btn ml-2" value="{{ botonLabel }}" id="btn-verde" />
              </div>
              <div>
                <input class="btn ml-2" value="Cerrar" id="btn-blanco" (click)="borrar(); isCreando = false" style="max-width: 6rem" />
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <div class="list {{ isCreando || divisaSelected ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 class="mb-0">Listado de divisas</h4>
          <button *ngxPermissionsOnly="permissions.user.create" [disabled]="divisaSelected || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
        </div>
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="listaDivisas" [seleccionado]="divisaSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
