<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <h4 class="negrita mb-0">Registro de clientes</h4>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" *ngIf="isCreando || clienteSelected" class="form {{ isCreando || clienteSelected ? 'showForm' : 'hideForm' }} ">
          <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
            <h4 class="mb-0">Formulario</h4>
          </div>

          <div class="card cardFormClass">
            <form [formGroup]="form">
              <div class="row">
                <div class="col-6 p-0">
                  <app-upload-img (getPhotoData)="getPhotoData($event)" [id]="'img'"></app-upload-img>
                </div>
                <div class="col-6 p-0">
                  <div class="row">
                    <div class="pr-0 col-12">
                      <div>
                        <label class="mr-2"> <input type="radio" value="1" class="mr-1" name="identificacion" id="identificacion-cedula" (click)="changeIdent(true)" />Cedula</label>
                        <label>
                          <input type="radio" value="1" name="identificacion" id="identificacion-rnc" class="mr-1" (click)="changeIdent(false)" />Rnc
                          <span style="color: red">*</span>
                        </label>
                      </div>

                      <div *ngIf="doc_is_cedula" class="form-group" [appMsgError]="'cedula'" [form]="form">
                        <div class="input-group d-flex" style="flex-wrap: nowrap">
                          <p-inputMask
                            (keydown.enter)="saltar('campoNombre')"
                            (keyup)="checkDocumento('cedula', $event)"
                            mask="999-9999999-9"
                            tabindex="-1"
                            styleClass="form-control with-right-btn"
                            inputId="cedula"
                            placeholder="___-_______-_"
                            formControlName="cedula"
                          ></p-inputMask>

                          <div (click)="setDocumentoPrincipal('cedula')" class="input-group-append" pTooltip="{{ doc_principal === 'cedula' ? 'Principal' : 'Seleccionar como principal' }}" tooltipPosition="right">
                            <span class="input-group-text"><i class="{{ doc_principal === 'cedula' ? 'far fa-star text-warning' : 'far fa-square' }}"></i></span>
                          </div>
                        </div>
                        <span id="msgContainer_cedula"></span>
                      </div>

                      <div *ngIf="!doc_is_cedula" class="form-group" [appMsgError]="'rnc'" [form]="form">
                        <div class="input-group d-flex" style="flex-wrap: nowrap">
                          <p-inputMask
                            (keydown.enter)="saltar('campoNombre')"
                            (keyup)="checkDocumento('rnc', $event)"
                            mask="999-99999-9"
                            tabindex="-1"
                            styleClass="form-control with-right-btn"
                            inputId="rnc"
                            placeholder="___-_____-_"
                            formControlName="rnc"
                          ></p-inputMask>

                          <div (click)="setDocumentoPrincipal('rnc')" class="input-group-append" pTooltip="{{ doc_principal === 'rnc' ? 'Principal' : 'Seleccionar como principal' }}" tooltipPosition="right">
                            <span class="input-group-text"><i class="{{ doc_principal === 'rnc' ? 'far fa-star text-warning' : 'far fa-square' }}"></i></span>
                          </div>
                        </div>
                        <span id="msgContainer_rnc"></span>
                      </div>
                    </div>
                    <div class="pr-0 col-12">
                      <div class="form-group" [appMsgError]="'nombre'" [form]="form">
                        <label class="control-label">Nombre: <span style="color: red">*</span></label>
                        <input
                          id="campoNombre"
                          (keyup)="capitalice('nombre', $event.target.value)"
                          (keydown.enter)="saltar('campoApellido')"
                          type="text"
                          formControlName="nombre"
                          placeholder="Introduzca nombre"
                          class="form-control"
                          autocomplete="off"
                          autofocus
                        />
                        <span id="msgContainer_nombre"></span>
                      </div>
                    </div>
                    <div class="pr-0 col-12 mb-3">
                      <div class="form-group" [appMsgError]="'apellido'" [form]="form">
                        <label class="control-label">Apellido: <span style="color: red">*</span></label>
                        <input
                          id="campoApellido"
                          (keyup)="capitalice('apellido', $event.target.value)"
                          (keydown.enter)="saltar('campoTelefono')"
                          type="text"
                          formControlName="apellido"
                          placeholder="Introduzca apellido"
                          class="form-control"
                          autocomplete="off"
                        />
                        <span id="msgContainer_apellido"></span>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-6 p-0 pr-2 mt-4">
                  <div class="form-group" [appMsgError]="'telefono'" [form]="form">
                    <label class="control-label">Telefono: <span style="color: red">*</span></label>

                    <p-inputMask (keydown.enter)="saltar('campoSexo')" mask="(999) 999-9999" tabindex="-1" styleClass="form-control" inputId="campoTelefono" placeholder="(___) ___-____" formControlName="telefono"></p-inputMask>

                    <span id="msgContainer_telefono"></span>
                  </div>
                </div>

                <div class="col-6 p-0 pl-2 mt-4">
                  <div class="form-group" [appMsgError]="'sexo'" [form]="form">
                    <label class="control-label">Sexo: <span style="color: red">*</span></label>
                    <select id="campoSexo" formControlName="sexo" class="form-control" (keydown.enter)="saltar('campoDias')">
                      <option value="{{ null }}" disabled>Sexo</option>
                      <option value="M">Masculino</option>
                      <option value="F">Femenino</option>
                    </select>
                    <span id="msgContainer_sexo"></span>
                  </div>
                </div>
                <div class="col-6 p-0 pr-2">
                  <div class="form-group" [appMsgError]="'limite_credito'" [form]="form">
                    <label class="control-label">Dias credito: <span style="color: red">*</span></label>
                    <select id="campoDias" formControlName="limite_credito" class="form-control" (keydown.enter)="saltar('maximo_credito')">
                      <option value="{{ null }}" disabled>Seleccione</option>
                      <option value="15">15 dias</option>
                      <option value="30">30 dias</option>
                    </select>
                    <span id="msgContainer_limite_credito"></span>
                  </div>
                </div>

                <div class="col-6 p-0 pl-2">
                  <div class="form-group" [appMsgError]="'maximo_credito'" [form]="form">
                    <label class="control-label">Limite de credito: <span style="color: red">*</span></label>

                    <input type="text" class="form-control" (blur)="revisarPrecio('maximo_credito')" formControlName="maximo_credito" id="maximo_credito" (keydown.enter)="saltar('campoVendedor')" placeholder="cantidad maxima" autocomplete="off" />
                    <span id="msgContainer_maximo_credito"> </span>
                  </div>
                </div>

                <div class="col-6 p-0 pr-2">
                  <div class="form-group" [appMsgError]="'vendedor_id'" [form]="form">
                    <label class="control-label">Vendedor: <span style="color: red">*</span></label>
                    <select id="campoVendedor" formControlName="vendedor_id" class="form-control" (keydown.enter)="saltar('campoDir')">
                      <option value="{{ null }}" disabled>Seleccione</option>
                      <option *ngFor="let item of vendedores" value="{{ item.id }}">{{ item.nombreCompleto }}</option>
                    </select>
                    <span id="msgContainer_vendedor_id"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="'direccion'" [form]="form">
                    <label class="control-label">Direccion <span style="color: red">*</span></label>
                    <textarea id="campoDir" (keyup)="capitalice('direccion', $event.target.value)" formControlName="direccion" class="form-control" cols="30" rows="3"></textarea>
                    <span id="msgContainer_direccion"></span>
                  </div>
                </div>

                <div class="col-12 form-group p-0" style="display: flex; justify-content: space-between">
                  <div>
                    <a class="btn mr-2" id="btn-blanco" (click)="borrar()">Borrar</a>

                    <input type="button" [disabled]="formIsInvalid()" style="max-width: 6rem" (click)="submit()" class="btn ml-2" value="{{ boton }}" id="btn-verde" />
                  </div>
                  <div>
                    <input class="btn ml-2" value="Cerrar" id="btn-blanco" (click)="borrar(); isCreando = false" style="max-width: 6rem" />
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </ng-container>

      <div class="list {{ isCreando || clienteSelected ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 class="mb-0">Listado clientes</h4>
          <button *ngxPermissionsOnly="permissions.cliente.create" [disabled]="clienteSelected || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
        </div>
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="listaClientes" [seleccionado]="clienteSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
