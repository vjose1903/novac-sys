<form [formGroup]="form">
  <div class="form-group mb-3" [appMsgError]="'target_fondo'" [form]="form">
    <label class="control-label">Fondo objetivo (monto que debe haber en caja): <span style="color: red">*</span></label>
    <input
      class="form-control text-end"
      type="text"
      formControlName="target_fondo"
      appNumeroFormato
      [decimals]="2"
      placeholder="0.00"
      autocomplete="off"
      (appNumeroFormatoBlur)="form.get('target_fondo')?.setValue($event, { emitEvent: false })" />
  </div>

  <div class="form-group d-flex align-items-center">
    <label class="control-label mb-0 me-3">Auto aplicar diferencia al fondo:</label>
    <input class="apple-switch" type="checkbox" formControlName="auto_apply_difference" />
  </div>
</form>
