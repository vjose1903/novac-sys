<div #cardTabla id="cardTabla" class="cardPrincipal sinPadding tamano" style="height: calc(100% - 9vh)">
  <div class="bordes info justify-content-between">
    <div class="text-center">
      <span style="font-size: 1.2rem"> Cantidad de productos en inventario </span>
      <h4 class="negrita" *ngIf="listaArticulos">{{ cant_inventario }}</h4>
    </div>
  </div>

  <div class="p-2 mt-2" style="height: inherit">
    <div>
      <select class="form-control filtroArticulos" [(ngModel)]="filtro" (change)="filtrarArticulos()">
        <option value="0" disabled>Filtro por tipo de articulos</option>
        <option value="todos">Todos</option>
        <option *ngFor="let tipo of tipo_articulos" value="{{ tipo.id }}">{{ tipo.descripcion }}</option>
      </select>

      <i class="fas fa-print btn-circle-icon" (click)="makeReporte()" style="transform: translate(33rem, -0.4rem)" mdbTooltip="Reporte de inventario" placement="right"></i>
    </div>
    <div style="height: 100%">
      <app-tablas
        *ngIf="listaArticulos"
        [padre]="cardTabla"
        [info]="info"
        [data]="listaArticulos"
        [focusRow]="false"
        [search]="true"
        [quitarAScorll]="40"
        [paginate]="true"
        [botones]="botones"
        (DevolverInfo)="movimientoInventario($event)"
        (paginateChange)="getArticulos($event)"
      ></app-tablas>
    </div>
  </div>
</div>
