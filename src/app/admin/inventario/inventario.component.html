<div class="mainInventario">
  <div class="colTitulo">
    <h4 class="negrita mb-1">Inventario</h4>
    <h4 class="mb-2">
      Cantidad de productos en inventario: <strong>{{ cant_inventario }}</strong>
    </h4>
  </div>

  <div class="cuerpo p-0">
    <div #cardTabla id="cardTabla" class="cardListados inventario">
      <dinamic-table [cardTabla]="cardTabla" [(data)]="listaArticulos" [(TablasComponent)]="tablaComponent" [config]="table_roles_config" (table_events)="handle_table_events($event)"></dinamic-table>

      <div class="divFiltro">
        <select class="form-control filtroArticulos" [(ngModel)]="filtro" (change)="filtrarArticulos()">
          <option value="0" disabled>Filtro por tipo de articulos</option>
          <option value="todos">Todos</option>
          @for (tipo of tipo_articulos; track tipo.id) {
            <option value="{{ tipo.codigo }}">{{ tipo.descripcion }}</option>
          }
        </select>

        <div class="me-3" style="margin-top: 0.2rem">
          <div class="d-flex align-items-center justify-content-center gap-2">
            <btn-icon-circular id="btnNota" icon="fas fa-print" size="size-lg" tooltip="Reporte de inventario" tooltipPosition="right" (clickFunction)="makeReporte()"> </btn-icon-circular>
          </div>
        </div>

        <!-- <div class="mr-3" style="margin-top: 0.2rem">
          <btn-icon-circular id="btnReportInventario" icon="fas fa-print" size="size-lg" tooltip="Reporte de inventario" tooltipPosition="left" (clickFunction)="makeReporte()"> </btn-icon-circular>
        </div> -->
      </div>
    </div>
  </div>
</div>
