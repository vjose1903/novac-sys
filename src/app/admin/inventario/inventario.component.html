<div class="mainInventario">
  <div class="colTitulo">
    <h4 class="negrita mb-1">Inventario</h4>
    <h4 class="mb-2">
      Cantidad de productos en inventario: <strong>{{ cant_inventario }}</strong>
    </h4>
  </div>

  <div class="cuerpo p-0">
    <div #cardTabla id="cardTabla" class="card cardListados">
      <dinamic-table [cardTabla]="cardTabla" [(data)]="listaArticulos" [(TablasComponent)]="tablaComponent" [config]="table_roles_config" (table_events)="handle_table_events($event)"></dinamic-table>

      <div class="divFiltro">
        <select class="form-control filtroArticulos" [(ngModel)]="filtro" (change)="filtrarArticulos()">
          <option value="0" disabled>Filtro por tipo de articulos</option>
          <option value="todos">Todos</option>
          <option *ngFor="let tipo of tipo_articulos" value="{{ tipo.codigo }}">{{ tipo.descripcion }}</option>
        </select>

        <i class="fas fa-print btn-circle-icon ml-3 btnReporte" (click)="makeReporte()" style="z-index: 999999" pTooltip="Reporte de inventario" tooltipPosition="right"></i>
      </div>
    </div>
  </div>
</div>
