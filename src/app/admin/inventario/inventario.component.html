<div class="mainInventario">
  <div class="colTitulo">
    <div class="screen-title-block">
      <span class="screen-module-kicker">Inventario</span>
      <h3 class="negrita mb-0">Inventario</h3>
    </div>

    <div class="inventory-total-card">
      <span class="inventory-total-icon">
        <i class="fa-solid fa-boxes-stacked"></i>
      </span>
      <span class="inventory-total-copy">
        <span class="inventory-total-label">Productos en inventario</span>
        <strong>{{ cantidadInventarioFormateada() }}</strong>
      </span>
    </div>
  </div>

  <div class="cuerpo p-0">
    <div #cardTabla id="cardTabla" class="card cardListados inventory-table-card">
      <dinamic-table [cardTabla]="cardTabla" [(data)]="listaArticulos" [(TablasComponent)]="tablaComponent" [config]="table_roles_config" (table_events)="handle_table_events($event)"></dinamic-table>

      <div class="divFiltro">
        <p-select
          inputId="filtroArticulos"
          styleClass="form-control filtroArticulos field-sm"
          [(ngModel)]="filtro"
          [options]="tipoArticuloFiltroOptions()"
          optionLabel="descripcion"
          optionValue="codigo"
          placeholder="Filtro por tipo de articulos"
          appendTo="body"
          (onChange)="filtrarArticulos()"></p-select>

        <btn-icon-circular id="btnNota" icon="fas fa-print" size="size-lg" tooltip="Reporte de inventario" tooltipPosition="left" (clickFunction)="makeReporte()"> </btn-icon-circular>

        <!-- <i class=" btn-circle-icon size-lg  btnReporte" (click)="makeReporte()" style="z-index: 999999" pTooltip="" tooltipPosition="right"></i> -->
      </div>
    </div>
  </div>
</div>
