<div class="options_container">
  <div class="options_filter">
    <div class="row">
      <div class="col-12">
        <label class="control-label mb-0">Filtro: </label>
      </div>
      <div class="col-3 mr-0">
        <div class="form-group">
          <select id="filterKeyI" [(ngModel)]="filter_key" class="form-control inputE" (change)="selectFiltro()">
            <option [value]="null" selected disabled>Escoger tipo</option>
            @for (tipo of tipos_filtro; track $index) {
              <option [value]="tipo.key">{{ tipo.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="col-4">
        <!-- ================ CLIENTE  ================ -->
        @if (filter_key == filter_options.cliente) {
          <p-dropdown
            #dropdownCliente
            inputId="valorI"
            [(ngModel)]="clienteSelected"
            [options]="listaClientes"
            [virtualScrollItemSize]="34"
            styleClass="custom inputE"
            [editable]="true"
            (onChange)="getClientes($event)"
            optionLabel="nombre_completo"
            (onFocus)="dropdownCliente.show(); dropdownCliente.focus()"
            emptyMessage="Escriba el nombre del cliente"
            [showClear]="true"
            (onClear)="clearClienteFilter(); dropdownCliente.show(); dropdownCliente.focus()"
          >
            <ng-template let-cliente pTemplate="item">
              <div class="cliente-item">
                <span class="d-block" style="font-size: 1rem"> <strong>Nombre: </strong> {{ cliente.nombre_completo }} </span>
                <span class="d-block" style="font-size: 0.8rem; color: #787878"> <strong>documento de identidad</strong> {{ cliente.documento_identidad }} </span>
              </div>
            </ng-template>
          </p-dropdown>
        }

        <!-- ================ NUMERO DOCUMENTO  ================ -->
        @if (filter_key == filter_options.numero_documento) {
          <p-inputMask
            inputId="valorI"
            [(ngModel)]="filter_value"
            styleClass="form-control inputE UPPERCASE"
            (keydown.enter)="desenfocarValor()"
            (onBlur)="checkNumeroPreFactura()"
            mask="99999999"
            tabindex="-1"
            placeholder="________"
            (onFocus)="htmlServ.selectValue($event)"
            [autoClear]="false"
          ></p-inputMask>
        }
      </div>
    </div>
  </div>
  
  <div class="options_table">
    <div #cardTablaDcumentos id="cardTablaDcumentos" class="divContainerTabla">
      <div class="innerTablas">
        @if (documentos.length) {
          <dinamic-table [cardTabla]="cardTablaDcumentos" [(data)]="documentos" [(TablasComponent)]="tablaComponent" [config]="table_notas_config" (table_events)="handle_table_events($event)"></dinamic-table>
        }
      </div>
    </div>
  </div>
</div>
