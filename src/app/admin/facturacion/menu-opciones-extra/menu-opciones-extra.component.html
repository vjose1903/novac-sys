<div class="options_container">
  <div class="options_filter">
    <div class="row">
      <div class="col-12">
        <label class="control-label mb-0">Filtro: </label>
      </div>
      <div class="col-3 me-0">
        <div class="form-group">
          <p-select inputId="filterKeyI" [(ngModel)]="filter_key" styleClass="form-control inputE" [options]="tipos_filtro" optionLabel="label" optionValue="key" placeholder="Escoger tipo" size="small" appendTo="body" (onChange)="selectFiltro()"></p-select>
        </div>
      </div>

      <div class="col-4">
        <!-- ================ CLIENTE  ================ -->

        @if (filter_key == filter_options.cliente) {
          <p-select appendTo="body"
            #dropdownCliente
            inputId="valorI"
            [(ngModel)]="clienteSelected"
            [options]="listaClientes"
            [virtualScrollItemSize]="34"
            styleClass="custom inputE"
            [editable]="true"
            (onShow)="dropdownClienteAction('show')"
            (onHide)="dropdownClienteAction('hide')"
            (onChange)="getClientes($event)"
            optionLabel="nombre_completo"
            (onFocus)="dropdownCliente.show(); dropdownCliente.focus()"
            emptyMessage="Escriba el nombre del cliente"
            [showClear]="false"
            (onClear)="clearClienteFilter(); dropdownCliente.show(); dropdownCliente.focus()">
            <ng-template let-cliente pTemplate="item">
              <div class="cliente-item">
                <span class="d-block" style="font-size: 1rem"> <strong>Nombre: </strong> {{ cliente.nombre_completo }} </span>
                <span class="d-block no-wrap" style="font-size: 0.8rem; color: #00000054"> <strong>documento de identidad</strong> {{ cliente.documento_identidad }} </span>
              </div>
            </ng-template>
          </p-select>
          <!-- <input id="valorI" class="form-control inputE" [(ngModel)]="filter_value" (keydown.enter)="desenfocarValor()" (blur)="buscarDocumentos()" type="text" (focus)="htmlServ.selectValue($event)" placeholder="Nombre cliente" autocomplete="off" /> -->
        }

        <!-- ================ NUMERO DOCUMENTO  ================ -->
        @if (filter_key == filter_options.numero_documento) {
          <p-inputMask
            inputId="valorI"
            [(ngModel)]="filter_value"
            styleClass="form-control inputE UPPERCASE"
            (onInput)="checkNumeroPreFactura($event)"
            mask="99999999"
            tabindex="-1"
            placeholder="________"
            (onFocus)="htmlServ.selectValue($event)"
            [autoClear]="false"></p-inputMask>
        }
      </div>
      <div class="col-1">
        @if (filter_key != filter_options.todos) {
          <btn-icon-circular [id]="'clearCotizacionFilter'" icon="fa-solid fa-delete-left" size="size-md" tooltip="Limpiar Filtros" icon_size="0.92rem" tooltipPosition="right" (clickFunction)="clearFilters()"> </btn-icon-circular>
        }
      </div>
    </div>
  </div>
  <div class="options_table">
    <div #cardTablaDocumentos id="cardTablaDocumentos" class="divContainerTabla">
      <div class="innerTablas">
        @if (documentos().length) {
          <dinamic-table [cardTabla]="cardTablaDocumentos" [data]="documentos()" (dataChange)="documentos.set($event)" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
        }
      </div>
    </div>
  </div>
</div>
