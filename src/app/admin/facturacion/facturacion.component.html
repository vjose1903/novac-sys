<div class="row" style="height: calc(100% - 80px)">
  <div class="col-xs-12 col-md-12">
    <h1>Facturación</h1>
    <div class="card cardPrincipal sinPadding">
      <div class="cabezaFactura">
        <div class="row">
          <div class="col-xs-12 col-md-2">
            <h5><strong>Tipo:</strong></h5>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios1" value="option1" checked />
              <label class="form-check-label" for="exampleRadios1">Consumidor final </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios2" value="option2" />
              <label class="form-check-label" for="exampleRadios2"> Valor fiscal </label>
            </div>
            <h5 class="mt-2"><strong>Condición :</strong></h5>
            <select class="form-control " name="condicionSelect">
              <option value="Credito">Credito</option>
              <option value="Contado">Contado</option>
            </select>
          </div>
          <!-- ======================================================================================================================================================================== -->
          <!-- ======================================================================================================================================================================== -->
          <div class="col-xs-12 col-md-6">
            <form [formGroup]="form">
              <h5><strong>Cliente:</strong></h5>
              <div class="row">
                <div class="col-xs-12 col-md-7">
                  <label class="control-label mr-2">Nombre:</label>
                  <input type="text" formControlName="nombre" placeholder="Introduzca nombre" class="form-control " autocomplete="off" />
                  <div
                    class="alerta text-danger ml-1"
                    style="font-size: 12px"
                    *ngIf="!form.controls['nombre'].valid && (form.controls['nombre'].dirty || form.controls['nombre'].touched)"
                  >
                    Este Campo es obligatorio
                  </div>
                </div>

                <div class="col-xs-12 col-md-5">
                  <div class="from-group">
                    <label class="control-label">Telefono:</label>
                    <input type="text" class="form-control" formControlName="telefono" placeholder="(___)___-____" autocomplete="off" id="inputTelefono" readonly="true" />
                    <div
                      class="alerta text-danger ml-1"
                      style="font-size: 12px"
                      *ngIf="!form.controls['telefono'].valid && (form.controls['telefono'].dirty || form.controls['telefono'].touched)"
                    >
                      Introduzca el numero de telefono
                    </div>
                  </div>
                </div>

                <div class="col-xs-12 col-md-12">
                  <div class="form-group">
                    <label class="control-label mr-2">Direccion:</label>
                    <input type="text" formControlName="direccion" placeholder="Introduzca direccion" class="form-control" autocomplete="off" />
                    <div
                      class="alerta text-danger ml-1"
                      style="font-size: 12px"
                      *ngIf="!form.controls['direccion'].valid && (form.controls['direccion'].dirty || form.controls['direccion'].touched)"
                    >
                      Este Campo es obligatorio
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <!-- ======================================================================================================================================================================== -->
          <!-- ======================================================================================================================================================================== -->
          <div class="col-xs-12 col-md-4">
            <div class="d-flex flex-column">
              <div class=" encabezadoRigth fecha">
                Fecha : <strong> {{ fecha }}</strong>
              </div>
              <div class=" encabezadoRigth numFac">
                Numero Fac. : <strong> 0000000{{ numFac }}</strong>
              </div>
            </div>
            <div class="cuadroTotal">RD$ {{ formatearNumero(TOTAL) }}</div>
          </div>
        </div>
      </div>
      <div class="cuerpoFactura">
        <app-cuerpo-factura (sendCalculos)="getCalculos($event)"></app-cuerpo-factura>
      </div>
    </div>
  </div>
</div>
