<h3>Facturación</h3>
<div class="card cardPrincipal sinPadding tamano">
  <div class="cabezaFactura ">
    <div class="row">
      <div class="col-xs-12 col-md-2">
        <ng-template #tipos_facturas><div class="w-75" [innerHtml]="TiposFacturas"></div></ng-template>
        <h5><strong>Tipo:</strong></h5>
        <input
          placement="right"
          [mdbPopover]="tipos_facturas"
          triggers="focus"
          type="text"
          (keydown.enter)="saltar('condicion', tipoFact.value)"
          class="form-control tipo"
          value="02"
          id="tipoFact"
          #tipoFact
        />

        <h5 class="mt-2"><strong>Condición :</strong></h5>
        <select id="condicion" (keydown.enter)="saltar('nom', $event.target.value)" class="form-control " name="condicionSelect">
          <option value="Contado">Contado</option>
          <option value="Credito">Credito</option>
        </select>
      </div>
      <!-- ======================================================================================================================================================================== -->
      <!-- ======================================================================================================================================================================== -->
      <div class="col-xs-12 col-md-6">
        <form [formGroup]="form">
          <div class="d-flex" style="height: 1.7rem;">
            <h5><strong>Cliente:</strong></h5>
            <i (click)="abrirModalFiltro()" mdbTooltip="Buscar cliente" placement="top" class="fas fa-search ml-3 botonBuscar"></i>
          </div>
          <div class="row">
            <div class="col-xs-12 col-md-7">
              <label class="control-label mr-2">Nombre:</label>
              <input
                id="nom"
                (keydown.enter)="saltar('dir', form.controls['nombre'].value)"
                type="text"
                formControlName="nombre"
                placeholder="Introduzca nombre"
                class="form-control "
                autocomplete="off"
              />
              <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['nombre'].valid && (form.controls['nombre'].dirty || form.controls['nombre'].touched)">
                Este Campo es obligatorio
              </div>
            </div>

            <div class="col-xs-12 col-md-5">
              <div class="from-group">
                <label class="control-label">Telefono:</label>
                <input type="text" class="form-control" formControlName="telefono" placeholder="(___)___-____" autocomplete="off" id="inputTelefono" readonly="true" />
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['telefono'].valid && (form.controls['telefono'].dirty || form.controls['telefono'].touched)"
                >
                  Introduzca el numero de telefono
                </div>
              </div>
            </div>

            <div class="col-xs-12 col-md-12">
              <div class="form-group">
                <label class="control-label mr-2">Direccion:</label>
                <input
                  id="dir"
                  (keydown.enter)="saltar('cod-0', form.controls['direccion'].value)"
                  type="text"
                  formControlName="direccion"
                  placeholder="Introduzca direccion"
                  class="form-control"
                  autocomplete="off"
                />
                <div
                  class="alerta text-danger ml-1"
                  style="font-size: 12px"
                  *ngIf="!form.controls['direccion'].valid && (form.controls['direccion'].dirty || form.controls['direccion'].touched)"
                >
                  Este Campo es obligatorio
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
      <!-- ======================================================================================================================================================================== -->
      <!-- ======================================================================================================================================================================== -->
      <div class="col-xs-12 col-md-4">
        <div class="d-flex flex-column">
          <div class=" encabezadoRigth fecha">
            Fecha : <strong> {{ fecha }}</strong>
          </div>
          <div class=" encabezadoRigth numFac">
            Numero Fac. : <strong> 0000000{{ numFac }}</strong>
          </div>
        </div>
        <div class="cuadroTotal">RD$ {{ formatearNumero(TOTAL) }}</div>
      </div>
    </div>
  </div>
  <div class="cuerpoFactura mb-4">
    <app-cuerpo-factura [propietario]="propietario_factura" (getCuerpoFactura)="getCuerpoFactura($event)" (sendDescuento)="getDescuento($event)" (sendCalculos)="getCalculos($event)"></app-cuerpo-factura>
  </div>
  <div class="pieFactura">
    <div class="row">
      <div class="col-2 ">
        <app-btncircular [alto]="'100px'" [accion]="'Imprimir Factura'" [nombreImg]="'printer'" (click)="imprimirFactura()"></app-btncircular>
      </div>
      <div class="col-2">
        <app-btncircular [alto]="'100px'" [accion]="'Cancelar Factura'" [nombreImg]="'cancelar'" (click)="cancelarFactura()"></app-btncircular>
      </div>
      <div class="col-8 d-flex justify-content-end">
        <div class="d-block mostrarNumeros">
          <div class="row">
            <div class="col-6">
              <div class="d-flex">
                <span>ITBIS:</span>
              </div>
              <div class="d-flex">
                <span>IMPORTE:</span>
              </div>
              <div class="d-flex">
                <!-- class="borderTOP" -->
                <span class="mt-2"> <strong>TOTAL:</strong> </span>
              </div>
            </div>
            <div class="col-6">
              <div class="d-flex">
                <span class="text-transparent">ITBIS:</span>
              </div>
              <div class="d-flex">
                <h5>{{ formatearNumero(TOTAL) }}</h5>
              </div>
              <div class="d-flex">
                <!--  -->
                <h5 class="borderTOP">{{ formatearNumero(TOTAL) }}</h5>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
