<h2><strong>Articulo: </strong> {{ inputs.nombre }}</h2>
<p>Seleccione la cantidad de articulos devueltos que desea retornar.</p>

<form [formGroup]="form">
  <div class="row">
    <div class="col-12 p-0">
      <hr class="rayaTop" />
    </div>
    <div class="col-6 rayaRight">
      <span class="w-100 badge text-shadow bg-secondary text-white" [ngClass]="{ disable: fun.isEmpty(inputs?.articulo_solo_devuelto?.cantidad) }">
        <span>Cant. Solo devuelto:</span> <span> {{ getCurrentDevuelto(inputs?.articulo_solo_devuelto?.cantidad) }}</span>
      </span>
    </div>
    <div class="col-6">
      <span class="w-100 badge bg-danger text-shadow text-white" [ngClass]="{ disable: fun.isEmpty(inputs?.articulo_defectuoso?.can) }">
        <span>Cant. Defectuoso:</span> <span> {{ getCurrentDevuelto(inputs?.articulo_defectuoso?.can) }}</span>
      </span>
    </div>
    <div class="col-12 p-0">
      <hr class="rayaBottom" />
    </div>
    <div class="col-12" style="height: 1rem"></div>

    <div class="col-6 rayaRight">
      <div class="form-group">
        <label class="control-label">Retornar devuelto: </label>
        <input
          id="solo_devuelto"
          min="1"
          [max]="inputs.articulo_solo_devuelto?.cantidad"
          (focus)="$event.target.select()"
          (blur)="checkCantidad('solo_devuelto')"
          type="number"
          class="form-control input_cantidad"
          formControlName="solo_devuelto"
          [placeholder]="fun.isEmpty(inputs?.articulo_solo_devuelto?.cantidad) ? 'No hay devueltos' : 'Introduzca la cantidad'"
          autocomplete="off"
        />
      </div>
    </div>
    <div class="col-6">
      <div class="form-group">
        <label class="control-label">Retornar defectuoso: </label>
        <input
          id="defectuoso"
          min="1"
          [max]="inputs.articulo_solo_devuelto?.cantidad"
          (focus)="$event.target.select()"
          (blur)="checkCantidad('defectuoso')"
          type="number"
          class="form-control input_cantidad"
          formControlName="defectuoso"
          [placeholder]="fun.isEmpty(inputs?.articulo_defectuoso?.can) ? 'No hay devueltos' : 'Introduzca la cantidad'"
          autocomplete="off"
        />
      </div>
    </div>
  </div>
</form>
