<table class="table m-auto">
  <thead>
    <tr class="text-center">
      <th class="tiCOD">Codigo</th>
      <th class="tiCAN">Cantidad</th>
      <th class="tiUNI"><span class="ml-3">Unidad</span></th>
      <th class="tiDES">Descripcion</th>
      <th pTooltip="Descuento en %" tooltipPosition="top" class="tiDESC">Descuento</th>
      <th class="tiPRE">{{ metodo === 'venta' ? 'Precio' : 'Costo' }}</th>
      <th class="tiTOT">Total</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="COD td0padding"></td>

      <td class="CAN td0padding"></td>

      <td class="UNI td0padding"></td>

      <td class="DES td0padding"></td>

      <td pTooltip="Descuento en %" tooltipPosition="top" class="DESC td0padding"></td>

      <td class="PRE td0padding"></td>

      <td class="TOT td0padding"></td>
    </tr>
  </tbody>
</table>

<div class="cuadro" #cuadro class="scrollContainer">
  <!-- <div class="cuadro" #cuadro [ngClass]="{ sinFlow: secuencia <= 12, conFlow: secuencia >= 13 }"> -->
  <form [formGroup]="form" action="">
    <div formArrayName="rowFactura" *ngFor="let item of ARRAY_ROWFACTURAS?.controls; let index_cuerpo = index">
      <div [formGroupName]="index_cuerpo">
        <p-overlayPanel #dropRowConfig styleClass="dropConfigs" appendTo="body">
          <ng-template pTemplate>
            <ul class="dropRowConfig" role="menu">
              <li role="menuitem" (click)="modalRemover(index_cuerpo, $event)" class="hoverlable">
                <a class="" id="dropdown-item">
                  <i class="far fa-trash-alt text-red btnBorrar"></i>
                  Quitar Producto
                </a>
              </li>
            </ul>
          </ng-template>
        </p-overlayPanel>

        <table class="table m-auto">
          <tbody>
            <tr>
              <!--  ::::::::::::  CONFIG  ::::::::::::  -->
              <td *ngIf="propietario" class="sombreado2" (mouseover)="selectedRow(index_cuerpo, true)" (mouseleave)="selectedRow(index_cuerpo, false)">
                <div class="btn-group">
                  <div *ngIf="checkIfRowContainArticulo(index_cuerpo)" style="padding: 3px" (click)="dropRowConfig.toggle($event)">
                    <i class="fas fa-ellipsis-v btnConfig"></i>
                  </div>

                  <div *ngIf="!checkIfRowContainArticulo(index_cuerpo)" style="padding: 3px">
                    <i class="fas fa-ellipsis-v btnConfigDis"></i>
                  </div>
                </div>
              </td>

              <!--  ::::::::::::  CODIGO  ::::::::::::  -->
              <td class="COD td0padding">
                <div class="form-group m-0">
                  <input
                    [ngClass]="{ disabled: !propietario }"
                    type="text"
                    class="form-control entrada"
                    id="cod-{{ index_cuerpo }}"
                    [maxlength]="minCodigo"
                    (focus)="verificarSecuencia(index_cuerpo); checkDisable('cod-', index_cuerpo, true)"
                    (keyup)="checkCodigo(index_cuerpo); checkDisable('cod-', index_cuerpo, true)"
                    (keyup.enter)="saltar('can-', index_cuerpo)"
                    formControlName="cod"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  CANTIDAD  ::::::::::::  -->
              <td class="CAN td0padding">
                <div class="form-group m-0">
                  <input
                    [ngClass]="{ disabled: !propietario }"
                    type="number"
                    min="1"
                    class="form-control entrada input_cantidad"
                    id="can-{{ index_cuerpo }}"
                    (keyup)="checkDisable('can-', index_cuerpo, true)"
                    (keyup.enter)="saltar('uni-', index_cuerpo)"
                    formControlName="can"
                    (focus)="verificarSecuencia(index_cuerpo); checkDisable('can-', index_cuerpo, true)"
                    (blur)="calcularTotalRow(index_cuerpo); saliDeCantidad(index_cuerpo)"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  UNIDAD  ::::::::::::  -->
              <td class="UNI td0padding">
                <div class="form-group m-0">
                  <input
                    [ngClass]="{ disabled: !propietario }"
                    *ngIf="inputDrop !== 'uni-' + index_cuerpo"
                    type="text"
                    class="form-control entrada"
                    id="uni-{{ index_cuerpo }}"
                    (mouseenter)="setInputDrop(index_cuerpo); llenarArrayUnidades(index_cuerpo); verificarSecuencia(index_cuerpo, false)"
                    (focus)="setInputDrop(index_cuerpo); llenarArrayUnidades(index_cuerpo); verificarSecuencia(index_cuerpo); checkDisable('uni-', index_cuerpo, true)"
                    (keyup.enter)="saltar(metodo === 'venta' ? 'cod-' : 'pre-', index_cuerpo)"
                    (keyup)="checkDisable('uni-', index_cuerpo, true)"
                    (blur)="calcularTotalRow(index_cuerpo)"
                    formControlName="uni"
                    tabindex="-1"
                  />

                  <div *ngIf="inputDrop === 'uni-' + index_cuerpo">
                    <select
                      value="Medida"
                      formControlName="uni"
                      (change)="selectMedidaChange($event.target.value, index_cuerpo)"
                      class="form-control entrada"
                      style="border-radius: 0"
                      id="uni-{{ index_cuerpo }}"
                      (keyup.enter)="saltar(metodo === 'venta' ? 'cod-' : 'pre-', index_cuerpo)"
                      (mouseleave)="setInputDrop(undefined); calcularTotalRow(index_cuerpo)"
                      (blur)="setInputDrop(undefined); calcularTotalRow(index_cuerpo)"
                      tabindex="-1"
                    >
                      <option *ngFor="let item of UnidadesArticulo" value="{{ item.value }}">{{ item.value }}</option>
                    </select>
                  </div>
                </div>
              </td>

              <!--  ::::::::::::  DESCRIPCION  ::::::::::::  -->
              <td class="DES td0padding">
                <div class="form-group m-0">
                  <input
                    type="text"
                    class="form-control entrada inDES disabled"
                    id="des-{{ index_cuerpo }}"
                    formControlName="des"
                    tabindex="-1"
                    (focus)="checkDisable('des-', index_cuerpo, false)"
                    (keyup)="checkDisable('des-', index_cuerpo, false)"
                  />
                </div>
              </td>

              <!--  ::::::::::::  DESCUENTO  ::::::::::::  -->

              <td class="DESC td0padding">
                <div class="form-group m-0">
                  <input
                    type="number"
                    class="form-control entrada campoNumeros input_cantidad"
                    id="desc-{{ index_cuerpo }}"
                    (focus)="verificarSecuencia(index_cuerpo); checkDisable('desc-', index_cuerpo, true)"
                    (keyup)="checkDisable('desc-', index_cuerpo, true)"
                    (keyup.enter)="enfocarInput('cod-' + (index_cuerpo + 1))"
                    formControlName="descuento_porciento"
                    (blur)="calcularDescuento(index_cuerpo)"
                    (emptied)="calcularDescuento(index_cuerpo)"
                    [ngClass]="{ disabled: readDescuento() }"
                    tabindex="-1"
                  />
                </div>
              </td>
              <!--  ::::::::::::  PRECIO  ::::::::::::  -->
              <td class="PRE td0padding">
                <div class="form-group m-0">
                  <input
                    type="text"
                    (blur)="calcularTotalRow(index_cuerpo); revisarPrecio(index_cuerpo)"
                    (focus)="$event.target.select(); checkDisable('pre-', index_cuerpo, true)"
                    class="form-control entrada campoNumeros {{ metodo === 'venta' ? 'inPRE' : '' }}"
                    (keyup)="checkDisable('pre-', index_cuerpo, true)"
                    (keyup.enter)="calcularTotalRow(index_cuerpo); enfocarInput('cod-' + (index_cuerpo + 1))"
                    id="pre-{{ index_cuerpo }}"
                    formControlName="pre"
                    [ngClass]="{ disabled: readPrecio() }"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  TOTAL  ::::::::::::  -->
              <td class="TOT td0padding">
                <div class="form-group m-0">
                  <input
                    type="text"
                    class="form-control entrada inTOT campoNumeros disabled"
                    id="tot-{{ index_cuerpo }}"
                    formControlName="tot"
                    tabindex="-1"
                    (focus)="checkDisable('tot-', index_cuerpo, false)"
                    (keyup)="checkDisable('tot-', index_cuerpo, false)"
                  />
                  <input type="hidden" [value]="index_cuerpo" formControlName="secuencia" tabindex="-1" />
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </form>
</div>
