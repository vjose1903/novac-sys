<app-modal
  [ModalShearch]="modalSearch"
  [seleccionModal]="seleccionModal"
  [listaArticulos]="listaArticulos"
  (reinicioVariablesModal)="reinicarVarModal()"
  [(showModal)]="showModal"
></app-modal>

<table #tituloFactTable="mdbTable" mdbTable class="table m-auto" small="true">
  <thead>
    <tr class="text-center">
      <th class="tiCOD">Codigo</th>
      <th class="tiCAN">Cantidad</th>
      <th class="tiUNI">Unidad</th>
      <th class="tiDES">Descripcion</th>
      <th class="tiPRE">Precio</th>
      <th class="tiTOT">Total</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="COD td0padding"></td>

      <td class="CAN td0padding"></td>

      <td class="UNI td0padding"></td>

      <td class="DES td0padding"></td>

      <td class="PRE td0padding"></td>

      <td class="TOT td0padding"></td>
    </tr>
  </tbody>
</table>

<div class="cuadro" #cuadro>
  <form [formGroup]="form" action="">
    <div formArrayName="rowFactura" *ngFor="let item of rowFactura.controls; let i = index">
      <div [formGroupName]="i">
        <table #cuerpoFactTable="mdbTable" mdbTable class="table m-auto" small="true">
          <tbody>
            <tr>
              <td class="COD td0padding">
                <div class="from-group">
                  <input type="text" class="form-control entrada " id="cod-{{ i }}" (keydown.enter)="saltar($event, 'can-', i , this)" formControlName="cod" />
                </div>
              </td>

              <td class="CAN td0padding">
                <div class="from-group">
                  <input type="text" class="form-control entrada " id="can-{{ i }}" (keydown.enter)="saltar($event, 'uni-', i , this)" formControlName="can" />
                </div>
              </td>

              <td class="UNI td0padding">
                <div class="from-group">
                  <input type="text" class="form-control entrada " id="uni-{{ i }}" (keydown.enter)="saltar($event, 'cod-', i + 1 , this)" formControlName="uni" />
                </div>
              </td>

              <td class="DES td0padding">
                <div class="from-group">
                  <input type="text" class="form-control entrada inDES " id="des-{{ i }}" formControlName="des" readonly="true" />
                </div>
              </td>

              <td class="PRE td0padding">
                <div class="from-group">
                  <input type="text" class="form-control entrada inPRE " id="pre-{{ i }}" formControlName="pre" readonly="true" />
                </div>
              </td>

              <td class="TOT td0padding">
                <div class="from-group">
                  <input type="text" class="form-control entrada inTOT " id="tot-{{ i }}" formControlName="tot" readonly="true" />
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </form>
</div>
<p>{{ rowFactura.value | json }}</p>
