<table #tituloFactTable="mdbTable" mdbTable class="table m-auto" [small]="true">
  <thead>
    <tr class="text-center">
      <th class="tiCOD">Codigo</th>
      <th class="tiCAN">Cantidad</th>
      <th class="tiUNI"><span class="ml-3">Unidad</span></th>
      <th class="tiDES">Descripcion</th>
      <th mdbTooltip="Descuento en %" placement="top" class="tiDESC">Descuento</th>
      <th class="tiPRE">{{ metodo === 'venta' ? 'Precio' : 'Costo' }}</th>
      <th class="tiTOT">Total</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="COD td0padding"></td>

      <td class="CAN td0padding"></td>

      <td class="UNI td0padding"></td>

      <td class="DES td0padding"></td>

      <td mdbTooltip="Descuento en %" placement="top" class="DESC td0padding"></td>

      <td class="PRE td0padding"></td>

      <td class="TOT td0padding"></td>
    </tr>
  </tbody>
</table>

<div class="cuadro" #cuadro class="scrollContainer">
  <!-- <div class="cuadro" #cuadro [ngClass]="{ sinFlow: secuencia <= 12, conFlow: secuencia >= 13 }"> -->
  <form [formGroup]="form" action="">
    <div formArrayName="rowFactura" *ngFor="let item of ARRAY_ROWFACTURAS?.controls; let i = index">
      <div [formGroupName]="i">
        <p-overlayPanel #dropRowConfig styleClass="dropConfigs" appendTo="body">
          <ng-template pTemplate>
            <ul class="dropRowConfig" role="menu">
              <li *ngIf="metodo === 'venta'" role="menuitem">
                <div class="form-group my-1 switchDiv">
                  <input formControlName="calcular_saco" class="apple-switch" type="checkbox" (change)="CalculoSacos(i, 'select', $event)" />
                  <span class="ml-2">Calcular saco</span>
                </div>
              </li>

              <li role="menuitem" (click)="modalRemover(i, $event)" class="hoverlable">
                <a class="" id="dropdown-item">
                  <i class="far fa-trash-alt text-red btnBorrar"></i>
                  Quitar Producto
                </a>
              </li>
            </ul>
          </ng-template>
        </p-overlayPanel>

        <table #cuerpoFactTable="mdbTable" mdbTable class="table m-auto" [small]="true">
          <tbody>
            <tr>
              <!--  ::::::::::::  CONFIG  ::::::::::::  -->
              <td *ngIf="propietario" class="sombreado2" (mouseover)="selectedRow(i, true)" (mouseleave)="selectedRow(i, false)">
                <div class="btn-group">
                  <div *ngIf="checkIfRowContainArticulo(i)" style="padding: 3px" (click)="dropRowConfig.toggle($event)">
                    <i class="fas fa-ellipsis-v btnConfig"></i>
                  </div>

                  <div *ngIf="!checkIfRowContainArticulo(i)" style="padding: 3px">
                    <i class="fas fa-ellipsis-v btnConfigDis"></i>
                  </div>
                </div>
              </td>

              <!--  ::::::::::::  CODIGO  ::::::::::::  -->
              <td class="COD td0padding">
                <div class="form-group m-0">
                  <input
                    [ngClass]="{ disabled: !propietario }"
                    type="text"
                    class="form-control entrada"
                    id="cod-{{ i }}"
                    [maxlength]="minCodigo"
                    (focus)="verificarSecuencia(i)"
                    (keyup)="checkCodigo(i)"
                    (keyup.enter)="saltar('can-', i)"
                    formControlName="cod"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  CANTIDAD  ::::::::::::  -->
              <td class="CAN td0padding">
                <div class="form-group m-0">
                  <input
                    [ngClass]="{ disabled: !propietario }"
                    type="number"
                    min="0"
                    class="form-control entrada input_cantidad"
                    id="can-{{ i }}"
                    (keyup.enter)="saltar('uni-', i)"
                    formControlName="can"
                    (focus)="verificarSecuencia(i)"
                    (blur)="calcularTotalRow(i); saliDeCantidad(i)"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  UNIDAD  ::::::::::::  -->
              <td class="UNI td0padding">
                <div class="form-group m-0">
                  <input
                    [ngClass]="{ disabled: !propietario }"
                    *ngIf="inputDrop !== 'uni-' + i"
                    type="text"
                    class="form-control entrada"
                    id="uni-{{ i }}"
                    (mouseenter)="verificarSecuencia(i, 'unidad', false)"
                    (focus)="verificarSecuencia(i, 'unidad')"
                    (keyup.enter)="saltar(metodo === 'venta' ? 'cod-' : 'pre-', i)"
                    formControlName="uni"
                    (blur)="calcularTotalRow(i)"
                    tabindex="-1"
                  />

                  <div *ngIf="inputDrop === 'uni-' + i">
                    <select
                      value="Medida"
                      formControlName="uni"
                      (change)="selectMedidaChange($event.target.value, i)"
                      class="form-control entrada"
                      style="border-radius: 0"
                      id="uni-{{ i }}"
                      (mouseleave)="setInputDrop(undefined)"
                      (keyup.enter)="saltar(metodo === 'venta' ? 'cod-' : 'pre-', i)"
                      (blur)="calcularTotalRow(i); setInputDrop(undefined)"
                      tabindex="-1"
                    >
                      <option *ngFor="let item of UnidadesArticulo" value="{{ item.value }}">{{ item.value }}</option>
                    </select>
                  </div>
                </div>
              </td>

              <!--  ::::::::::::  DESCRIPCION  ::::::::::::  -->
              <td class="DES td0padding">
                <div class="form-group m-0">
                  <input type="text" class="form-control entrada inDES disabled" id="des-{{ i }}" formControlName="des" tabindex="-1" />
                </div>
              </td>

              <!--  ::::::::::::  DESCUENTO  ::::::::::::  -->

              <td class="DESC td0padding">
                <div class="form-group m-0">
                  <input
                    type="number"
                    class="form-control entrada campoNumeros input_cantidad"
                    id="desc-{{ i }}"
                    (focus)="verificarSecuencia(i)"
                    (keyup.enter)="enfocarInput('cod-' + (i + 1))"
                    formControlName="descuento_porciento"
                    (blur)="calcularDescuento(i)"
                    (emptied)="calcularDescuento(i)"
                    [ngClass]="{ disabled: readDescuento() }"
                    tabindex="-1"
                  />
                </div>
              </td>
              <!--  ::::::::::::  PRECIO  ::::::::::::  -->
              <td class="PRE td0padding">
                <div class="form-group m-0">
                  <input
                    type="text"
                    (blur)="calcularTotalRow(i); revisarPrecio(i)"
                    (focus)="$event.target.select()"
                    class="form-control entrada campoNumeros {{ metodo === 'venta' ? 'inPRE' : '' }}"
                    (keyup.enter)="calcularTotalRow(i); enfocarInput('cod-' + (i + 1))"
                    id="pre-{{ i }}"
                    formControlName="pre"
                    [ngClass]="{ disabled: readPrecio() }"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  TOTAL  ::::::::::::  -->
              <td class="TOT td0padding">
                <div class="form-group m-0">
                  <input type="text" class="form-control entrada inTOT campoNumeros disabled" id="tot-{{ i }}" formControlName="tot" tabindex="-1" />
                  <input type="hidden" [value]="i" formControlName="secuencia" tabindex="-1" />
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </form>
</div>
