<table #tituloFactTable="mdbTable" mdbTable class="table m-auto" small="true">
  <thead>
    <tr class="text-center">
      <th class="tiCOD">Codigo</th>
      <th class="tiCAN">Cantidad</th>
      <th class="tiUNI"><span class="ml-3">Unidad</span></th>
      <th class="tiDES">Descripcion</th>
      <th mdbTooltip="Descuento en %" placement="top" class="tiDESC">Descuento</th>
      <th class="tiPRE">{{ metodo === 'venta' ? 'Precio' : 'Costo' }}</th>
      <th class="tiTOT">Total</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="COD td0padding"></td>

      <td class="CAN td0padding"></td>

      <td class="UNI td0padding"></td>

      <td class="DES td0padding"></td>

      <td mdbTooltip="Descuento en %" placement="top" class="DESC td0padding"></td>

      <td class="PRE td0padding"></td>

      <td class="TOT td0padding"></td>
    </tr>
  </tbody>
</table>

<div class="cuadro" #cuadro class="scrollContainer">
  <!-- <div class="cuadro" #cuadro [ngClass]="{ sinFlow: secuencia <= 12, conFlow: secuencia >= 13 }"> -->
  <form [formGroup]="form" action="">
    <div formArrayName="rowFactura" *ngFor="let item of ARRAY_ROWFACTURAS.controls; let i = index">
      <div [formGroupName]="i">
        <table #cuerpoFactTable="mdbTable" mdbTable class="table m-auto" small="true">
          <tbody>
            <tr>
              <!--  ::::::::::::  CONFIG  ::::::::::::  -->
              <td *ngIf="propietario" class="sombreado2">
                <div class="btn-group" dropdown id="divDropConfigRow" #dropConfigRow>
                  <i *ngIf="!checkIfArticuloRow(i)" class="fas fa-ellipsis-v btnConfigDis"></i>

                  <a *ngIf="checkIfArticuloRow(i)" dropdownToggle>
                    <i class="fas fa-ellipsis-v btnConfig"></i>
                  </a>
                  <ul class="dropdown-menu" role="menu" id="dropConfigRow">
                    <li role="menuitem">
                      <div class="from-group my-1 ml-2">
                        <input formControlName="calcular_saco" class="apple-switch ml-2" type="checkbox" (click)="CalculoSacos(i, $event)" />
                        <span class="ml-2 subirLabelCheck">Calcular saco</span>
                      </div>
                    </li>

                    <li role="menuitem">
                      <a class="dropdown-item" id="dropdown-item" (click)="modalRemover(i, $event)">
                        <i class="far fa-trash-alt text-red btnBorrar"></i>
                        Quitar Producto
                      </a>
                    </li>
                  </ul>
                </div>
              </td>
              <!-- <td
                *ngIf="propietario"
                class="{{ checkIfArticuloRow(i) ? 'btnQuitarRow' : 'sombreado' }}"
                (mouseover)="selectedRow(i, true)"
                (mouseleave)="selectedRow(i, false)"
              >

                <i class="far fa-trash-alt text-red btnBorrar" (click)="modalRemover(i)"></i>
              </td> -->
              <!--  ::::::::::::  CODIGO  ::::::::::::  -->
              <td class="COD td0padding">
                <div class="from-group">
                  <input
                    [readOnly]="!propietario"
                    type="text"
                    class="form-control entrada"
                    id="cod-{{ i }}"
                    (click)="verificarSecuencia(i)"
                    (keydown.enter)="saltar($event, 'can-', i)"
                    formControlName="cod"
                    (blur)="verificarRow(i)"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  CANTIDAD  ::::::::::::  -->
              <td class="CAN td0padding">
                <div class="from-group">
                  <input
                    [readOnly]="!propietario"
                    type="number"
                    min="0"
                    class="form-control entrada"
                    id="can-{{ i }}"
                    (click)="verificarSecuencia(i)"
                    (keydown.enter)="saltar($event, 'uni-', i)"
                    formControlName="can"
                    (focus)="llenarArrayUnidades(undefined, i)"
                    (blur)="calcularTotalRow(i) && verificarRow(i)"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  UNIDAD  ::::::::::::  -->
              <td class="UNI td0padding">
                <div class="from-group">
                  <input
                    [readOnly]="!propietario"
                    *ngIf="(drop && inputDrop !== secuenciaDelDrop(i)) || (!drop && inputDrop === secuenciaDelDrop(i)) || !drop"
                    type="text"
                    class="form-control entrada"
                    id="uni-{{ i }}"
                    (click)="verificarSecuencia(i, 'unidad')"
                    (keydown.enter)="saltar($event, metodo === 'venta' ? 'cod-' : 'pre-', i)"
                    formControlName="uni"
                    (blur)="calcularTotalRow(i) && verificarRow(i)"
                    tabindex="-1"
                  />

                  <div *ngIf="drop && inputDrop === secuenciaDelDrop(i)">
                    <select
                      value="Medida"
                      (focus)="verificarRow(i)"
                      formControlName="uni"
                      (change)="selectMedidaChange($event.target.value, i)"
                      class="form-control entrada"
                      style="border-radius: 0"
                      id="uni-{{ i }}"
                      (keydown.enter)="saltar($event, metodo === 'venta' ? 'cod-' : 'pre-', i)"
                      (blur)="calcularTotalRow(i) && verificarRow(i)"
                      tabindex="-1"
                    >
                      <option *ngFor="let item of UnidadesArticulo" value="{{ item.value }}">{{ item.value }}</option>
                    </select>
                  </div>
                </div>
              </td>

              <!--  ::::::::::::  DESCRIPCION  ::::::::::::  -->
              <td class="DES td0padding">
                <div class="from-group">
                  <input type="text" class="form-control entrada inDES" id="des-{{ i }}" formControlName="des" readonly="true" tabindex="-1" />
                </div>
              </td>

              <!--  ::::::::::::  DESCUENTO  ::::::::::::  -->

              <td class="DESC td0padding">
                <div class="from-group">
                  <input
                    type="number"
                    class="form-control entrada campoNumeros"
                    id="desc-{{ i }}"
                    (click)="verificarSecuencia(i)"
                    (keydown.enter)="enfocarInput('cod-' + (i + 1))"
                    formControlName="descuento_porciento"
                    (blur)="calcularDescuento(i)"
                    (emptied)="calcularDescuento(i)"
                    [readOnly]="readDescuento()"
                    tabindex="-1"
                  />
                </div>
              </td>
              <!--  ::::::::::::  PRECIO  ::::::::::::  -->
              <td class="PRE td0padding">
                <div class="from-group">
                  <input
                    type="text"
                    (blur)="revisarPrecio(i)"
                    (focus)="$event.target.select()"
                    class="form-control entrada campoNumeros {{ metodo === 'venta' ? 'inPRE' : '' }}"
                    (keydown.enter)="enfocarInput('cod-' + (i + 1))"
                    (click)="verificarRow(i)"
                    id="pre-{{ i }}"
                    formControlName="pre"
                    [readOnly]="readPrecio(i)"
                    tabindex="-1"
                  />
                </div>
              </td>

              <!--  ::::::::::::  PRECIO  ::::::::::::  -->
              <td class="TOT td0padding">
                <div class="from-group">
                  <input
                    type="text"
                    class="form-control entrada inTOT campoNumeros"
                    id="tot-{{ i }}"
                    formControlName="tot"
                    readonly="true"
                    tabindex="-1"
                  />
                  <input type="hidden" [value]="i" formControlName="secuencia" tabindex="-1" />
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </form>
</div>
