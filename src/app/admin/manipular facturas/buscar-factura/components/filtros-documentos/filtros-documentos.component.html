<button type="button" class="filtros-documentos-trigger" (click)="filtrosPopover.toggle($event)" [attr.aria-label]="'Abrir filtros avanzados'">
  <i class="fas fa-filter"></i>
  <span>Filtros avanzados</span>
  @if (filtrosActivos() > 0) {
    <strong>{{ filtrosActivos() }}</strong>
  }
</button>

<p-popover #filtrosPopover appendTo="body" [dismissable]="false" styleClass="filtros-documentos-popover" (onShow)="alMostrarPopover()" (onHide)="alCerrarPopover()">
  <div class="filtros-documentos-form">
    <div class="filtros-documentos-heading">
      <strong>Filtrar documentos</strong>
      <span>Refina el documento que deseas consultar.</span>
    </div>

    @if (esVentaOCompra()) {
      <label class="filtro-select">
        <span>Condición</span>
        <p-select inputId="condicionFiltro" styleClass="form-control field-sm" [ngModel]="condicion()" [options]="condiciones" optionLabel="label" optionValue="value" appendTo="body" (ngModelChange)="setCondicion($event)"></p-select>
      </label>
    } @else {
      <label class="filtro-select">
        <span>Estado</span>
        <p-select inputId="estadoFiltro" styleClass="form-control field-sm" [ngModel]="estado()" [options]="estados" optionLabel="label" optionValue="value" appendTo="body" (ngModelChange)="setEstado($event)"></p-select>
      </label>
    }

    @if (esVentaOCompra()) {
      <label class="filtro-select">
        <span>Tipo de factura</span>
        <p-select inputId="tipoFacturaFiltro" styleClass="form-control field-sm" [ngModel]="tipoFactura()" [options]="tipoFacturaOptions" optionLabel="label" optionValue="value" appendTo="body" (ngModelChange)="setTipoFactura($event)"></p-select>
      </label>
    }

    <div class="filtros-documentos-section-title">{{ esCotizacion() ? 'Total cotizado' : 'Total Facturado' }}</div>
    <div class="filtros-documentos-range">
      <label class="filtro-select">
        <span>Mínimo</span>
        <input type="text" inputmode="decimal" class="form-control inputE field-sm" appNumeroFormato [decimals]="2" [padDecimalsOnBlur]="false" [ngModel]="totalMin()" (ngModelChange)="setTotalMin($event)" placeholder="Sin mínimo" autocomplete="off" />
      </label>
      <label class="filtro-select">
        <span>Máximo</span>
        <input type="text" inputmode="decimal" class="form-control inputE field-sm" appNumeroFormato [decimals]="2" [padDecimalsOnBlur]="false" [ngModel]="totalMax()" (ngModelChange)="setTotalMax($event)" placeholder="Sin máximo" autocomplete="off" />
      </label>
    </div>

    @if (esVentaOCompra()) {
      <label class="filtro-select">
        <span>Balance Pendiente</span>
        <div class="filtros-documentos-balance">
          <p-select inputId="balanceComparadorFiltro" styleClass="form-control inputE field-sm" [ngModel]="balanceComparador()" [options]="comparadoresBalance" optionLabel="label" optionValue="value" panelStyleClass="balance-comparator-panel" appendTo="body" (ngModelChange)="setBalanceComparador($event)">
            <ng-template let-option pTemplate="selectedItem">
              <span class="balance-comparator-selected">{{ option?.symbol }}</span>
            </ng-template>
            <ng-template let-option pTemplate="item">
              <span class="balance-comparator-option"><strong>{{ option.symbol }}</strong><span>{{ option.label }}</span></span>
            </ng-template>
          </p-select>
          <input type="text" inputmode="decimal" class="form-control inputE field-sm" appNumeroFormato [decimals]="2" [padDecimalsOnBlur]="false" [ngModel]="balanceValor()" (ngModelChange)="setBalanceValor($event)" placeholder="Monto" autocomplete="off" />
        </div>
      </label>
    }

    <div class="filtros-documentos-actions">
      @if (filtrosActivos() > 0) {
        <button type="button" class="filtros-documentos-clear" (click)="limpiarFiltros()">Limpiar filtros</button>
      }
      <button type="button" class="filtros-documentos-apply" [disabled]="!filtrosPendientes" (click)="aplicarFiltros()">Aplicar filtros</button>
    </div>
  </div>
</p-popover>
