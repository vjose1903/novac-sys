<div class="row">
  <div class="col-12 mb-3">
    <h3>
      Buscar facturas :<b *ngIf="Para">{{ Para }}</b>
    </h3>
  </div>
  <div class="col-5">
    <div class="card card-padding sombra">
      <div class="form-group">
        <label class="control-label">Buscar factura por : </label>

        <select
          id="campoI"
          [(ngModel)]="campo"
          class="form-control"
          (keydown.enter)="saltar('valorI', $event.target.value)"
          (change)="changeSelect($event.target.value)"
          value=""
          [disabled]="existenComprobantes"
        >
          <option [value]="null" selected disabled>Escoger tipo</option>
          <option value="1">Por cliente</option>
          <option value="2">Por numero comprobante</option>
          <option value="3">Por numero factura</option>
        </select>
      </div>
      <div *ngIf="campo" class="form-group">
        <label class="control-label">{{ campoSelected + ' ' }} : </label>

        <ng-container *ngIf="campo === '1'">
          <input
            type="text"
            id="valorI"
            (keydown.enter)="saltar('cliente', $event.target.value)"
            (focus)="$event.target.select()"
            [placeholder]="placeHolder"
            class="form-control mb-4"
            autocomplete="off"
            [disabled]="existenComprobantes"
          />
        </ng-container>

        <ng-container *ngIf="campo === '2'">
          <input
            type="text"
            [textMask]="{ mask: ncfMask }"
            placeholder="b__________"
            class="form-control inputE UPPERCASE"
            (keydown.enter)="saltar('buscarFactura', $event.target.value)"
            (focus)="$event.target.select()"
            id="valorI"
            [disabled]="existenComprobantes"
          />
        </ng-container>
        <ng-container *ngIf="campo === '3'">
          <input
            type="number"
            id="valorI"
            (keydown.enter)="saltar('buscarFactura', $event.target.value)"
            (focus)="$event.target.select()"
            [placeholder]="placeHolder"
            class="form-control mb-4"
            autocomplete="off"
            [disabled]="existenComprobantes"
          />
        </ng-container>
      </div>
    </div>
  </div>
  <div class="col-12 rowIngre">
    <div *ngIf="facturas && this.campo === '1'" class="card card-padding sombra ingreCard">
      <div style="height: 90%;">
        <app-tablas [info]="info" [data]="facturas" [scrollContainer]="'scroll-container ingresosScroll'" (getInfoChange)="selectFactura($event)" [focusRow]="false"></app-tablas>
      </div>
      <div class="d-flex justify-content-end">
        <input (click)="abrirModal(undefined, 'cancelarBusqueda')" type="submit" class="btn btn-blanco mr-2" value="Cancelar" />
        <input [disabled]="abilitarBtns()" (click)="confirmarSeleccion()" type="submit" class="btn" value="Confirmar" id="btn-verde" />
      </div>
    </div>
  </div>
</div>
