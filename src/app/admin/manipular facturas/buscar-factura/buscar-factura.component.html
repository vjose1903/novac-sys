<div class="row BuscarFacturaRow">
  <div class="col-12 titulo">
    <h3 class="mb-0">
      Buscar facturas:<b *ngIf="para">{{ para }}</b>
    </h3>
  </div>

  <div class="col-12 p-0 arriba">
    <div class="row">
      <div class="col-6">
        <div class="card card-padding sombra">
          <!-- ================ TIPO DOCUMENTO  ================ -->
          <div *ngIf="buscarPara == 'solo_ver'" class="form-group">
            <label class="control-label mb-0">Tipo: </label>

            <select
              id="tipoI"
              [(ngModel)]="tipo_documento_selected"
              class="form-control inputE"
              (keydown.enter)="saltar($event.target.id, $event.target.value)"
              (change)="changeSelect('tipo_documento', $event.target.value)"
              value=""
              [ngClass]="{ disabled: noExistenComprobantes }"
            >
              <option [value]="null" selected disabled>Escoger tipo</option>
              <option *ngFor="let tipo of tipos_documentos" [value]="tipo.value">{{ tipo.label }}</option>
            </select>
          </div>

          <!-- ================ BUSCAR POR  ================ -->
          <div class="form-group">
            <label class="control-label mb-0">Buscar {{ tipo_documento_selected == 'cotizacion' ? 'cotización' : 'factura' }} por : </label>

            <select
              id="buscarPorI"
              [(ngModel)]="buscar_por"
              class="form-control inputE"
              (keydown.enter)="saltar($event.target.id, $event.target.value)"
              (change)="changeSelect('buscar_por', $event.target.value)"
              value=""
              [ngClass]="{ disabled: noExistenComprobantes }"
              [disabled]="buscarPara == 'solo_ver' && fun.isEmpty(tipo_documento_selected)"
            >
              <option [value]="null" selected disabled>Escoger tipo</option>
              <option *ngIf="tipo_documento_selected != 'compra'" value="1">Por cliente</option>
              <option *ngIf="tipo_documento_selected == 'compra'" value="5">Por suplidor</option>
              <option *ngIf="tipo_documento_selected != 'cotizacion'" value="2">Por número comprobante</option>
              <option value="3">Por número {{ tipo_documento_selected == 'cotizacion' ? 'cotización' : 'factura' }}</option>
              <option value="4">Ultimas 50 {{ tipo_documento_selected == 'cotizacion' ? 'cotizaciones' : 'facturas' }}</option>
            </select>
          </div>
          <div class="d-flex">
            <!-- ================ TIPO FACTURA  ================ -->

            <div *ngIf="buscar_por && buscar_por != campos.numeroComprobante && buscar_por != campos.ultimas50 && tipo_documento_selected != 'cotizacion'" class="form-group mr-2">
              <label class="control-label mb-0">Tipo factura : </label>

              <select id="campoTipoFact" [(ngModel)]="tipo_factura_id" class="form-control inputE" (keydown.enter)="saltar($event.target.id, $event.target.value)" [disabled]="noExistenComprobantes">
                <option [value]="null" selected disabled>Escoger tipo</option>
                <option value="3">Factura de consumo</option>
                <option value="2">Factura con Valor Fiscal</option>
                <!-- <option value="1">Factura sin comprobante</option> -->
                <option value="0">Todas</option>
              </select>
            </div>

            <!-- ================ VALOR A BUSCAR  ================ -->

            <div *ngIf="buscar_por && buscar_por != campos.ultimas50" class="form-group">
              <label class="control-label mb-0">{{ getProperties('label') + ' ' }} : </label>
              <ng-container *ngIf="buscar_por == campos.cliente || buscar_por == campos.suplidor">
                <input
                  id="valorI"
                  class="form-control inputE"
                  (keydown.enter)="saltar('cliente', $event.target.value)"
                  type="text"
                  (focus)="$event.target.select()"
                  [placeholder]="getProperties('placeHolder')"
                  autocomplete="off"
                  [disabled]="tipo_documento_selected != 'cotizacion' && fun.isEmpty(tipo_factura_id)"
                />
              </ng-container>

              <!-- ================ NUMERO COMPROBANTE  ================ -->
              <ng-container *ngIf="buscar_por == campos.numeroComprobante">
                <p-inputMask
                  inputId="valorI"
                  styleClass="form-control inputE UPPERCASE"
                  (keydown.enter)="saltar('buscarFactura', $event.target.value)"
                  mask="B9999999999"
                  tabindex="-1"
                  placeholder="B__________"
                  (onFocus)="$event.target.select()"
                  [autoClear]="false"
                ></p-inputMask>
              </ng-container>

              <!-- ================ NUMERO FACTURA  ================ -->
              <ng-container *ngIf="buscar_por == campos.numeroFactura">
                <input
                  id="valorI"
                  class="form-control inputE input_cantidad"
                  (keydown.enter)="saltar('buscarFactura', $event.target.value)"
                  type="number"
                  (focus)="$event.target.select()"
                  [placeholder]="getProperties('placeHolder')"
                  autocomplete="off"
                />
              </ng-container>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6">
        <i *ngIf="buscarPara.includes('nota')" class="fas fa-history btn-circle-icon" (click)="openSide()" [pTooltip]="buscarPara === 'nota_credito' ? 'Ver notas de crédito anteriores' : 'Ver notas de debito anteriores'" tooltipPosition="top"></i>
      </div>
    </div>
  </div>
  <div class="col-12 abajo">
    <div *ngIf="mostrarListaFacturas()" #cardTablaVerFacturas class="card sombra h-100 tablaContent br-1">
      <div class="divTabla">
        <dinamic-table [cardTabla]="cardTablaVerFacturas" [(data)]="facturas" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
      </div>
    </div>
  </div>
  <button *ngIf="mostrarListaFacturas() && para != 'Visualizar'" [disabled]="!(idsFacturasSeleccionadas.length > 0)" [disabled]="" class="btn btn-verde mr-2 footer" value="" (click)="continuarANotas()">Continuar</button>
</div>

<!-- ============================================================================================================================================ -->
<!-- SIDE NOTAS -->
<!-- ============================================================================================================================================ -->

<p-sidebar [(visible)]="showSide" position="right" styleClass="sideFact" [style]="{ width: '75%', 'z-index': 99999 }" (onHide)="onHideSide()">
  <div #cardTablaNota id="cardTablaNota" class="divTablaNotas">
    <div class="innerTablasNotas">
      <dinamic-table *ngIf="notas.length" [cardTabla]="cardTablaNota" [(data)]="notas" [(TablasComponent)]="tablaNotasComponent" [config]="table_notas_config" (table_events)="handle_table_events($event)"></dinamic-table>
    </div>
  </div>
</p-sidebar>
