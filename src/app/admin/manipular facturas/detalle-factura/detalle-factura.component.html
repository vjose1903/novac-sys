<div class="mainContainer">
  <div class="d-flex info flex-wrap column-gap-2">
    <div class="d-flex">
      <b class="mr-2">{{ entidadLabel }}: </b>
      <p-tag [rounded]="true" [style]="{ background: '#bfbfbf', 'white-space': 'nowrap', width: '-webkit-fill-available', overflow: 'hidden', display: 'inline-block' }">
        <p class="text-black mb-0">{{ inputs.data.cliente.nombre }}</p>
      </p-tag>
    </div>

    @if (inputs?.data?.numero_comprobante) {
    <div class="d-flex">
      <b class="mr-2">Comprobante: </b>
      <p-tag [rounded]="true" [style]="{ background: '#bfbfbf', 'white-space': 'nowrap', width: '-webkit-fill-available', overflow: 'hidden', display: 'inline-block' }">
        <p class="text-black mb-0">{{ inputs.data.numero_comprobante }}</p></p-tag
      >
    </div>
    }
  </div>

  <hr class="rayaTop" />
  
  <div class="row">
    @for (item of detalles; track index; let index = $index) {
      <div class="col-6 pl-0">
        <ng-container class="d-flex">
          <p>
            <strong>{{ item.label }}</strong> : {{ getValue(item) }}
          </p>
        </ng-container>
      </div>
    }
  </div>
</div>
