<div class="mainContainer">
  <div class="d-flex info">
    <div class="d-flex">
      <b class="mr-2">Cliente: </b>
      <p-tag [rounded]="true" [style]="{ background: '#bfbfbf', 'white-space': 'nowrap', width: '-webkit-fill-available', overflow: 'hidden', display: 'inline-block' }">
        <p class="text-black mb-0">{{ inputs.data.cliente.nombre }}</p></p-tag
      >
    </div>

    <div class="d-flex ml-3">
      <b class="mr-2 no-wrap">Total Nota: </b>
      <p-tag [rounded]="true" [style]="{ background: '#bfbfbf', 'white-space': 'nowrap', width: '-webkit-fill-available', overflow: 'hidden', display: 'inline-block' }">
        <p class="text-black mb-0">{{ numFormat(inputs.data.total) }}</p></p-tag
      >
    </div>
  </div>

  <div class="tabs">
    <div class="fantasma">
      <p-tabs [(value)]="tabIndex" [scrollable]="true" class="panel-padding-0">
        <p-tablist>
          @for (iteraFact of inputs.data.facturas_aplicadas; track $index) {
          <p-tab [value]="$index">
            {{ iteraFact.cabecera_factura.numero_comprobante }}
          </p-tab>

          }
        </p-tablist>
        <p-tabpanels>
          @for (iteraFact of inputs.data.facturas_aplicadas; track $index) {
          <p-tabpanel [value]="$index">
            <div class="w-100 h-100 pt-3">
              <div #cardTablaDetalleNota id="cardTabla" class="divTabla">
                <div class="innerTablaNotas">
                  <dinamic-table
                    [cardTabla]="cardTablaDetalleNota"
                    [post_id]="'-' + iteraFact.id"
                    [(data)]="iteraFact.detalles_facturas_notas"
                    [(TablasComponent)]="tablaComponent"
                    [config]="table_config"
                    (table_events)="handle_table_events($event)"
                  ></dinamic-table>
                </div>
              </div>
            </div>
          </p-tabpanel>
          }
        </p-tabpanels>
      </p-tabs>
    </div>
  </div>
</div>
