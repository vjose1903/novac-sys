<div class="image-container" [ngClass]="{ noContainer: src_img }">
  <img style="max-width: 98%; max-height: 98%" id="blah" [src]="src_img" [ngClass]="{ 'd-none': !src_img }" alt="your image" />
</div>

<div class="d-flex align-items-center mt-3" [ngClass]="{ 'justify-content-around': src_img, 'justify-content-center': !src_img }" style="min-width: 13rem">
  <input type="file" lang="es" id="imgInput-{{ id }}" (change)="onFileChange($event)" accept=".jpg, .png, .jpeg, .svg" />

  <label for="imgInput-{{ id }}" class="btn-file mb-0">
    <span>Buscar imagen</span>
    <i class="fa-solid fa-file-arrow-up icon"></i>
  </label>

  <button *ngIf="src_img" pTooltip="Remover imagen" tooltipPosition="right" (click)="borrar($event)" class="btn px-1 my-0 py-0 ml-2" id="btn-gris"><i class="fas fa-eraser"></i></button>
</div>
