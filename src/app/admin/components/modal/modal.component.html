<span *ngFor="let modalConfig of modalsConfig">
  <p-dialog
    *ngIf="modalConfig"
    #myModal
    [id]="modalConfig.id"
    [header]="modalConfig.header"
    [(visible)]="modalConfig.show"
    [breakpoints]="{ '767px': '90vw' }"
    [position]="modalConfig.position"
    [contentStyleClass]="modalConfig.contentStyleClass"
    [baseZIndex]="10000"
    [draggable]="false"
    [modal]="true"
    [showHeader]="hasValue(modalConfig.header)"
    [blockScroll]="false"
    [resizable]="false"
    [closeOnEscape]="modalConfig.closableEsc"
    [closable]="modalConfig.closable"
    [transitionOptions]="modalConfig.transitionOptions"
    (onHide)="onHideModal(modalConfig.id)"
  >
    <div [ngStyle]="{ height: modalConfig.height, width: modalConfig.width }" style="transition: all 0.5s">
      <div *ngIf="modalConfig.html; else component" [innerHtml]="modalConfig.html"></div>
      <ng-template #component>
        <ng-container [appModal]="modalConfig.id"></ng-container>
      </ng-template>
    </div>

    <ng-template *ngIf="hasAnyBtn(modalConfig)" pTemplate="footer">
      <div class="d-flex justify-content-end align-items-center mt-2">
        <ng-container *ngFor="let dynamic_boton of modalConfig?.botones?.dinamico">
          <span [pTooltip]="getButtonTooltip(dynamic_boton)" tooltipPosition="top">
            <button [disabled]="disabledButton(dynamic_boton || false)" class="btn {{ dynamic_boton.clase }}" (click)="dynamicFunction(modalConfig, dynamic_boton)">
              {{ dynamic_boton.label }}
            </button>
          </span>
        </ng-container>

        <span [pTooltip]="getButtonTooltip(modalConfig?.botones?.cancelar)" tooltipPosition="top">
          <button *ngIf="modalConfig?.botones?.cancelar?.show" class="btn btn-blanco" (click)="cancelarAndAceptar(false, modalConfig.id)" [disabled]="disabledButton(modalConfig?.botones?.cancelar || false)">Cancelar</button>
        </span>

        <span [pTooltip]="getButtonTooltip(modalConfig?.botones?.aceptar)" tooltipPosition="top">
          <button *ngIf="modalConfig?.botones?.aceptar?.show" class="btn btn-verde" (click)="cancelarAndAceptar(true, modalConfig.id)" [disabled]="disabledButton(modalConfig?.botones?.aceptar || false)">Aceptar</button>
        </span>
      </div>
    </ng-template>
  </p-dialog>
</span>
