<div #dinamicTable class="dinamicTable position-relative" [ngStyle]="{ height: padre.firstChild.offsetHeight + 'px' }">
  <!-- h-100 -->
  <div id="searchDiv-{{ id_tabla }}" #searchDiv *ngIf="search" class="searchDiv">
    <label class="search-label" for="search">Busqueda </label>
    <div style="max-width: 12rem">
      <input [(ngModel)]="searchText" id="search" class="search-input form-control" (ngModelChange)="awaitTyping($event)" />
    </div>
  </div>

  <!-- TABLA -->
  <div #fantasma class="divTableFantasma h-100"></div>
  <div #divTable class="divTable" [ngStyle]="{ height: fantasma.offsetHeight + 'px' }">
    <table *ngIf="info" class="myTable" id="VICtablas">
      <!-- THEAD -->
      <thead class="text-center position-relative thead" [ngClass]="{ 'head-table': colorHead, 'head-table-none': !colorHead }">
        <tr id="titulosHeader-{{ id_tabla }}" #titulosHeader>
          <th id="{{ row?.titulo }}-{{ id_tabla }}" *ngFor="let row of info" class="thHead">
            <span [ngSwitch]="row?.tipo">
              <span *ngSwitchCase="'inputSwitch'">
                <ng-container *ngIf="!row?.select_all"> {{ row?.titulo }} </ng-container>

                <input
                  *ngIf="row?.select_all"
                  class="apple-switch"
                  type="checkbox"
                  [checked]="select_all_value"
                  pTooltip="{{ select_all_value ? 'Deseleccionar todo' : 'Seleccionar todo' }}"
                  tooltipPosition="top"
                  (change)="changeValorSelectAll()"
                />
              </span>

              <span *ngSwitchDefault>
                <span> {{ row?.titulo }} </span>
              </span>
            </span>
          </th>
          <th *ngIf="botones && botones?.titulo" class="thHead">Acciones</th>
        </tr>
      </thead>
      <!-- TBODY -->
      <div class="divBody">
        <tbody class="tbody">
          <!-- [ngStyle]="{ height: obj_alto.altoTbody + 'px' }" -->
          <ng-container *ngIf="data">
            <tr
              *ngFor="let dato of data | paginate: { id: id_tabla, itemsPerPage: mostrar, currentPage: pagActual, totalItems: total_registros }; index as i"
              class="text-center"
              id="{{ ROW }}{{ getIndex(i) }}"
              [ngClass]="{
                tdHover: tablaHover,
                tdNoHover: !tablaHover,
                'bg-selected': !focusRow && dato.id === seleccionado_id,
                'bg-light': focusRow && RowElement.id == IDROW,
                'bg-more-light': dato.subrayar
              }"
              style="cursor: pointer"
              #RowElement
              (click)="clickROW(dato)"
            >
              <td
                *ngFor="let column of info; let j = index"
                class="tableTD"
                id="td-{{ column.key.key ? column.key.key : column.key }}-{{ getIndex(i) }}"
                [ngStyle]="getStyle(column.key, getIndex(i))"
                [ngSwitch]="column.tipo"
              >
                <span
                  *ngSwitchCase="'text'"
                  [pTooltip]="column.text_tooltip ? dato[column.text_tooltip] : ''"
                  [tooltipPosition]="getIndex(i) != 0 ? 'top' : 'bottom'"
                  id="{{ column.key }}-{{ getIndex(i) }}"
                  style="width: 100%"
                  class="text-{{ column.color ? (dato[column.text_color] ? dato[column.text_color] : 'black') : 'black' }}"
                >
                  {{ dato[column.key] }}
                </span>

                <span
                  *ngSwitchCase="'cantidades'"
                  id="{{ column.key }}-{{ getIndex(i) }}"
                  pTooltip="{{ lookOters(dato[column.key]).Padre }} {{ lookOters(dato[column.key]).Hijo === undefined ? '' : lookOters(dato[column.key]).Hijo }}"
                  [tooltipPosition]="getIndex(i) != 0 ? 'top' : 'bottom'"
                  style="width: 100%"
                >
                  {{ lookprincipal(dato[column.key]) }}
                </span>

                <span
                  *ngSwitchCase="'tag'"
                  id="{{ column.key }}-{{ getIndex(i) }}"
                  [pTooltip]="column.text_tooltip ? dato[column.text_tooltip] : ''"
                  tooltipPosition="{{ getIndex(i) != 0 ? 'top' : 'bottom' }}"
                  style="width: 100%"
                >
                  <p-tag
                    [value]="dato[column.key]"
                    [rounded]="true"
                    [severity]="dato[column.tag_severity]"
                    [ngClass]="{ tag_clickable: !!column.click }"
                    [style]="{
                      background: dato[column.tag_color],
                      'white-space': 'nowrap',
                      width: column.tag_apretada ? 'auto' : '-webkit-fill-available',
                      overflow: 'hidden',
                      'text-overflow': 'ellipsis',
                      display: 'inline-block'
                    }"
                  ></p-tag>
                </span>

                <span *ngSwitchCase="'icon'">
                  <span *ngIf="dato._destroy !== '1'" [pTooltip]="column.text_tooltip ? dato[column.text_tooltip] : ''" [tooltipPosition]="i != 0 ? 'top' : 'bottom'">
                    <i
                      id="{{ column.key }}-{{ getIndex(i) }}"
                      (click)="iconBtn(column.key, getIndex(i), dato)"
                      class="{{ getIconClass(column, dato) }} {{ dato.iconHover ? 'c-pointer' : '' }}   text-{{
                        column.color ? (dato[column.text_color] ? dato[column.text_color] : 'black') : 'black'
                      }}"
                      (mouseenter)="mouseMoveEvent('hover', dato, column.key, $event.target.id)"
                      (mouseleave)="mouseMoveEvent('leave', dato, column.key, $event.target.id)"
                    ></i>
                  </span>
                </span>

                <span
                  *ngSwitchCase="'formatoNumero'"
                  id="{{ column.key }}-{{ getIndex(i) }}"
                  style="width: 100%"
                  [pTooltip]="column.text_tooltip ? dato[column.text_tooltip] : ''"
                  [tooltipPosition]="getIndex(i) != 0 ? 'top' : 'bottom'"
                >
                  {{ formatoNumero(dato[column.key]) }}
                </span>

                <span *ngSwitchCase="'inputSwitch'" [pTooltip]="column.text_tooltip ? dato[column.text_tooltip] : ''" [tooltipPosition]="i != 0 ? 'top' : 'bottom'">
                  <div class="form-group m-0 switchDiv">
                    <input class="apple-switch" [ngClass]="{ disabled: disabledInput(dato, column) }" type="checkbox" (change)="changeValorCheck(column.key, getIndex(i), false, dato)" [checked]="dato[column.key]" />
                    <span class="ml-2">{{ column.title }}</span>
                  </div>
                </span>

                <span *ngSwitchCase="'input'" [pTooltip]="column.text_tooltip ? dato[column.text_tooltip] : ''" [tooltipPosition]="i != 0 ? 'top' : 'bottom'">
                  <div *ngIf="!column.checkNumber">
                    <input
                      class="form-control m-0 inputTabla {{ column.inputType ? (column.inputType == 'number' ? 'input_cantidad' : '') : '' }}"
                      id="input-{{ id_tabla }}-{{ getIndex(i) }}"
                      [min]="dato.min_ ? dato.min_ : 0"
                      [max]="dato.max_ ? dato.max_ : null"
                      type="{{ column.inputType ? column.inputType : 'text' }}"
                      [value]="dato[column.key]"
                      [ngClass]="{ disabled: disabledInput(dato, column) }"
                      (keyup)="changeValorInput(column.key, getIndex(i), $event.target.value, dato)"
                      (change)="changeValorInput(column.key, getIndex(i), $event.target.value, dato)"
                    />
                  </div>
                  <div *ngIf="column.checkNumber">
                    <input
                      class="form-control m-0 inputTabla"
                      type="text"
                      id="input-{{ getIndex(i) }}"
                      [value]="dato[column.key]"
                      (blur)="revisarPrecio(i, $event.target.value, column.key, 'input-' + getIndex(i), dato)"
                      [ngClass]="{ disabled: disabledInput(dato, column) }"
                      (keyup)="changeValorInput(column.key, getIndex(i), $event.target.value, dato)"
                      (change)="changeValorInput(column.key, getIndex(i), $event.target.value, dato)"
                    />
                  </div>
                </span>
              </td>

              <td id="td-acciones-{{ getIndex(i) }}" class="btnAccion tableTD" *ngIf="botones && botones?.titulo">
                <app-btnacciones [row]="dato" [i]="getIndex(i)" [data]="data" [botones]="botones" (deleteBTN)="delete($event)" (DevolverInfoBTN)="devolverInfo($event)"></app-btnacciones>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </div>
      <!-- TFOOT -->
      <tfoot class="w-100 tfoot">
        <div *ngIf="paginate" id="paginationDiv-{{ id_tabla }}" #paginationDiv class="d-flex flex-row-reverse">
          <pagination-controls nextLabel="Siguiente" previousLabel="Anterior" class="my-pagination mr-3" [maxSize]="5" [id]="id_tabla" (pageChange)="pageChange($event)"></pagination-controls>

          <div class="btn-group" dropdown [dropup]="true">
            <button id="button-dropup" dropdownToggle type="button" class="btn btn-peque btn-tema dropdown-toggle" aria-controls="dropdown-dropup">
              {{ mostrar }} reg.<span class="caret"></span>
            </button>
            <ul id="dropdown-dropup" class="dropdown-menu dropCantReg" role="menu" aria-labelledby="button-dropup">
              <li *ngFor="let i of listaMostrar" role="menuitem" (click)="cambiaMostrar(i)">
                <a class="dropdown-item"> {{ i }} registros</a>
              </li>
            </ul>
          </div>
        </div>
      </tfoot>
    </table>
  </div>
  <!-- FILTER -->
</div>
