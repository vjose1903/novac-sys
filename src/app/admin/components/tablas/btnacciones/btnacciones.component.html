<span mdbTooltip="Mostrar" (click)="devolverInfo(row, 'mostrar')" placement="{{ i === 0 ? 'bottom' : 'top' }}" *ngIf="botones.mostrar">
  <i class="far fa-eye"></i>
</span>

<span mdbTooltip="Editar" (click)="devolverInfo(row, 'editar')" placement="{{ i === 0 ? 'bottom' : 'top' }}" *ngIf="botones.editar">
  <i class="fas fa-pencil-alt"></i>
</span>

<span mdbTooltip="Borrar" (click)="delete(row)" placement="{{ i === 0 ? 'bottom' : 'top' }}" *ngIf="botones.borrar">
  <i class="far fa-trash-alt"></i>
</span>

<span mdbTooltip="Movimientos de inventario" (click)="devolverInfo(row, 'inventario')" placement="{{ i === 0 ? 'bottom' : 'top' }}" *ngIf="botones.inventario">
  <i class="fas fa-dolly"></i>
</span>
