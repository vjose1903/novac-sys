<span pTooltip="Mostrar" (click)="devolverInfo(row, 'mostrar')" tooltipPosition="{{ i === 0 ? 'bottom' : 'top' }}" *ngIf="botones.mostrar">
  <i class="far fa-eye" ></i>
</span>

<span pTooltip="Editar" (click)="devolverInfo(row, 'editar')" tooltipPosition="{{ i === 0 ? 'bottom' : 'top' }}" *ngIf="botones.editar">
  <i class="fas fa-pencil-alt" ></i>
</span>

<span pTooltip="Borrar" (click)="delete(row)" tooltipPosition="{{ i === 0 ? 'bottom' : 'top' }}" *ngIf="botones.borrar">
  <i class="far fa-trash-alt" ></i>
</span>

<span pTooltip="Movimientos de inventario" (click)="devolverInfo(row, 'inventario')" tooltipPosition="{{ i === 0 ? 'bottom' : 'top' }}" *ngIf="botones.inventario">
  <i class="fas fa-dolly" ></i>
</span>
