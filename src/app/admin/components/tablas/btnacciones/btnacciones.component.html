<span (click)="devolverInfo(row, 'mostrar')" *ngIf="botones.mostrar">
  <i class="far fa-eye" pTooltip="Mostrar" tooltipPosition="{{ i === 0 ? 'bottom' : 'top' }}"></i>
</span>

<span (click)="devolverInfo(row, 'editar')" *ngIf="botones.editar">
  <i class="fas fa-pencil-alt" pTooltip="Editar" tooltipPosition="{{ i === 0 ? 'bottom' : 'top' }}"></i>
</span>

<span (click)="delete(row)" *ngIf="botones.borrar">
  <i class="far fa-trash-alt" pTooltip="Borrar" tooltipPosition="{{ i === 0 ? 'bottom' : 'top' }}"></i>
</span>

<span (click)="devolverInfo(row, 'inventario')" *ngIf="botones.inventario">
  <i class="fas fa-dolly" pTooltip="Movimientos de inventario" tooltipPosition="{{ i === 0 ? 'bottom' : 'top' }}"></i>
</span>
