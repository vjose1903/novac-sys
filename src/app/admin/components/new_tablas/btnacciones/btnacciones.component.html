<div class="position-relative">
  <span *ngIf="windowsWidth >= 768; else cellPhone">
    <ng-container *ngFor="let btn of botones?.dinamico">
      <ng-container *ngIf="btn?.show">
        <span pTooltip="{{ btn?.tooltip || dato[btn?.tooltipKey] }}" (click)="handleFunctionsBtnDinamic($event, btn, dato)" tooltipPosition="left" *ngxPermissionsOnly="btn?.permiso">
          <i class="table-btn-icon  {{ btn?.icon }}"></i>
        </span>
      </ng-container>
    </ng-container>

    <ng-container *ngIf="botones?.mostrar?.show">
      <span pTooltip="Mostrar" (click)="clickBtn($event, dato, 'mostrar')" tooltipPosition="left" *ngxPermissionsOnly="botones?.mostrar?.permiso">
        <i class="table-btn-icon far fa-eye"></i>
      </span>
    </ng-container>

    <ng-container *ngIf="botones?.editar?.show">
      <span pTooltip="Editar" (click)="clickBtn($event, dato, 'update')" tooltipPosition="left" *ngxPermissionsOnly="botones?.editar?.permiso">
        <i class="table-btn-icon fas fa-pencil-alt"></i>
      </span>
    </ng-container>

    <ng-container *ngIf="botones?.borrar?.show">
      <span pTooltip="Borrar" (click)="clickBtn($event, dato, 'delete')" tooltipPosition="left" *ngxPermissionsOnly="botones?.borrar?.permiso">
        <i class="table-btn-icon far fa-trash-alt"></i>
      </span>
    </ng-container>
  </span>
</div>

<ng-template #cellPhone>
  <p-speedDial id="speedDial-{{ index_body }}" [model]="items" type="{{ items.length > 3 ? 'semi-circle' : 'linear' }}" [radius]="15 * items.length" className="btn-table-cellphone" direction="left" appendTo="body"></p-speedDial>
</ng-template>
