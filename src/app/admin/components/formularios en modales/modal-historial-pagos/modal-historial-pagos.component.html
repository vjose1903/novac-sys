<div style="height: 100%">
  <p-tabView #TabViewHistorial [(activeIndex)]="activeIndex" styleClass="my_tabView" (onChange)="clickTabView($event.index)">
    <p-tabPanel
      *ngIf="showRecibos"
      [disabled]="arrayHasData('recibos').disable"
      tooltip="Factura no tiene recibos"
      headerStyleClass="{{ arrayHasData('recibos').disable ? 'noTabView' : '' }}"
      tooltipDisabled="true"
      tooltipStyleClass="{{ arrayHasData('recibos').disable ? 'd-block' : 'd-none' }} tabViewTootip"
      header="Abonos {{ !arrayHasData('recibos').disable ? '(' + arrayHasData('recibos').cant + ')' : '' }}"
    >
      @if (show) {
      <div class="d-flex h-100 w-100" #cardTablaPagos id="cardTabla">
        <dinamic-table [cardTabla]="cardTablaPagos" [(data)]="inputs['recibos']" [(TablasComponent)]="tablaPagosComponent" [config]="table_pagos_config" (table_events)="handle_table_events($event)"></dinamic-table>
      </div>
      }
    </p-tabPanel>

    <p-tabPanel
      *ngIf="showPagos"
      [disabled]="arrayHasData('pagos').disable"
      tooltip="Factura no tiene pagos"
      headerStyleClass="{{ arrayHasData('pagos').disable ? 'noTabView' : '' }}"
      tooltipDisabled="true"
      tooltipStyleClass="{{ arrayHasData('pagos').disable ? 'd-block' : 'd-none' }} tabViewTootip"
      header="Pagos {{ !arrayHasData('pagos').disable ? '(' + arrayHasData('pagos').cant + ')' : '' }}"
    >
      <div *ngIf="show" class="d-flex h-100 w-100" #cardTablaPagos id="cardTabla">
        <dinamic-table [cardTabla]="cardTablaPagos" [(data)]="inputs['pagos']" [(TablasComponent)]="tablaPagosComponent" [config]="table_pagos_config" (table_events)="handle_table_events($event)"></dinamic-table>
      </div>
    </p-tabPanel>

    <p-tabPanel
      *ngIf="showNotas"
      [disabled]="arrayHasData('notas').disable"
      tooltip="Factura no tiene notas aplicadas"
      headerStyleClass="{{ arrayHasData('notas').disable ? 'noTabView' : '' }}"
      tooltipDisabled="true"
      tooltipStyleClass="{{ arrayHasData('notas').disable ? 'd-block' : 'd-none' }} tabViewTootip"
      header="Notas {{ !arrayHasData('notas').disable ? '(' + arrayHasData('notas').cant + ')' : '' }}"
    >
      @if (show) {
      <div class="d-flex h-100 w-100" #cardTablaNota id="cardTablaNota">
        <dinamic-table [cardTabla]="cardTablaNota" [(data)]="inputs['notas']" [(TablasComponent)]="tablaNotasComponent" [config]="table_notas_config" (table_events)="handle_table_events($event)"></dinamic-table>
      </div>
      }
    </p-tabPanel>
  </p-tabView>
</div>
