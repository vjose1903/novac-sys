<div style="height: 100%">
  <p-tabView [(activeIndex)]="activeIndex" styleClass="my_tabView" (onChange)="clickTabView($event.index)">
    <p-tabPanel
      [disabled]="arrayHasData('abonos').disable"
      tooltip="Factura no tiene abonos"
      headerStyleClass="{{ arrayHasData('abonos').disable ? 'noTabView' : '' }}"
      tooltipDisabled="true"
      tooltipStyleClass="{{ arrayHasData('abonos').disable ? 'd-block' : 'd-none' }} tabViewTootip"
      header="Abonos {{ !arrayHasData('abonos').disable ? '(' + arrayHasData('abonos').cant + ')' : '' }}"
      >
      @if (show) {
        <div class="d-flex h-100 w-100" #cardTablaPagos id="cardTabla">
          <dinamic-table [cardTabla]="cardTablaPagos" [(data)]="inputs['abonos']" [(TablasComponent)]="tablaPagosComponent" [config]="table_pagos_config" (table_events)="handle_table_events($event)"></dinamic-table>
        </div>
      }
    </p-tabPanel>

    <p-tabPanel
      [disabled]="arrayHasData('notas').disable"
      tooltip="Factura no tiene notas aplicadas"
      headerStyleClass="{{ arrayHasData('notas').disable ? 'noTabView' : '' }}"
      tooltipDisabled="true"
      tooltipStyleClass="{{ arrayHasData('notas').disable ? 'd-block' : 'd-none' }} tabViewTootip"
      header="Notas {{ !arrayHasData('notas').disable ? '(' + arrayHasData('notas').cant + ')' : '' }}"
      >
      @if (show) {
        <div class="d-flex h-100 w-100" #cardTablaNota id="cardTablaNota">
          <dinamic-table [cardTabla]="cardTablaNota" [(data)]="inputs['notas']" [(TablasComponent)]="tablaNotasComponent" [config]="table_notas_config" (table_events)="handle_table_events($event)"></dinamic-table>
        </div>
      }
    </p-tabPanel>
  </p-tabView>
</div>
