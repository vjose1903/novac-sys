<h4 class="mb-3">Introduzca fecha y hora de factura pendiente:</h4>
<div class="row">
  <div class="col-5 rowFecha">
    <input
      type="text"
      [bsConfig]="dpConfig"
      placeholder="mm/dd/aaaa"
      class="form-control"
      [(ngModel)]="fecha"
      #dp="bsDatepicker"
      placement="bottom"
      bsDatepicker
    />
  </div>
  <div class="col-7">
    <ngb-timepicker id="timepiker_______" [(ngModel)]="time" [size]="'small'" [meridian]="meridian"></ngb-timepicker>
  </div>
</div>
<div class="row mt-3">
  <div class="col-12">
    <div class="form-group">
      <input (click)="accion(false)" type="submit" class="btn btn-blanco mr-2" value="Cancelar" />
      <input (click)="makeDateTime()" type="submit" class="btn" value="Confirmar" id="btn-verde" />
    </div>
  </div>
</div>
