<h4 class="mb-3">Introduzca fecha y hora de factura pendiente:</h4>
{{ fecha | date : 'dd/MM/yyyy HH:mm' }}

<div class="row">
  <div class="col-5 rowFecha">
    <p-calendar inputId="fecha" [(ngModel)]="fecha" [maxDate]="maxDate" appendTo="body" (ngModelChange)="changeHour()" dateFormat="dd/mm/yy" placeholder="dd/mm/aaaa"></p-calendar>
  </div>
  <div class="col-7">
    <ngb-timepicker id="timepiker_______" [(ngModel)]="time" size="small" [meridian]="meridian" (ngModelChange)="changeHour()"></ngb-timepicker>
  </div>
</div>
