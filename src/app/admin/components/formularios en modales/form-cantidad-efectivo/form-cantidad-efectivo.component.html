
<div *ngIf="(documento != 'compra' || documento == 'recibo_ingreso') && (inputs.tipo_modal == TipoCantidadEfectivo.devuelta || inputs.tipo_modal == TipoCantidadEfectivo.noDevuelta)" class="row">
  <div class="col-12">
    <div class="d-flex">
      <h3 class="label w-100">TOTAL: RD$</h3>
      <span class="negrita w-100 total text-end">
        {{ formatoNumero(inputs.total_factura) }}
      </span>
    </div>

    <div *ngIf="inputs.documento != 'pago_factura'" class="form-group">
      <h3 class="label w-100 mt-3">EFECTIVO: RD$</h3>
      <input
        type="text"
        class="form-control inputEfectivo"
        (focus)="$event.target.select()"
        (keyup)="calcularDevueta()"
        (keydown.enter)="saltar('inputFormaPago')"
        [(ngModel)]="efectivo"
        (ngModelChange)="validarForm('input')"
        (blur)="revisarPrecio($event.target)"
        id="inputEfectivo"
      />
    </div>

    <div class="form-group">
      <h3 class="label w-100 mt-3">FORMA DE PAGO</h3>
      <select [(ngModel)]="formaPago" id="inputFormaPago" (keydown.enter)="saltar('send')" class="form-control inputEfectivo">
        <option value="Efectivo">Efectivo</option>
        <option value="Tarjeta">Tarjeta</option>
        <option value="Transferencia">Transferencia Bancaria</option>
        <option value="Cheque">Cheque</option>
      </select>
    </div>

    <div *ngIf="inputs.tipo_modal == TipoCantidadEfectivo.devuelta" class="d-flex mt-3">
      <h3 class="label w-100">DEVUELTA: RD$</h3>
      <span *ngIf="devuelta" class="negrita w-100 total text-end">
        {{ devuelta }}
      </span>
    </div>
  </div>
</div>

<!-- ======================================================= -->
<div *ngIf="documento == 'compra'" class="row">
  <div class="col-12">
    <div class="d-flex si-wrap">
      <h3 class="label w-100 no-wrap mr-2">TOTAL DE COMPRA: RD$</h3>
      <span class="negrita w-100 total">
        {{ formatoNumero(inputs.total_factura) }}
      </span>
    </div>

    <div *ngIf="inputs.cambios_articulos" class="cambioDePrecios mb-3">
      <span class="spanTituloCambio"> <span> ALGUNOS ARTICULOS CAMBIARON SU COSTO </span> &nbsp; <i class="fas fa-exclamation-circle"></i> </span>
      <span class="deseaCambio_"> ¿Desea actualizar los costos de los articulos automaticamente? </span>
      <span class="decisionesCambio">
        <span class="si_">
          SI
          <i (click)="cambiosEnArticulos('si')" class=" btnDecision {{ cambiar_articulos == 'si' ? 'far fa-check-square' : 'far fa-square' }}"></i>
        </span>
        <span class="no_">
          NO

          <i (click)="cambiosEnArticulos('no')" class=" btnDecision {{ cambiar_articulos == 'no' ? 'far fa-check-square' : 'far fa-square' }}"></i>
        </span>
      </span>
    </div>
  </div>
</div>

<div class="d-flex align-items-center h-100 mt-2">
  <label class="control-label mr-2 mb-0">Imprimir documento: </label>
  <input class="apple-switch" type="checkbox" [(ngModel)]="is_print" />
</div>
