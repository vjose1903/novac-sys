<form [formGroup]="form">
  <div class="row">
    <div class="col-sm-12">
      <div class="from-group">
        <label class="control-label">Contraseña: </label>
        <input
          required
          type="password"
          formControlName="password"
          id="pass"
          placeholder="Introduzca contraseña"
          class="form-control"
          autocomplete="off"
        />
        <div
          class="alerta text-danger ml-1"
          style="font-size: 12px"
          *ngIf="!form.controls['password'].valid && (form.controls['password'].dirty || form.controls['password'].touched)"
        >
          Debe de introducir la nueva contraseña
        </div>
      </div>
    </div>
    <div class="col-sm-12 mt-3">
      <div class="from-group">
        <label class="control-label">Confirmar contraseña: </label>
        <input
          required
          type="password"
          compare="password"
          formControlName="confirmPassword"
          placeholder="Introduzca contraseña"
          class="form-control"
          autocomplete="off"
        />
        <div
          class="alerta text-danger ml-1"
          style="font-size: 12px"
          *ngIf="!form.controls['confirmPassword'].valid && (form.controls['confirmPassword'].dirty || form.controls['confirmPassword'].touched)"
        >
          <div *ngIf="form.controls['confirmPassword'].errors['required']">Este Campo es obligatorio Minimo 5 caracteres</div>
          <div *ngIf="form.controls['confirmPassword'].errors['compares']">Las contraseñas no coinciden</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-md-12">
      <div class="from-group">
        <input (click)="accion(false)" type="submit" class="btn btn-blanco mr-2" value="Cancelar" />
        <input (click)="accion(true)" type="submit" class="btn" value="Confirmar" id="btn-verde" />
      </div>
    </div>
  </div>
</form>
