<div #cardTabla id="cardTabla" style="height: 100%; position: relative">
  <app-tablas
    *ngIf="articulosParsed"
    [padre]="cardTabla"
    [info]="info"
    [search]="false"
    [data]="articulos"
    (getInfoChange)="getInfoChange($event)"
    [tablaHover]="false"
    [pad]="false"
    [colorHead]="false"
    [focusRow]="false"
  ></app-tablas>
</div>
