<div #cardTabla id="cardTabla" style="height: 100%; position: relative; display: flex">
  <app-tablas
    class="h-100"
    *ngIf="inputs && info"
    [padre]="cardTabla"
    [info]="info"
    [search]="false"
    [data]="inputs"
    (getInfoChange)="getInfoChange($event)"
    [tablaHover]="false"
    [pad]="false"
    [colorHead]="false"
    [focusRow]="false"
  ></app-tablas>
</div>
