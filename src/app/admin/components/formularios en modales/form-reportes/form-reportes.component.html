<form [formGroup]="form">
  <div class="row">
    <!-- ----- CONDICION -----  -->
    <div *ngIf="tipo_reporte === 'ventas_rango' || tipo_reporte === 'ventas_diarias'" class="col-12">
      <label class="control-label">Condicion: <span style="color: red">*</span> </label>
      <select formControlName="condicion" class="form-control">
        <option *ngFor="let condicion of condiciones" value="{{ condicion.id }}">{{ condicion.label }}</option>
      </select>
    </div>

    <!-- ----- TIPO -----  -->
    <!-- <div *ngIf="tipo_reporte === 'recibos'" class="col-12 mt-3"> -->
    <div *ngIf="tipo_reporte === 'recibos' || tipo_reporte === 'ventas_productos' || tipo_reporte === 'cuentas_cobrar_ant_saldo'" class="col-12">
      <label class="control-label">Tipo: <span style="color: red">*</span> </label>
      <select formControlName="tipo" class="form-control" (change)="changeTipo()">
        <option *ngFor="let tipo of tipos" value="{{ tipo.id }}">{{ tipo.label }}</option>
      </select>
    </div>

    <div *ngIf="tipo_reporte === 'suplidor_prod'" class="col-12 mb-3">
      <label class="control-label">Seleccione articulo: <span style="color: red">*</span> </label>

      <ng-select
        formControlName="articulo_id"
        [items]="listaArticulos"
        bindLabel="nombre"
        bindValue="id"
        [clearable]="true"
        [appendTo]="'body'"
        (search)="getArticulos($event)"
        notFoundText="Articulo no encontrado"
        [disabled]="listaArticulos.length === 0"
      >
        <!-- <ng-template ng-option-tmp let-item="item" let-search="searchTerm">
          <div>
            <span>{{ item.Nombre }} </span>
          </div>
        </ng-template> -->
      </ng-select>
    </div>

    <div *ngIf="tipo_reporte === 'cuentas_con_pagos'" class="col-12">
      <label class="control-label">Seleccione cliente: <span style="color: red">*</span> </label>

      <ng-select
        formControlName="cliente_id"
        [items]="listaClientes"
        bindLabel="nombre_completo"
        bindValue="id"
        [clearable]="true"
        [appendTo]="'body'"
        (search)="getClientes($event)"
        notFoundText="Cliente no encontrado"
        [disabled]="listaClientes.length === 0"
      >
        <ng-template ng-option-tmp let-item="item" let-search="searchTerm">
          <div>
            <span class="d-block" style="font-size: 1.2rem"> <strong>Nombre: </strong> {{ item.nombre_completo }} </span>
            <span class="d-block" style="font-size: 0.93rem; color: #909090"> <strong>documento de identidad</strong> {{ item.documento_identidad }} </span>
          </div>
        </ng-template>
      </ng-select>
    </div>

    <!-- ----- FECHA -----  -->

    <div *ngIf="(tipo_reporte === 'ventas_productos' && form.controls.tipo.value === '1') || tipo_reporte === 'cuadre'" class="col-12 mt-3">
      <label class="control-label">Fecha: <span style="color: red">*</span> </label>
      <input type="text" [bsConfig]="dpConfig" placeholder="dd/mm/aaaa" class="form-control" formControlName="fecha" #dp="bsDatepicker" placement="bottom" bsDatepicker />
      <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['fecha'].valid && (form.controls['fecha'].dirty || form.controls['fecha'].touched)">
        Este campo es obligatorio
      </div>
    </div>
    <!-- ----- DESDE -----  -->

    <div
      *ngIf="
        tipo_reporte === 'ventas_rango' ||
        tipo_reporte === 'suplidor_prod' ||
        tipo_reporte === 'recibos' ||
        tipo_reporte === 'cuentas_con_pagos' ||
        (tipo_reporte === 'ventas_productos' && form.controls.tipo.value === '2')
      "
      class="col-6 mt-3"
    >
      <label class="control-label">Desde: <span style="color: red">*</span> </label>
      <input type="text" [bsConfig]="dpConfig" placeholder="dd/mm/aaaa" class="form-control" formControlName="desde" #dp="bsDatepicker" placement="bottom" bsDatepicker />
      <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['desde'].valid && (form.controls['desde'].dirty || form.controls['desde'].touched)">
        Este campo es obligatorio
      </div>
    </div>
    <!-- ----- HASTA -----  -->
    <div
      *ngIf="
        tipo_reporte === 'ventas_rango' ||
        tipo_reporte === 'suplidor_prod' ||
        tipo_reporte === 'recibos' ||
        tipo_reporte === 'cuentas_con_pagos' ||
        (tipo_reporte === 'ventas_productos' && form.controls.tipo.value === '2')
      "
      class="col-6 mt-3"
    >
      <label class="control-label">Hasta: <span style="color: red">*</span> </label>
      <input type="text" [bsConfig]="dpConfig" placeholder="dd/mm/aaaa" class="form-control" formControlName="hasta" #dp="bsDatepicker" placement="bottom" bsDatepicker />
      <div class="alerta text-danger ml-1" style="font-size: 12px" *ngIf="!form.controls['hasta'].valid && (form.controls['hasta'].dirty || form.controls['hasta'].touched)">
        Este campo es obligatorio
      </div>
    </div>
  </div>
</form>

<div *ngIf="switches">
  <br />
  <label *ngIf="switches && switches?.title && fun.hasValue(switches.title)" class="control-label">{{ switches.title }} </label>

  <div>
    <div class="form-group mb-2 switchDiv" *ngFor="let switch of switches.array">
      <input [(ngModel)]="switch.value" class="apple-switch ml-2" type="checkbox" />
      <span class="ml-2">{{ switch.label }}</span>
    </div>
  </div>
</div>

<div class="mt-4 d-flex justify-content-end">
  <button (click)="accion(false)" type="submit" class="btn btn-blanco mr-2">Cerrar</button>
  <button [disabled]="!form.valid" (click)="accion(true)" type="submit" class="btn btn-verde">Aceptar</button>
</div>
