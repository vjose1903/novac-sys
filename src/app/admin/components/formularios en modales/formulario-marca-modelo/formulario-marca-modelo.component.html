<!-- <div class="row" style="height: calc(100% - 60px);"> -->
<div style="height: 100%">
  <p-tabView [(activeIndex)]="tabIndex" styleClass="my_tabView panelsStyle anularPadding" style="height: 100% !important">
    <!-- <div class="col-12" style="max-height: 2rem">
      <h4>{{ tituloTabla }}</h4>
    </div> -->
    <p-tabPanel header="Marcas">
      <form [formGroup]="formMarca" style="height: 100%">
        <div class="row" style="min-height: 60%; max-height: 100%">
          <div class="col-6 contenedorRegistro" style="padding-left: 0 !important">
            <div class="card card-padding sombra">
              <div>
                <!-- *ngIf="tipo_formulario !== 'modelos'" -->
                <div class="form-group">
                  <label class="control-label">{{ campo1 }}: <span style="color: red">*</span></label>
                  <input
                    (keyup)="capitalice('descripcion', $event.target.value, formMarca)"
                    (focus)="$event.target.select()"
                    type="text"
                    id="descripcion"
                    formControlName="descripcion"
                    class="form-control mb-2"
                    autocomplete="off"
                  />
                  <div
                    class="alerta position-absolute text-danger ml-1"
                    style="font-size: 12px"
                    *ngIf="!formMarca.controls['descripcion'].valid && (formMarca.controls['descripcion'].dirty || formMarca.controls['descripcion'].touched)"
                  >
                    Este Campo es obligatorio
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 mt-3">
                  <ng-container *ngTemplateOutlet="accionButtons; context: { data: { form: formMarca } }"> </ng-container>
                </div>
              </div>
            </div>
          </div>

          <div class="col-6">
            <ng-container *ngTemplateOutlet="tablaMarcaModelo; context: { data: { form: formMarca, formName: 'formMarca' } }"> </ng-container>
          </div>
        </div>
      </form>
    </p-tabPanel>

    <!---------------------------------------------------------------------------------------------------------------------------------------------------->
    <!-- *ngIf="tipo_formulario === 'modelos'"
*ngIf="tipo_formulario === 'modelos'" -->
    <p-tabPanel header="Modelos">
      <form [formGroup]="formModelo" style="height: 100%">
        <div class="row" style="min-height: 60%; max-height: 100%">
          <div class="col-6 contenedorRegistro" style="padding-left: 0 !important">
            <div class="row card card-padding sombra">
              <div class="col-12">
                <div class="form-group">
                  <label class="control-label">Marca: <span style="color: red">*</span></label>
                  <ng-select id="marca_modal" formControlName="marca_id" [items]="listaMarcas" bindLabel="descripcion" bindValue="id" [clearable]="false">
                    <ng-template ng-option-tmp let-item="item" let-search="searchTerm">
                      <div>
                        <span>{{ item.descripcion }} </span>
                      </div>
                    </ng-template>
                  </ng-select>
                </div>
              </div>
              <div class="col-12">
                <div class="form-group">
                  <label class="control-label">Modelo: <span style="color: red">*</span></label>
                  <input
                    (keyup)="capitalice('descripcion', $event.target.value, formModelo)"
                    (focus)="$event.target.select()"
                    type="text"
                    id="descripcion"
                    formControlName="descripcion"
                    class="form-control mb-2"
                    autocomplete="off"
                  />
                  <div
                    class="alerta position-absolute text-danger ml-1"
                    style="font-size: 12px"
                    *ngIf="!formModelo.controls['descripcion'].valid && (formModelo.controls['descripcion'].dirty || formModelo.controls['descripcion'].touched)"
                  >
                    Este Campo es obligatorio
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-12 mt-3">
                  <ng-container *ngTemplateOutlet="accionButtons; context: { data: { form: formModelo } }"> </ng-container>
                </div>
              </div>
            </div>
          </div>
          <div class="col-6">
            <ng-container *ngTemplateOutlet="tablaMarcaModelo; context: { data: { form: formModelo, formName: 'formModelo' } }"> </ng-container>
          </div>
        </div>
      </form>
    </p-tabPanel>
    <!---------------------------------------------------------------------------------------------------------------------------------------------------->
  </p-tabView>
</div>

<ng-template #accionButtons let-data="data">
  <div class="form-group">
    <a class="btn mr-2" id="btn-gris" (click)="closeThis()">Salir</a>
    <a *ngIf="editando" class="btn mr-2" id="btn-blanco" (click)="borrar()">Cancelar</a>
    <input [disabled]="!data.form.valid" (click)="submit(data.form)" type="submit" class="btn" value="{{ boton }}" id="btn-verde" />
  </div>
</ng-template>

<ng-template #tablaMarcaModelo let-data="data">
  <div #cardTabla id="cardTabla" class="divMarcaModelo">
    <app-tablas
      class="h-100"
      *ngIf="listado && info"
      [padre]="cardTabla"
      [info]="info"
      [data]="listado"
      [focusRow]="false"
      [botones]="botones"
      (DevolverInfo)="editarItem($event, data.form)"
      (DELETE)="abrirModal($event)"
      [id_tabla]="'tabla_frm_' + data.formName"
      (paginateChange)="pedirNuevaData($event)"
    ></app-tablas>
  </div>
</ng-template>

<div *ngIf="showModal" class="overlay">
  <p-dialog
    *ngIf="tipoModal === 'borrar' && seleccionModal"
    header="Confirmar"
    [(visible)]="showModal"
    [responsive]="true"
    [style]="{ width: '350px', minWidth: '200px' }"
    (onHide)="reinicioModal()"
    [blockScroll]="true"
  >
    <p *ngIf="tipo_formulario !== 'modelos'">Desea remover {{ seleccionModal.descripcion }} de la lista</p>
    <p *ngIf="tipo_formulario == 'modelos'">Desea remover {{ seleccionModal.marca.descripcion }} {{ seleccionModal.descripcion }} de la lista</p>
    <p-footer>
      <button (click)="reinicioModal()" type="submit" class="btn btn-blanco mr-2">NO</button>
      <button (click)="decisionBorrar(true)" type="submit" class="btn" id="btn-verde">SI</button>
    </p-footer>
  </p-dialog>
</div>
