<div style="height: 100%">
  <p-tabView [(activeIndex)]="tabIndex" styleClass="my_tabView panelsStyle p-0" (onChange)="clickTabView()">
    <p-tabPanel header="Marcas">
      <form [formGroup]="formMarca" class="h-100" (keydown.enter)="$event.preventDefault()">
        <div class="row h-100">
          <div *ngIf="hasPermissionsMarcaCreate" class="col-6 contenedorRegistro" style="padding-left: 0 !important">
            <div class="card card-padding sombra-light">
              <div>
                <div class="form-group">
                  <label class="control-label">{{ campo1 }}: <span style="color: red">*</span></label>
                  <input [appCapitalice]="'formGroup'" (focus)="$event.target.select()" type="text" id="descripcion" formControlName="descripcion" class="form-control mb-2" autocomplete="off" />
                  <div class="alerta position-absolute text-danger ml-1" style="font-size: 12px" *ngIf="!formMarca.controls['descripcion'].valid && (formMarca.controls['descripcion'].dirty || formMarca.controls['descripcion'].touched)">
                    Este Campo es obligatorio
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 mt-3">
                  <div class="form-group">
                    <a class="btn mr-2" id="btn-gris" (click)="closeModal()">Salir</a>
                    <a *ngIf="marcaSelected" class="btn mr-2" id="btn-blanco" (click)="borrar()">Cancelar</a>
                    <input [disabled]="!formMarca.valid" (click)="submit(formMarca)" type="submit" class="btn" value="{{ marcaSelected ? 'Editar' : 'Guardar' }}" id="btn-verde" />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="{{ hasPermissionsMarcaCreate ? 'col-6' : 'col-12' }} p-0">
            <div #cardMarca class="h-100">
              <dinamic-table [cardTabla]="cardMarca" [(data)]="listadoMarcas" [seleccionado]="marcaSelected?.id" [(TablasComponent)]="tablaMarcaComponent" [config]="table_marca_config" (table_events)="handle_table_events($event)"></dinamic-table>
            </div>
          </div>
        </div>
      </form>
    </p-tabPanel>

    <!---------------------------------------------------------------------------------------------------------------------------------------------------->

    <p-tabPanel header="Modelos">
      <form [formGroup]="formModelo" class="h-100" (keydown.enter)="$event.preventDefault()">
        <div class="row h-100">
          <div *ngIf="hasPermissionsModeloCreate" class="col-6 contenedorRegistro" style="padding-left: 0 !important">
            <div class="row card card-padding sombra-light">
              <div class="col-12">
                <div class="form-group">
                  <label class="control-label">Marca: <span style="color: red">*</span></label>
                  <ng-select id="marca_modal" formControlName="marca_id" [items]="listaMarcas" bindLabel="descripcion" bindValue="id" [clearable]="false">
                    <ng-template ng-option-tmp let-item="item" let-search="searchTerm">
                      <div>
                        <span>{{ item.descripcion }} </span>
                      </div>
                    </ng-template>
                  </ng-select>
                </div>
              </div>
              <div class="col-12">
                <div class="form-group">
                  <label class="control-label">Modelo: <span style="color: red">*</span></label>
                  <input [appCapitalice]="'formGroup'" (focus)="$event.target.select()" type="text" id="descripcion" formControlName="descripcion" class="form-control mb-2" autocomplete="off" />
                  <div class="alerta position-absolute text-danger ml-1" style="font-size: 12px" *ngIf="!formModelo.controls['descripcion'].valid && (formModelo.controls['descripcion'].dirty || formModelo.controls['descripcion'].touched)">
                    Este Campo es obligatorio
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-12 mt-3">
                  <div class="form-group">
                    <a class="btn mr-2" id="btn-gris" (click)="closeModal()">Salir</a>
                    <a *ngIf="modeloSelected" class="btn mr-2" id="btn-blanco" (click)="borrar()">Cancelar</a>
                    <input [disabled]="!formModelo.valid" (click)="submit(formModelo)" type="submit" class="btn" value="{{ modeloSelected ? 'Editar' : 'Guardar' }}" id="btn-verde" />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="{{ hasPermissionsModeloCreate ? 'col-6' : 'col-12' }} p-0">
            <div #cardModelo class="h-100">
              <dinamic-table
                [cardTabla]="cardModelo"
                [(data)]="listadoModelos"
                [seleccionado]="modeloSelected?.id"
                [(TablasComponent)]="tablaModeloComponent"
                [config]="table_modelo_config"
                (table_events)="handle_table_events($event)"
              ></dinamic-table>
            </div>
          </div>
        </div>
      </form>
    </p-tabPanel>
    <!---------------------------------------------------------------------------------------------------------------------------------------------------->
  </p-tabView>
</div>
