<div class="image-container" [ngClass]="{ noContainer: src_img }">
  <img style="max-width: 98%; max-height: 98%" id="blah" [src]="src_img" [ngClass]="{ 'd-none': !src_img }" alt="your image" />
</div>

<div class="d-flex" [ngClass]="{ 'justify-content-around': src_img, 'justify-content-center': !src_img }" style="min-width: 13rem">
  <input tabindex="-1" type="file" lang="es" id="imgInput-{{ id }}" (change)="onFileChange($event)" accept=".jpg, .png, .jpeg, .svg" />
  <label for="imgInput-{{ id }}" class="btn-file">
    <span>Buscar imagen</span>
  </label>
  <button tabindex="-1" *ngIf="src_img" pTooltip="Remover imagen" tooltipPosition="top" (click)="borrar()" class="btn px-1 my-auto py-0 ml-2" id="btn-gris"><i class="fas fa-eraser"></i></button>
</div>
