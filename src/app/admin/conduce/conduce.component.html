<div class="row">
  <div class="col-5">
    <div class="row">
      <div class="col-12 mb-3">
        <h2 class="negrita">Conduce</h2>
      </div>
      <div class="col-12">
        <div class="card card-padding sombra">
          <div class="form-group">
            <label class="control-label">Cliente: </label>
            <!-- (change)="selectTipoArticulo($event.target.value)" -->
            <input
              type="text"
              id="clienteI"
              (keydown.enter)="abrirModalFiltro($event.target.value)"
              (focus)="$event.target.select()"
              placeholder="Nombre Cliente"
              class="form-control mb-4 inputE"
              autocomplete="off"
              [disabled]="cliente"
              value=""
              tabindex="-1"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-7">
    <div *ngIf="facturas_adelantadas.length > 0" class="row">
      <div class="col-12 mb-3">
        <h3>Ventas adelantadas</h3>
      </div>
      <div class="col-12">
        <div #cardTabla id="cardTabla" class="card sombra bordeRedondeado factAdelantadas">
          <app-tablas
            *ngIf="facturas_adelantadas && info"
            [padre]="cardTabla"
            [info]="info"
            [ROW]="'row_adelantada'"
            [search]="false"
            [paginate]="false"
            [data]="facturas_adelantadas"
            [focusRow]="false"
            (clickRow)="SeleccionarFactruaAdelantada($event)"
            tabindex="-1"
          ></app-tablas>
        </div>
      </div>
    </div>
  </div>
  <!-- ================================================================================================================================================ -->
  <!-- ================================================================================================================================================ -->
  <div *ngIf="cliente" class="col-12 mt-3">
    <div class="card sombra bordeRedondeado" style="height: 37rem">
      <table #tituloFactTable="mdbTable" mdbTable class="table m-auto" small="true">
        <thead>
          <tr class="text-center">
            <th class="tiCOD">Codigo</th>
            <th class="tiCAN">Cantidad</th>
            <th class="tiUNI"><span class="ml-3">Unidad</span></th>
            <th class="tiDES">Descripcion</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="COD td0padding"></td>

            <td class="CAN td0padding"></td>

            <td class="UNI td0padding"></td>

            <td class="DES td0padding"></td>
          </tr>
        </tbody>
      </table>

      <div class="cuadro scrollContainer" #cuadro>
        <!-- <div class="cuadro" #cuadro [ngClass]="{ sinFlow: secuencia <= 12, conFlow: secuencia >= 13 }"> -->
        <form *ngIf="ARRAY_ROWARTICULOS" [formGroup]="form" action="">
          <div formArrayName="rowFactura" *ngFor="let item of ARRAY_ROWARTICULOS.controls; let i = index">
            <div [formGroupName]="i">
              <table #cuerpoFactTable="mdbTable" mdbTable class="table m-auto" small="true">
                <tbody>
                  <tr>
                    <!--  ::::::::::::  CONFIG  ::::::::::::  -->
                    <td class="sombreado2">
                      <div class="btn-group" dropdown #dropConfigRow>
                        <a *ngIf="checkIfArticuloRow(i)" dropdownToggle style="padding: 3px" (click)="(false)">
                          <i class="fas fa-ellipsis-v btnConfig"></i>
                        </a>

                        <a *ngIf="!checkIfArticuloRow(i)" style="padding: 3px">
                          <i class="fas fa-ellipsis-v btnConfigDis"></i>
                        </a>
                        <ul class="dropdown-menu" role="menu" id="dropConfigRow">
                          <!-- <li role="menuitem">
                            <div class="from-group my-1 ml-2">
                              <input formControlName="calcular_saco" class="apple-switch ml-2" type="checkbox" (click)="CalculoSacos(i, $event)" />
                              <span class="ml-2 subirLabelCheck">Calcular saco</span>
                            </div>
                          </li> -->

                          <li role="menuitem">
                            <a class="dropdown-item" id="dropdown-item" (click)="modalRemover(i, $event)">
                              <i class="far fa-trash-alt text-red btnBorrar"></i>
                              Quitar Producto
                            </a>
                          </li>
                        </ul>
                      </div>
                    </td>
                    <!-- <td class="{{ checkIfArticuloRow(i) ? 'btnQuitarRow' : 'sombreado' }}" (mouseover)="selectedRow(i, true)" (mouseleave)="selectedRow(i, false)">
                      <i class="far fa-trash-alt text-red btnBorrar" (click)="modalRemover(i)"></i>
                    </td> -->
                    <!--  ::::::::::::  CODIGO  ::::::::::::  -->
                    <td class="COD td0padding">
                      <div class="from-group">
                        <input
                          type="text"
                          class="form-control entrada"
                          id="cod-{{ i }}"
                          (click)="verificarSecuencia(i)"
                          (keydown.enter)="saltar('can-', i)"
                          formControlName="cod"
                          (blur)="verificarRow(i)"
                          (blur)="calculateCantidadEnUnidades(i)"
                          tabindex="-1"
                          [readOnly]="disableCamposFactAdelantadas(i)"
                        />
                      </div>
                    </td>
                    <!--  ::::::::::::  CANTIDAD  ::::::::::::  -->
                    <td class="CAN td0padding">
                      <div class="from-group">
                        <input
                          type="number"
                          min="0"
                          class="form-control entrada {{ verSiExcede(i) ? 'badAlert' : '' }}"
                          id="can-{{ i }}"
                          (click)="verificarSecuencia(i, true)"
                          (keydown.enter)="saltar('uni-', i)"
                          formControlName="can"
                          [max]="getMaxCan(i)"
                          (blur)="verificarRow(i)"
                          (blur)="calculateCantidadEnUnidades(i)"
                          (blur)="excedeMaxCan(i)"
                          tabindex="-1"
                        />
                      </div>
                    </td>

                    <!--  ::::::::::::  UNIDAD  ::::::::::::  -->
                    <td class="UNI td0padding">
                      <div class="from-group">
                        <input
                          *ngIf="(drop && inputDrop !== secuenciaDelDrop(i)) || (!drop && inputDrop === secuenciaDelDrop(i)) || !drop"
                          type="text"
                          class="form-control entrada"
                          id="uni-{{ i }}"
                          (click)="verificarSecuencia(i, true)"
                          (keydown.enter)="saltar('cod-', i)"
                          formControlName="uni"
                          (blur)="verificarRow(i)"
                          (blur)="calculateCantidadEnUnidades(i)"
                          tabindex="-1"
                        />

                        <div *ngIf="drop && inputDrop === secuenciaDelDrop(i)">
                          <select
                            value="Medida"
                            formControlName="uni"
                            (change)="selectMedidaChange($event.target.value, i)"
                            class="form-control entrada"
                            id="uni-{{ i }}"
                            (keydown.enter)="saltar('cod-', i)"
                            (blur)="verificarRow(i)"
                            (blur)="calculateCantidadEnUnidades(i)"
                            tabindex="-1"
                          >
                            <option *ngFor="let item of UnidadesArticulo" value="{{ item.value }}">{{ item.value }}</option>
                          </select>
                        </div>
                      </div>
                    </td>

                    <!--  ::::::::::::  DESCRIPCION  ::::::::::::  -->
                    <td class="DES td0padding">
                      <div class="from-group">
                        <input type="text" class="form-control entrada inDES" id="des-{{ i }}" formControlName="des" readonly="true" tabindex="-1" />
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </form>
      </div>

      <div class="row mt-4">
        <div class="col-2 ml-4">
          <app-btncircular [alto]="'100px'" [accion]="'Imprimir Conduce'" [nombreImg]="'printer'" (click)="imprimirConduce()"></app-btncircular>
        </div>
        <div class="col-2">
          <app-btncircular [alto]="'100px'" [accion]="'Cancelar Conduce'" [nombreImg]="'cancelar'" (click)="cancelarConduce(1)"></app-btncircular>
        </div>
      </div>
    </div>
  </div>
</div>
