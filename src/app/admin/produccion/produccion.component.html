<div class="row ProductionRow">
  <div class="col-12 p-0 arriba">
    <div class="row">
      <div class="col-4">
        <div #cardFormulario class="card card-padding-1 sombra h-100">
          <h5>Seleccione el producto a elaborar:</h5>
          <div class="row">
            <div class="col-12 p-0">
              <div class="form-group">
                <label class="control-label mt-1 mb-0">Nombre producto: <span style="color: red">*</span></label>
                <div>
                  <p-dropdown
                    [placeholder]="'Seleccione producto'"
                    [options]="listaProductos"
                    [(ngModel)]="producto_terminado_en_turno"
                    optionLabel="nombre"
                    [filter]="true"
                    optionDisabled="optionDisabled"
                    filterBy="nombre"
                    (onHide)="saltar('cantidad_producir')"
                    (keydown.enter)="saltar('cantidad_producir')"
                    (onChange)="getIngredients()"
                    styleClass="form-control min"
                    [virtualScroll]="true"
                    [itemSize]="30"
                    id="articulo_id"
                  ></p-dropdown>
                </div>
              </div>
            </div>

            <div class="col-12 p-0 mt-2">
              <div class="form-group">
                <label class="control-label mb-0">Cantidad a producir: <span style="color: red">*</span></label>
                <div class="row">
                  <div class="col-4 p-0">
                    <input
                      type="Number"
                      (keydown.enter)="saltar('medida_producir')"
                      id="cantidad_producir"
                      [(ngModel)]="cantidad_producir"
                      (focus)="$event.target.select()"
                      placeholder="Cantidad a producir"
                      class="form-control inputE input_cantidad"
                      autocomplete="off"
                      (blur)="calcularCantidadAProduccir()"
                    />
                  </div>

                  <div class="col-8 pr-0">
                    <select (keydown.enter)="saltar('agregar')" class="form-control inputE" [(ngModel)]="medida_producir" id="medida_producir" (change)="calcularCantidadAProduccir()">
                      <option value="{{ null }}" disabled></option>
                      <option *ngFor="let item of optionsMedidas" value="{{ item }}">{{ item }}</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 p-0 mt-2">
              <a class="btn mr-2 btn-blanco" (click)="borrarForm()">{{ articuloEditando ? 'Cancelar' : 'Borrar' }}</a>
              <input [disabled]="formIsInvalid()" (click)="agregarAlista()" type="submit" class="btn btn-verde" value="{{ articuloEditando ? 'Actualizar' : 'Agregar' }}" />
            </div>
          </div>
        </div>
      </div>
      <div class="col-8 pl-0">
        <div class="card card-padding-1 sombra cardIngredientes" [ngStyle]="{ 'max-height': cardFormulario.offsetHeight + 'px' }">
          <h4 class="titulo">Ingredientes</h4>

          <div class="row h-100 cuerpo">
            <div class="col-6 p-0 fondoGris bordes">
              <div class="text-center tituloIngre">Inventario</div>

              <div id="inventario_scroll" class="scroll-container-prod" appOnScroll (scrolling)="ingredientesScroll($event)">
                <div *ngFor="let ingrediente of ingredientes; let i = index" class="ingredientesList d-flex">
                  <div class="Nombreingre">{{ ingrediente.nombre + ': ' }}</div>

                  <div pTooltip="{{ existenciaConTooltip(ingrediente) ? lookOters(ingrediente.existencia) : '' }} " [tooltipPosition]="i != 0 ? 'top' : 'bottom'" style="width: 100%">
                    {{ lookprincipal(ingrediente) }}
                  </div>
                </div>
              </div>
            </div>
            <div class="col-6 p-0 bordes fondoBlanco">
              <div class="text-center tituloIngre">Producción</div>
              <div id="produccion_scroll" *ngIf="ingredientesParaProduccion.length > 0" class="scroll-container-prod" appOnScroll (scrolling)="ingredientesScroll($event)">
                <div *ngFor="let ingrediente of ingredientesParaProduccion; let index_ingrediente = index" class="ingredientesList d-flex">
                  <div class="Nombreingre">{{ ingrediente.nombre + ': ' }}</div>

                  <div pTooltip="{{ existenciaConTooltip(ingrediente) ? lookOters(ingrediente.existencia) : '' }} " [tooltipPosition]="index_ingrediente != 0 ? 'top' : 'bottom'" style="width: 100%">
                    {{ lookprincipal(ingrediente) }}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12 medio">
    <div id="cardTabla" class="card card-padding-1 sombra h-100">
      <div #cardTablaProd class="divProducciones">
        <div class="divTabla">
          <dinamic-table [cardTabla]="cardTablaProd" [seleccionado]="articuloEditando?.id" [(data)]="lista_produccion" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 abajo">
    <div class="d-flex justify-content-end w-100">
      <input [disabled]="abilitarBtnConfirmar()" (click)="abrirModalDinamicText('cancelarP', 'Seguro de que desea cancelar la produccion.', null)" type="submit" class="btn btn-blanco mr-2" value="Cancelar" />
      <input [disabled]="abilitarBtnConfirmar()" (click)="abrirModalDinamicText('confirmar', 'Seguro de que desea confirmar la produccion.', null)" type="submit" class="btn" value="Confirmar" id="btn-verde" />
    </div>
  </div>
</div>
