@if (isFeatureEnabled()) {
<div *ngxPermissionsOnly="menuItem.permission" class="menuList" [class.active]="isActive" [class.submenu-open]="isSubMenuActive" [id]="menuItemId">
  <button type="button" class="menuButton" (click)="onMenuClick($event)" [attr.aria-label]="menuItem.title">
    <span class="iconFrame">
      <img class="iconosMenu" [class.iconosMenuA]="isActive" [src]="menuItem.icon" [alt]="menuItem.title" />
    </span>
    <span class="tituloMenu" [ngClass]="getTitleClasses()" [innerText]="menuItem.title"></span>
  </button>

  <!-- Submenu para elementos dropdown -->
  @if (menuItem.type === 'dropdown' && menuItem.subItems) {
    <div class="subMenuFactura" [ngClass]="{ subMenuFacturaA: isSubMenuActive }">
      @for (subItem of menuItem.subItems; track subItem) {
        <h4 *ngxPermissionsOnly="subItem.permission" class="opcion" [ngClass]="getSubItemClasses(subItem)" (click)="onSubMenuClick($event, subItem)">
          {{ subItem.title }}
        </h4>
      }
    </div>
  }
</div>
}
