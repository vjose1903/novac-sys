<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <mat-toolbar>
      <h5 class="titulo" (click)="navegar(1)" >Menu</h5> 
      <!-- <img src="../../assets/img/logoADM.png" class="img-fluid" /> -->
    </mat-toolbar>
    <mat-nav-list class="text-center">
      <div class="menuList menuList1">
        <img [ngClass]="actualTab == 'factura' ? 'iconosMenuA' : 'iconosMenu'" src="../../../assets/img/factura.png" alt="" (click)="navegar(2)" />
        <h5 [ngClass]="actualTab == 'factura' ? 'tituloMenu1A' : 'tituloMenu1'"><strong>Facturacion</strong></h5>
      </div>

      <div class="menuList menuList2">
        <img [ngClass]="actualTab == 'registro' ? 'iconosMenuA' : 'iconosMenu'" src="../../../assets/img/registro.png" alt="" (click)="navegar(3)" />
        <h5 [ngClass]="actualTab == 'registro' ? 'tituloMenu2A' : 'tituloMenu2'"><strong>Registros</strong></h5>

        <div [ngClass]="actualTab == 'registro' ? 'subMenuRegistrosA' : 'subMenuRegistros'">
          <h4 class="Registro" (click)="navegar('clientes')">Clientes</h4>
          <h4 class="Registro" (click)="navegar('empleados')">Empleados</h4>
          <h4 class="Registro" (click)="navegar('articulos')">Articulos</h4>
        </div>
      </div>

      <div class="menuList menuList3">
        <img [ngClass]="actualTab == 'inventario' ? 'iconosMenuA' : 'iconosMenu'" src="../../../assets/img/inventario.png" alt="" (click)="navegar(4)" />
        <h5 [ngClass]="actualTab == 'inventario' ? 'tituloMenu3A' : 'tituloMenu3'"><strong>Inventario</strong></h5>
      </div>

      <div class="menuList menuList4">
        <img [ngClass]="actualTab == 'reporte' ? 'iconosMenuA' : 'iconosMenu'" src="../../../assets/img/reporte.png" alt="" (click)="navegar(5)" />
        <h5 [ngClass]="actualTab == 'reporte' ? 'tituloMenu4A' : 'tituloMenu4'"><strong>Reporte</strong></h5>
      </div>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="d-flex justify-content-between">
      <div class="">
        <div id="botonMenu" *ngIf="drawer._animationState == 'void'" title="Mostrar Menu" data-toggle="Tooltip" (click)="drawer.toggle()"><i class="fas fa-bars"></i></div>
      </div>

      <!-- ============================================================================================ -->
      <!--DROP DOWN DE LA CUENTA -->
      <!-- ============================================================================================ -->

      <div class="right">
        <div class="btn-group" dropdown>
          <a id="button-basic" dropdownToggle class="dropdown-toggle" aria-controls="dropdown-basic">
            <img class="rounded-circle" src="../../../assets/img/userH.png" alt="Admin" />
            Cuenta <span class="caret"></span>
          </a>
          <ul id="dropdown-basic" *dropdownMenu class="dropdown-menu" role="menu" aria-labelledby="button-basic">
            <div class="dropdown-header">
              <h2>{{ usuariosServices.profile.nombre }}</h2>
              <p>{{ usuariosServices.profile.email }}</p>
            </div>
            <!-- <li role="menuitem"><a class="dropdown-item" href="#">Nombre admin</a> admin@gmail.com </li> -->
            <li class="divider dropdown-divider"></li>
            <li role="menuitem" [routerLink]="['/admin/cuenta']">
              <a class="dropdown-item" id="dropdown-item"><i class="fas fa-address-card"></i>Perfil</a>
            </li>
            <li role="menuitem" [routerLink]="['/admin/']">
              <a class="dropdown-item" id="dropdown-item"><i class="fas fa-chart-bar"></i>Cuenta</a>
            </li>
            <li class="divider dropdown-divider"></li>
            <li role="menuitem">
              <a class="dropdown-item" id="dropdown-item" (click)="logOut()"><i class="fas fa-power-off"></i>Cerrar sesión</a>
            </li>
          </ul>
        </div>
      </div>
      <!--       
      PARA PONER LOS LI EN FOR
      <li *ngFor="let choice of items">
          <a class="dropdown-item" href="#">{{choice}}</a>
        </li> -->
    </mat-toolbar>

    <div class="" style="padding: 30px 80px 30px 80px; height: calc(100% - 80px);">
      <router-outlet></router-outlet>
      <!-- rutas -->
    </div>
    <div class="footerCustom">@2019 Desarrollador: Victor J. Vasquez</div>
  </mat-sidenav-content>
</mat-sidenav-container>
<!-- <div class="footer"></div> -->
