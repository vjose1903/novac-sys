<div class="calendar-shell">
  <div class="calendar-toolbar">
    <div class="calendar-nav">
      <button type="button" class="icon-btn" (click)="goPrev()" aria-label="Anterior">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button type="button" class="icon-btn" (click)="goNext()" aria-label="Siguiente">
        <i class="fas fa-chevron-right"></i>
      </button>
      <button type="button" class="today-btn" (click)="goToday()">Hoy</button>
    </div>

    <h5>{{ currentTitle }}</h5>

    <div class="view-switch">
      <button type="button" [class.active]="currentView === 'dayGridMonth'" (click)="changeView('dayGridMonth')">Mes</button>
      <button type="button" [class.active]="currentView === 'timeGridWeek'" (click)="changeView('timeGridWeek')">Semana</button>
      <button type="button" [class.active]="currentView === 'timeGridDay'" (click)="changeView('timeGridDay')">Dia</button>
      <button type="button" [class.active]="currentView === 'listMonth'" (click)="changeView('listMonth')">Lista</button>
    </div>
  </div>

  <div class="calendar-host">
    <full-calendar #calendar [options]="calendarOptions"></full-calendar>
  </div>
</div>
