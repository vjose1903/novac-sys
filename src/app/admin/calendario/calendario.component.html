<section class="calendar-page">
  <div class="calendar-main">
    <div class="calendar-titlebar">
      <h4>Calendario</h4>
      <button class="calendar-primary-btn" type="button" (click)="openNewEvent()">
        <i class="fas fa-plus"></i>
        <span>Agregar evento</span>
      </button>
    </div>

    <div class="calendar-layout">
      <app-calendar-shell class="calendar-board" (eventSelected)="openEvent($event)" (dateSelected)="openNewEvent($event)"></app-calendar-shell>

      <aside class="calendar-sidebar">
        <app-event-type-legend [eventTypes]="eventTypes"></app-event-type-legend>
      </aside>
    </div>
  </div>

</section>
