<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <h4 class="negrita mb-0">Configuraciones de entidades cuentas contables</h4>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" *ngIf="isCreando || configuracionSelected" class="form {{ isCreando || configuracionSelected ? 'showForm' : 'hideForm' }} ">
          <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
            <h4 class="mb-0">Formulario</h4>
          </div>

          <div class="card cardFormClass">
            <form [formGroup]="form" (keydown.enter)="$event.stopPropagation()">
              <div class="row">
                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="'descripcion'" [form]="form">
                    <label class="control-label">Descripcion: <span style="color: red">*</span></label>
                    <input type="text" formControlName="descripcion" [appCapitalice]="'formGroup'" id="campoDescripcion" class="form-control" autocomplete="off" />
                  </div>
                </div>
                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="'cuenta_contable_id'" [form]="form">
                    <label class="control-label">Cuenta Contable: <span style="color: red">*</span></label>

                    <p-dropdown
                      #dropdownCuenta
                      placeholder="Seleccione la cuenta"
                      filterPlaceholder="Buscar"
                      appendTo="body"
                      formControlName="cuenta_contable_id"
                      [options]="listaCuentasControl"
                      [itemSize]="34"
                      [filter]="true"
                      optionLabel="label"
                      optionValue="id"
                      [resetFilterOnHide]="true"
                      [autofocusFilter]="false"
                      styleClass="form-control"
                      emptyMessage="No existen cuantas contables"
                      [showClear]="true"
                      (onFocus)="dropCuentaControlFocus(dropdownCuenta)"
                    >
                      <ng-template let-cuenta_auxiliar pTemplate="item">
                        <div class="cuenta_auxiliar-item">
                          <span class="d-block" style="font-size: 1rem"> <strong>Descripción: </strong> {{ cuenta_auxiliar.descripcion }} </span>
                          <span class="d-block" style="font-size: 0.8rem; color: #787878"> <strong>No. Cuenta: </strong> {{ cuenta_auxiliar.codigo }} </span>
                        </div>
                      </ng-template>
                    </p-dropdown>

                    <span id="msgContainer"></span>
                  </div>
                </div>
              </div>
            </form>
            <div class="col-12 form-group p-0" style="display: flex; justify-content: space-between">
              <div>
                <a *ngIf="checkIfSomethingIsDiferrent()" class="btn mr-2" id="btn-blanco" (click)="reset()">Restablecer</a>

                <input type="button" [disabled]="formIsInvalid()" style="max-width: 6rem" (click)="requests()" class="btn ml-2" value="{{ botonLabel }}" id="btn-verde" />
              </div>
              <div>
                <input class="btn ml-2" value="Cerrar" id="btn-blanco" (click)="borrar(); isCreando = false" style="max-width: 6rem" />
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <div class="list {{ isCreando || configuracionSelected ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 class="mb-0">Listado de configuraciones</h4>
          <button ngIf="false" *ngxPermissionsOnly="permissions.user.create" [disabled]="configuracionSelected || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
        </div>
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="listaConfiguraciones" [seleccionado]="configuracionSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
