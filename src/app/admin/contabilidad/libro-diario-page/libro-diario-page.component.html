<div class="libro-diario-grid">
  <div class="libro-diario-title">
    <div class="d-flex justify-content-between align-items-center w-100">
      <div class="d-flex align-items-center">
        <h4 class="negrita mb-0">Libro Diario</h4>
      </div>
      <div>
        <button *ngxPermissionsOnly="permissions.create" (click)="abrirModalForm()" class="btn btn-tema">Nueva entrada</button>
      </div>
    </div>
  </div>

  <div class="libro-diario-body">
    <div class="inner-body">
      <div class="fantasma">
        <div class="cardListados p-2">
          <div class="diurnal-list">
            <div class="toolbar-section">
              <div class="search-div d-flex align-items-end">
                <div id="searchDiv-diurnal" style="max-width: 17rem">
                  <small> Busqueda </small>
                  <input id="search-diurnal" class="search-input form-control min m-0" (keyup)="filter()" [(ngModel)]="filterValue" />
                </div>

                <div class="calendars-filter">
                  <div>
                    <small> Desde </small>
                    <p-calendar inputId="desdeCalendar" inputStyleClass="form-control min" [(ngModel)]="desde" appendTo="body" dateFormat="dd/mm/yy" placeholder="dd/mm/aaaa"></p-calendar>
                  </div>
                  <div>
                    <small> Hasta </small>
                    <p-calendar inputId="hastaCalendar" inputStyleClass="form-control min" [(ngModel)]="hasta" appendTo="body" dateFormat="dd/mm/yy" placeholder="dd/mm/aaaa"></p-calendar>
                  </div>
                </div>
                <div class="validation-filter">
                  <small> Estado </small>
                  <p-dropdown
                    id="campoValidationFilter"
                    [placeholder]="'Seleccione el origen de la cuenta'"
                    [options]="validationFilterList"
                    [(ngModel)]="validationFilterValue"
                    optionLabel="label"
                    optionValue="value"
                    appendTo="body"
                    styleClass="form-control min"
                  >
                    <ng-template let-state pTemplate="item">
                      <div class="state-item">
                        <span class="d-block" style="min-width: 2rem"> {{ state.label }} </span>
                      </div>
                    </ng-template></p-dropdown
                  >
                </div>

                <div class="search-btn mb-1">
                  <btn-icon-circular
                    [id]="'diurnal-search-btn'"
                    [icon_size]="'1rem'"
                    [icon]="'fas fa-search'"
                    [size]="'size-md'"
                    pTooltip="Buscar"
                    tooltipPosition="right"
                    (clickFunction)="filter(searchDiurnalCode)"
                  >
                  </btn-icon-circular>
                </div>
              </div>

              <div class="actions-div">
                <btn-icon-circular
                  [id]="'expandColapseBtn'"
                  [icon]="isSomeTabVisible() ? 'fa-solid  fa-down-left-and-up-right-to-center' : 'fa-solid  fa-up-right-and-down-left-from-center'"
                  [icon_size]="'1rem'"
                  [size]="'size-md'"
                  [tooltip]="isSomeTabVisible() ? 'Cerrar todas' : 'Abrir todas'"
                  [tooltipPosition]="'left'"
                  (clickFunction)="changeTabsVisibility({ visible: !isSomeTabVisible() })"
                >
                </btn-icon-circular>
              </div>
            </div>
            <div class="body-section">
              <p-accordion styleClass="no-content-padding grey-header header-p-1" [multiple]="true" [activeIndex]="tabsVisibles">
                <p-accordionTab *ngFor="let asiento of asientosContablesList">
                  <ng-template pTemplate="header">
                    <div class="d-flex justify-content-between align-items-center w-100">
                      <span class="m-0 p-0">{{ asiento.title }} </span>

                      <div class="entry-actions-div">
                        <div *ngIf="!asiento.is_validated" class="in-validation-div">
                          <div class="in-validation-label">
                            <span class="validate-label"> En estado de validación</span>
                          </div>
                          <i class="fa-solid fa-triangle-exclamation validate-icon"></i>
                        </div>
                        <div class="edit-btn">
                          <btn-icon-circular
                            [id]="'edit-entry-btn'"
                            [icon_size]="'1rem'"
                            [icon]="'fas fa-pencil-alt'"
                            [size]="'size-md'"
                            pTooltip="Editar"
                            tooltipPosition="left"
                            (clickFunction)="editEntry(asiento, $event)"
                          >
                          </btn-icon-circular>
                        </div>
                      </div>
                    </div>
                  </ng-template>
                  <ng-template pTemplate="content">
                    <div class="diurnal-table-container" [ngStyle]="calculateHeigthTableContainer(asiento)">
                      <div #cardTabla id="cardTabla" class="diurnal-table-inner">
                        <dinamic-table
                          [cardTabla]="cardTabla"
                          [(data)]="asiento.detalles_asientos_contables_front"
                          [config]="table_config_diurnal"
                          (table_events)="handle_table_events($event)"
                        ></dinamic-table>
                      </div>
                    </div>
                  </ng-template>
                </p-accordionTab>
              </p-accordion>
            </div>
            <div class="footer-section">
              <div id="divPaginator" class="w-100 d-flex justify-content-end align-items-center">
                <!-- <button class="btn mr-2" value="" id="btn-blanco" (click)="test()">test</button> -->

                <p-paginator
                  id="paginator"
                  [first]="paginator.page_front"
                  [rows]="paginator.per_page"
                  [pageLinkSize]="paginator.cantPagesView"
                  [totalRecords]="paginator.total_count"
                  [rowsPerPageOptions]="paginator.per_page_options"
                  styleClass="paginator-dinamic-table"
                  dropdownAppendTo="body"
                  (onPageChange)="paginatorChange($event)"
                ></p-paginator>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
