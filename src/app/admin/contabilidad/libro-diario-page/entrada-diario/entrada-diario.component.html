<div>
  <form [formGroup]="formGroup">
    <div class="row">
      <div class="col-12 col-md-4 p-0">
        <div class="form-group" [appMsgError]="'fecha_equivalente'" [form]="formGroup">
          <label class="control-label">Fecha de registro: <span style="color: red">*</span></label>
          <p-calendar
            inputId="fecha_equivalente_input"
            [maxDate]="maxDate"
            inputStyleClass="form-control"
            formControlName="fecha_equivalente"
            appendTo="body"
            dateFormat="dd/mm/yy"
            placeholder="dd/mm/aaaa"
            (onSelect)="validateOpenPeriod()"
            (onInput)="validateOpenPeriod()"
          ></p-calendar>

          <span id="msgContainer"></span>
        </div>
      </div>

      <div class="col-12 p-0">
        <div class="form-group" [appMsgError]="'comentario'" [form]="formGroup">
          <label class="control-label">Concepto: <span style="color: red">*</span></label>
          <input id="motivo" formControlName="comentario" class="form-control w-100" [appCapitalice]="'formGroup'"/>

          <span id="msgContainer"></span>
        </div>
      </div>

      <div class="col-12 p-0 mt-2">
        <form-entrada-diario [isOpenMonth]="isOpenMonth" (getDetalleAsientos)="parseDetalleAsientos($event)"></form-entrada-diario>
      </div>

      <!-- <div class="col-12 p-0">
        <button class="btn btn-blanco" (click)="test()">test</button>
      </div> -->
    </div>
  </form>
</div>
