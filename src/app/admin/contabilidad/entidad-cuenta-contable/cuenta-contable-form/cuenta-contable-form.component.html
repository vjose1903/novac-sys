<div class="cuentaContableForm">
  <form *ngIf="form" [formGroup]="form" (keydown.enter)="$event.preventDefault()">
    <div class="row p-0">
      <div class="col-12 p-0">
        <h6>{{ configEntContableClass.getConfigLabel(inputs.selectedConfig) }}</h6>
      </div>
      <div class="col-12 p-0">
        <span class="p-buttonset">
          <button
            *ngIf="configuration.btn.individual"
            pButton
            pRipple
            label="Individual"
            styleClass="p-button-sm"
            class="btn-theme p-1 px-2"
            (click)="changeAgrupacion('individual')"
            [ngClass]="{ selected: form.controls.tipo_agrupacion_contable.value == 'individual' }"
          ></button>

          <button
            *ngIf="configuration.btn.categoria"
            pButton
            pRipple
            label="Categoria"
            styleClass="p-button-sm"
            class="btn-theme p-1 px-2"
            (click)="changeAgrupacion('categoria')"
            [ngClass]="{ selected: form.controls.tipo_agrupacion_contable.value == 'categoria' }"
          ></button>

          <button
            *ngIf="configuration.btn.subCategoria"
            pButton
            pRipple
            label="Sub Categoria"
            styleClass="p-button-sm"
            class="btn-theme p-1 px-2"
            (click)="changeAgrupacion('sub_categoria')"
            [ngClass]="{ selected: form.controls.tipo_agrupacion_contable.value == 'sub_categoria' }"
          ></button>
        </span>
      </div>
      <div class="col-12 p-0">
        <label class="mb-0 mt-3" for="search">{{ form.controls.is_comun.value ? 'Cuenta Contable' : 'Cuenta Control' }} </label>
        <input id="cuentaControlInput" class="search-input form-control min" [value]="getCuentaControlLabel()" disabled />
      </div>

      <div *ngIf="form.controls.tipo_agrupacion_contable.value != 'individual'" class="row mt-3 w-100 rowCategoria">
        <div class="col-7 p-0">
          <div class="form-group mb-0" [appMsgError]="'tipo_agrupacion_contable'" [form]="form">
            <label class="mb-0 " for="search">{{ getDropDownInfo('description') }} </label>
            <input *ngIf="form.controls.tipo_agrupacion_contable.value == 'individual'" id="cuentaControlInput" class="search-input form-control min" [value]="inputs.selectedConfig.cuenta_contable.label" disabled />

            <p-dropdown
              #dropdownCuentaControl
              inputId="cuentaControlSelect"
              appendTo="body"
              formControlName="tipo_categoria_id"
              [options]="listadoCategorias"
              [itemSize]="34"
              optionLabel="descripcion"
              optionValue="id"
              styleClass="form-control min"
              [emptyMessage]="getDropDownInfo('emptyMessage')"
              [placeholder]="getDropDownInfo('placeholder')"
              [showClear]="true"
              (onClear)="dropdownCuentaControl.focus(); dropdownCuentaControl.show()"
              (onChange)="selectCategoria()"
            >
              <ng-template let-cuenta_control pTemplate="item">
                <div class="cuenta_control-item">
                  <span class="d-block" style="font-size: 0.9rem">
                    <strong>{{ getDropDownInfo('description') }}: </strong> {{ cuenta_control.descripcion }}
                  </span>
                </div>
              </ng-template>
            </p-dropdown>
            <span id="msgContainer"></span>
          </div>
        </div>
        <div class="col-5 p-0">
          <div class="form-group mb-0 switchDiv h-100 align-items-end">
            <div class="d-flex align-items-center ml-4">
              <div [pTooltip]="fun.isEmpty(form.controls.tipo_categoria_id.value) ? 'Primero ' + getDropDownInfo('placeholder').toLowerCase() : ''" tooltipPosition="left" class="h-100 d-flex align-items-center">
                <input formControlName="is_comun" class="apple-switch" type="checkbox" />
              </div>
              <span class="ml-2 mb-0">Cuenta Común</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
