<p-accordion [activeIndex]="activeIndex">
  <p-accordionTab header="Cuentas Contables">
    <div *ngIf="is_initialized" class="row p-0 rowCuentasContables">
      <div class="col-12 p-0" *ngFor="let config of this.inputs.configsEntCuentas; let index = index">
        <cuenta-contable-form
          [inputs]="{ selectedConfig: fun.duplicarJson(config), entidad: inputs.entidad }"
          [configuration]="configuration"
          [cuentaContableDataCruda]="getData(config.id, 'cruda')"
          [cuentaContableData]="getData(config.id, 'form')"
          [infoTipoArticulo]="infoTipoArticulo"
          [camposDisabled]="camposDisabled"
          (cuentaContableDataChange)="parseData($event)"
        ></cuenta-contable-form>
      </div>
    </div>
  </p-accordionTab>
</p-accordion>
