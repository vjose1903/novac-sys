<p-accordion [value]="activeIndex">
  @for (config of inputs.configsEntCuentas; track config.id) {
    <p-accordion-panel [value]="$index">
      <p-accordion-header>Cuentas Contables</p-accordion-header>
      <p-accordion-content>
        @if (is_initialized) {
          <div class="row p-0 rowCuentasContables">
            <div class="col-12 p-0" *ngFor="let config of this.inputs.configsEntCuentas; let index = index">
              <cuenta-contable-form
                [inputs]="{ selectedConfig: fun.deepCloning(config), entidad: inputs.entidad }"
                [configuration]="configuration"
                [cuentaContableDataCruda]="getData(config.id, 'cruda')"
                [cuentaContableData]="getData(config.id, 'form')"
                [infoTipoArticulo]="infoTipoArticulo"
                [camposDisabled]="camposDisabled"
                (cuentaContableDataChange)="parseData($event)"></cuenta-contable-form>
            </div>
          </div>
        }
      </p-accordion-content> 
    </p-accordion-panel>
  }
