<p-accordion [value]="activeIndex">
  <p-accordion-panel [value]="0">
    <p-accordion-header>Cuentas Contables</p-accordion-header>
    <p-accordion-content>
      @if (isInitialized()) {
        <div class="d-flex flex-column row-gap-2">
          @for (config of inputs().configsEntCuentas; track config.id) {
            <cuenta-contable-form
              [inputs]="{ selectedConfig: config, entidad: inputs().entidad }"
              [configuration]="processedConfig()"
              [cuentaContableDataCruda]="getCuentaCruda(config.id)"
              [cuentaContableData]="getCuentaForm(config.id)"
              [infoTipoArticulo]="infoTipoArticulo()"
              [camposDisabled]="camposDisabled()"
              (cuentaContableDataChange)="updateCuenta($event)">
            </cuenta-contable-form>
          }
        </div>
      }
    </p-accordion-content>
  </p-accordion-panel>
</p-accordion>
