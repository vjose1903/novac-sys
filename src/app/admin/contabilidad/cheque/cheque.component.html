<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <h4 class="negrita mb-0">Registro de Cheques</h4>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" *ngIf="isCreando || chequeSelected" class="form minForm {{ isCreando || chequeSelected ? 'showForm' : 'hideForm' }} ">
          <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
            <h4 class="mb-0">Formulario</h4>
          </div>

          <div class="card cardFormClass">
            <form [formGroup]="formGroup" (keydown.enter)="$event.stopPropagation()">
              <div class="row">
                <!-- <div class="col-12">
                  {{ formGroup.getRawValue() | json }}
                </div> -->
                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="chequeFormAttr.fecha_equivalente" [form]="formGroup">
                    <label class="control-label" requiredFieldLabel>Fecha: </label>
                    <p-calendar
                      [inputId]="chequeFormFieldId.fecha_equivalente"
                      [minDate]="minDate"
                      [maxDate]="maxDate"
                      inputStyleClass="form-control"
                      [formControlName]="chequeFormAttr.fecha_equivalente"
                      (keydown.enter)="saltar(chequeFormFieldId.fecha_equivalente)"
                      appendTo="body"
                      dateFormat="dd/mm/yy"
                      placeholder="dd/mm/aaaa"
                      (onSelect)="validateOpenPeriod()"
                      (onInput)="validateOpenPeriod()"
                    ></p-calendar>

                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="chequeFormAttr.cuenta_bancaria_id" [form]="formGroup">
                    <label class="control-label" requiredFieldLabel>Cuenta Bancaria: </label>

                    <p-dropdown
                      #dropdownCuenta
                      [inputId]="chequeFormFieldId.cuenta_bancaria_id"
                      placeholder="Seleccione la cuenta"
                      filterPlaceholder="Buscar"
                      appendTo="body"
                      [formControlName]="chequeFormAttr.cuenta_bancaria_id"
                      [options]="cuentasBancariasList()"
                      [virtualScrollItemSize]="34"
                      [filter]="true"
                      filterBy="numero_cuenta,banco_name"
                      optionLabel="label"
                      optionValue="id"
                      [resetFilterOnHide]="true"
                      [autofocusFilter]="false"
                      styleClass="form-control"
                      emptyMessage="No existen cuantas bancarias"
                      [showClear]="true"
                      optionDisabled="disabled"
                      (keydown.enter)="$event.preventDefault(); $event.stopPropagation()"
                      (onFocus)="dropdownFilterFocusInput(dropdownCuenta)"
                      (onHide)="dropCuentaBancariaHide(dropdownCuenta, chequeFormAttr.cuenta_bancaria_id)"
                    >
                      <ng-template let-cuenta_bancaria pTemplate="item">
                        <div class="cuenta_bancaria-item">
                          <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex flex-column">
                              <span class="d-block" style="font-size: 1rem"> <strong>No. Cuenta: </strong> {{ cuenta_bancaria.numero_cuenta }} </span>
                              <span class="d-block" style="font-size: 0.8rem; color: #787878"> <strong>Banco: </strong> {{ cuenta_bancaria.banco_name }} </span>
                            </div>

                            <div>
                              @if (cuenta_bancaria.disabled) {
                              <p-tag [rounded]="true" [style]="{ background: '#ead259', color: '0000' }"> <span class="text-black"> No tiene chequera </span> </p-tag>
                              }
                            </div>
                          </div>
                        </div>
                      </ng-template>
                    </p-dropdown>
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 col-md-6 p-0 pr-md-3">
                  <form-divisa-input [formControlName]="chequeFormAttr.divisa_id" [inputId]="chequeFormFieldId.divisa_id" (keydownEnter)="saltar(chequeFormFieldId.divisa_id)"></form-divisa-input>
                </div>

                <div class="col-12 col-md-6 p-0">
                  <div class="form-group" [appMsgError]="chequeFormAttr.monto" [form]="formGroup">
                    <label class="control-label" requiredFieldLabel>Monto: </label>
                    <input
                      type="text"
                      (keydown.enter)="saltar(htmlServ.getId($event))"
                      [id]="chequeFormFieldId.monto"
                      [formControlName]="chequeFormAttr.monto"
                      placeholder="Introduzca monto"
                      class="form-control"
                      (focus)="desformatearMonto(chequeFormAttr.monto); htmlServ.selectValue($event)"
                      autocomplete="off"
                      (blur)="formatearMonto(chequeFormAttr.monto)"
                    />
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="chequeFormAttr.comentario" [form]="formGroup">
                    <label class="control-label" requiredFieldLabel>Concepto: </label>
                    <textarea placeholder="Ingresar comentario" class="form-control form-control-sm" [id]="chequeFormFieldId.comentario" [formControlName]="chequeFormAttr.comentario" rows="3" pInputTextarea> </textarea>
                    <span id="msgContainer"></span>
                  </div>
                </div>
              </div>
            </form>
            <div class="w-100 mt-5 d-flex justify-content-between">
              <div class="d-flex column-gap-2">
                <button (click)="borrar()" class="btn btn-blanco" style="max-width: 6rem">Borrar</button>
                <button [disabled]="formIsInvalid()" type="submit" (click)="requests()" class="btn btn-verde" style="max-width: 6rem">{{ botonLabel }}</button>
                <!-- <button type="submit" (click)="checkIfSomethingIsDiferrent()" class="btn btn-gris" style="max-width: 6rem">test</button> -->
              </div>
              <div>
                <button class="btn btn-blanco" (click)="borrar(); isCreando = false" style="max-width: 6rem">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <div class="list minForm {{ isCreando || chequeSelected ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 class="mb-0">Listado de cheques</h4>
          <button *ngxPermissionsOnly="permissions.cheque.create || permissions.cheque.update" [disabled]="chequeSelected || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
        </div>
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="chequeList" [seleccionado]="chequeSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
