<div class="row">
  <div class="col-12 p-0">
    <h5 class="mb-5" *ngIf="fun.hasValue(data) && method == 'edit'">
      Cuenta Contable: <strong> {{ data.descripcion }}</strong>
    </h5>
    <h5 class="mb-5" *ngIf="method == 'add'">
      Añadir Cuenta Contable en: <strong> {{ data.descripcion }}</strong>
    </h5>
  </div>
  <div class="col-12 p-0">
    <form [formGroup]="form" (keydown.enter)="$event.stopPropagation()">
      <div class="row">
        <div class="col-6 p-0">
          <div class="form-group switchDiv d-flex justify-content-center align-items-center">
            <input formControlName="cuenta_is_control" class="apple-switch" type="checkbox" (click)="checkTypeAccount('cuenta_is_control')" />
            <span class="ml-2 mb-0">Control</span>
          </div>
        </div>

        <div class="col-6 p-0">
          <div class="form-group switchDiv d-flex justify-content-center align-items-center">
            <input formControlName="cuenta_is_auxiliar" class="apple-switch" type="checkbox" (click)="checkTypeAccount('cuenta_is_auxiliar')" />
            <span class="ml-2 mb-0">Auxiliar</span>
          </div>
        </div>

        <div class="col-12 p-0">
          <div class="form-group">
            <label class="control-label">Cuenta Control: </label>
            <p-tag
              [rounded]="true"
              [style]="{ background: '#d3eaf5', 'white-space': 'nowrap', width: '-webkit-fill-available', overflow: 'hidden', display: 'inline-block', 'font-size': '0.9rem', 'box-shadow': '1px 1px 3px #00000047', 'padding-left': '1rem' }"
            >
              <p class="text-black mb-0">{{ getCuentaControlLabel(cuenta_control) }}</p>
            </p-tag>
          </div>
        </div>

        <div class="p-0 col-12">
          <div class="form-group" appMsgError="descripcion" [form]="form">
            <label class="control-label">Descripción: <span style="color: red">*</span></label>
            <input
              [appCapitalice]="'formGroup'"
              id="campoDescripcon"
              type="text"
              formControlName="descripcion"
              placeholder="Introduzca la descripción de la cuenta"
              class="form-control"
              [ngClass]="{ UPPERCASE: form.controls.cuenta_is_control.value }"
              autocomplete="off"
              autofocus
            />
            <span id="msgContainer"></span>
          </div>
        </div>

        <div class="p-0 col-12" *ngIf="method == 'edit'">
          <div class="form-group" appMsgError="descripcion" [form]="form">
            <label class="control-label">Cuenta Contable: </label>
            <input [appCapitalice]="'formGroup'" id="campoCodigo" type="text" formControlName="codigo" class="form-control" autocomplete="off" />
            <span id="msgContainer"></span>
          </div>
        </div>

        <div class="p-0 col-12">
          <div class="form-group" appMsgError="origen" [form]="form">
            <label class="control-label">Origen: <span style="color: red">*</span></label>
            <p-select
              [placeholder]="'Seleccione el origen de la cuenta'"
              [options]="origenList"
              formControlName="origen"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
              (onHide)="saltar('tipo')"
              (keydown.enter)="saltar('tipo')"
              styleClass="form-control"
              [virtualScroll]="true"
              [virtualScrollItemSize]="30"
              id="campoOrigen"
            ></p-select>
            <span id="msgContainer"></span>
          </div>
        </div>

        <div class="p-0 col-12">
          <div class="form-group" appMsgError="tipo" [form]="form">
            <label class="control-label">Tipo: <span style="color: red">*</span></label>
            <p-select
              [placeholder]="'Seleccione el tipo de cuenta'"
              [options]="tipoList"
              formControlName="tipo"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
              (onHide)="saltar('send')"
              (keydown.enter)="saltar('send')"
              styleClass="form-control"
              [virtualScroll]="true"
              [virtualScrollItemSize]="30"
              id="campoTipo"
            ></p-select>
            <span id="msgContainer"></span>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
