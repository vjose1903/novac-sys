<div class="row">
  <div class="col-12 p-0">
    <h5 class="mb-3" *ngIf="fun.hasValue(inputs.data) && inputs.method == 'edit'">
      Cuenta Contable: <strong> {{ inputs.data.descripcion }}</strong>
    </h5>
  </div>
  <div class="col-12 p-0">
    <form [formGroup]="form">
      <div class="row">
        <div class="col-6 p-0">
          <div class="form-group switchDiv d-flex justify-content-center align-items-center">
            <input formControlName="cuenta_is_control" class="apple-switch" type="checkbox" (click)="checkTypeAccount('cuenta_is_control')" />
            <span class="ml-2 mb-0">Control</span>
          </div>
        </div>

        <div class="col-6 p-0">
          <div class="form-group switchDiv d-flex justify-content-center align-items-center">
            <input formControlName="cuenta_is_auxiliar" class="apple-switch" type="checkbox" (click)="checkTypeAccount('cuenta_is_auxiliar')" />
            <span class="ml-2 mb-0">Auxiliar</span>
          </div>
        </div>

        <div class="col-12 p-0">
          <div class="form-group">
            <label class="control-label">Cuenta Control: </label>
            <p-tag
              [rounded]="true"
              [style]="{ background: '#d3eaf5', 'white-space': 'nowrap', width: '-webkit-fill-available', overflow: 'hidden', display: 'inline-block', 'font-size': '0.9rem', 'box-shadow': '1px 1px 3px #00000047', 'padding-left': '1rem' }"
            >
              <p class="text-black mb-0">{{ getCuentaControlLabel(inputs.data.cuenta_control) }}</p>
            </p-tag>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
