<div class="catalogo-cuentas-container">
  <div class="catalogo-cuentas-filter d-flex align-items-center" style="max-width: 17rem; z-index: 9">
    <label class="search-label mr-2" for="search-input-catalogo">Busqueda </label>
    <input id="search-input-catalogo" class="search-input form-control min" (keyup)="filter($event)" />
  </div>

  <div class="catalogo-cuentas-body">
    <div #catalogoCuentasBody class="catalogo-cuentas-fantasma">
      <p-treeTable *ngIf="treeNodes.length" [value]="treeNodes" [columns]="table_config.info" [scrollable]="true" scrollHeight="{{ treeTableScrollHeight }}" [resizableColumns]="true">
        <ng-template pTemplate="header" let-columns>
          <tr #trTreeHead>
            <th *ngFor="let column of columns" [ngStyle]="column.style">
              {{ column.titulo }}
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowNode let-rowData="rowData" let-columns="columns" let-rowIndex="rowIndex">
          <tr #trTreeBody [ttRow]="rowNode">
            <td *ngFor="let column of columns; let indexBody = index" [ngStyle]="tServ.getStyle(rowData, column, rowData.index, table_config.id_tabla)" [ngClass]="{ negrita: rowData.is_control }">
              <p-treeTableToggler [rowNode]="rowNode" *ngIf="indexBody === 0"></p-treeTableToggler>

              <span [ngSwitch]="column?.tipo">
                <ng-container *ngSwitchCase="'text'">
                  {{ fun.hasValue(column?.key) ? rowData[column.key] : '' }}
                </ng-container>

                <ng-container *ngSwitchCase="'tag'">
                  <p-tag
                    [value]="getValueForm(column, rowData)"
                    [rounded]="true"
                    [severity]="rowData[column.tag_severity]"
                    [ngClass]="{ tag_clickable: !!column.click }"
                    [style]="{
                      background: rowData[column.row_tag_color],
                      'white-space': 'nowrap',
                      width: column.tag_apretada ? 'auto' : '-webkit-fill-available',
                      overflow: 'hidden',
                      'text-overflow': 'ellipsis',
                      display: 'inline-block'
                    }"
                  ></p-tag>
                </ng-container>

                <ng-container *ngSwitchCase="'icons'">
                  <icons-array [column]="column" [indexBody]="rowData.index" [realIdTabla]="table_config.id_tabla" [seleccionado]="seleccionado" [rowData]="rowData" [data]="rowData" [rowsEditing]="[]" (icon_click)="iconsClick($event)"></icons-array>
                </ng-container>
              </span>
            </td>
          </tr>
        </ng-template>
      </p-treeTable>
    </div>
  </div>
</div>
