<div class="row rowResgitro">
  <div class="col-12 p-0 colTitulo">
    <h4 class="negrita mb-0">Registro de Transferencias</h4>
  </div>

  <div class="col-12 p-0 colFormularioListado">
    <div class="d-flex h-100">
      <ng-container *ngxPermissionsOnly="formPermissions">
        <div class="contenedorRegistro" *ngIf="isCreando || transferenciaSelected" class="form minForm {{ isCreando || transferenciaSelected ? 'showForm' : 'hideForm' }} ">
          <div class="tituloFormClass d-flex justify-content-between align-items-center" style="min-height: 3.3rem">
            <h4 class="mb-0">Formulario</h4>
          </div>

          <div class="card cardFormClass">
            <form [formGroup]="formGroup()" (keydown.enter)="$event.stopPropagation()">
              <div class="row">
                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="transferenciaFormAttr.fecha_equivalente" [form]="formGroup()">
                    <label class="control-label" requiredFieldLabel>Fecha: </label>
                    <p-datepicker
                      [inputId]="transferenciaFormFieldId.fecha_equivalente"
                      [minDate]="minDate"
                      [maxDate]="maxDate"
                      inputStyleClass="form-control"
                      [formControlName]="transferenciaFormAttr.fecha_equivalente"
                      (keydown.enter)="saltar(transferenciaFormFieldId.fecha_equivalente)"
                      appendTo="body"
                      dateFormat="dd/mm/yy"
                      placeholder="dd/mm/aaaa"
                      (onSelect)="validateOpenPeriod()"
                      (onInput)="validateOpenPeriod()"></p-datepicker>

                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="transferenciaFormAttr.cuenta_bancaria_origen_id" [form]="formGroup()">
                    <label class="control-label" requiredFieldLabel>Cuenta Bancaria Origen: </label>

                    <p-select
                      #dropdownCuenta
                      [inputId]="transferenciaFormFieldId.cuenta_bancaria_origen_id"
                      placeholder="Seleccione la cuenta"
                      filterPlaceholder="Buscar"
                      appendTo="body"
                      [formControlName]="transferenciaFormAttr.cuenta_bancaria_origen_id"
                      [options]="cuentasBancariasList()"
                      [virtualScrollItemSize]="34"
                      [filter]="true"
                      filterBy="numero_cuenta,banco_name"
                      optionLabel="label"
                      optionValue="id"
                      [resetFilterOnHide]="true"
                      [autofocusFilter]="false"
                      class="form-control"
                      emptyMessage="No existen cuantas bancarias"
                      [showClear]="true"
                      (keydown.enter)="$event.preventDefault(); $event.stopPropagation()"
                      (onFocus)="dropdownFilterFocusInput(dropdownCuenta)"
                      (onHide)="dropCuentaBancariaHide(dropdownCuenta, transferenciaFormAttr.cuenta_bancaria_origen_id)">
                      <ng-template let-cuenta_bancaria pTemplate="item">
                        <div class="cuenta_bancaria-item">
                          <span class="d-block" style="font-size: 1rem"> <strong>No. Cuenta: </strong> {{ cuenta_bancaria.numero_cuenta }} </span>
                          <span class="d-block" style="font-size: 0.8rem; color: #787878"> <strong>Banco: </strong> {{ cuenta_bancaria.banco_name }} </span>
                        </div>
                      </ng-template>
                    </p-select>
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group">
                    <p-selectButton
                      [options]="transferenciasType"
                      [disabled]="formGroup().get(transferenciaFormAttr.cuenta_bancaria_origen_id).disabled"
                      [ngModel]="selectedTransferenciaType()"
                      (ngModelChange)="changeTipoTransferencia($event)"
                      [ngModelOptions]="{ standalone: true }"
                      optionLabel="label"
                      optionValue="value"
                      [unselectable]="true" />
                  </div>
                </div>

                <div class="col-12 p-0">
                  <!-- ======================= ENTRE MIS CUENTAS ======================= -->

                  <div class="transition-entrance vertical" [ngClass]="{ show: selectedTransferenciaType() === TransferenciaType.misCuentas }">
                    <div class="form-group" [appMsgError]="transferenciaFormAttr.cuenta_bancaria_destino_id" [form]="formGroup()">
                      <label class="control-label" [requiredFieldLabel]="selectedTransferenciaType() === TransferenciaType.misCuentas">Cuenta Bancaria Destino: </label>

                      <p-select
                        #dropdownMisCuentas
                        [inputId]="transferenciaFormFieldId.cuenta_bancaria_destino_id"
                        placeholder="Seleccione la cuenta"
                        filterPlaceholder="Buscar"
                        appendTo="body"
                        [formControlName]="transferenciaFormAttr.cuenta_bancaria_destino_id"
                        [options]="cuentasBancariasFilteredList()"
                        [virtualScrollItemSize]="34"
                        [filter]="true"
                        filterBy="numero_cuenta,banco_name"
                        optionLabel="label"
                        optionValue="id"
                        [resetFilterOnHide]="true"
                        [autofocusFilter]="false"
                        class="form-control"
                        emptyMessage="No existen cuantas bancarias"
                        [showClear]="true"
                        (keydown.enter)="$event.preventDefault(); $event.stopPropagation()"
                        (onFocus)="dropdownFilterFocusInput(dropdownMisCuentas)"
                        (onHide)="dropCuentaBancariaHide(dropdownMisCuentas, transferenciaFormAttr.cuenta_bancaria_destino_id)">
                        <ng-template let-cuenta_bancaria pTemplate="item">
                          <div class="cuenta_bancaria-item">
                            <span class="d-block" style="font-size: 1rem"> <strong>No. Cuenta: </strong> {{ cuenta_bancaria.numero_cuenta }} </span>
                            <span class="d-block" style="font-size: 0.8rem; color: #787878"> <strong>Banco: </strong> {{ cuenta_bancaria.banco_name }} </span>
                          </div>
                        </ng-template>
                      </p-select>
                      <span id="msgContainer"></span>
                    </div>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="transition-entrance vertical" [ngClass]="{ show: selectedTransferenciaType() === TransferenciaType.terceros }">
                    <!-- ======================= TERCEROS ======================= -->
                    <div>
                      <form-auto-complete
                        [formControlName]="transferenciaFormAttr.nombre_banco_tercero"
                        [(config)]="nombreBancoTerceroConfig"
                        [suggestions]="bancosList"
                        [multiple]="false"
                        (keydownEnter)="saltar(nombreBancoTerceroConfig.fieldId)"></form-auto-complete>
                    </div>

                    <div class="form-group" [appMsgError]="transferenciaFormAttr.cuenta_bancaria_tercero" [form]="formGroup()">
                      <label class="control-label">Cuenta Bancaria Destino:</label>
                      <input
                        type="text"
                        (keydown.enter)="saltar(htmlServ.getId($event))"
                        [id]="transferenciaFormFieldId.cuenta_bancaria_tercero"
                        [formControlName]="transferenciaFormAttr.cuenta_bancaria_tercero"
                        placeholder="Introduzca la cuenta"
                        class="form-control"
                        (focus)="htmlServ.selectValue($event)"
                        autocomplete="off" />
                      <span id="msgContainer"></span>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-md-6 p-0 pr-md-3">
                  <form-divisa-input [formControlName]="transferenciaFormAttr.divisa_id" [inputId]="transferenciaFormAttr.divisa_id" (keydownEnter)="saltar(transferenciaFormAttr.divisa_id)"></form-divisa-input>
                </div>

                <div class="col-12 col-md-6 p-0">
                  <div class="form-group" [appMsgError]="transferenciaFormAttr.monto" [form]="formGroup()">
                    <label class="control-label" requiredFieldLabel>Monto: </label>
                    <input
                      type="text"
                      (keydown.enter)="saltar(htmlServ.getId($event))"
                      [id]="transferenciaFormFieldId.monto"
                      [formControlName]="transferenciaFormAttr.monto"
                      placeholder="Introduzca monto"
                      class="form-control"
                      (focus)="desformatearMonto(transferenciaFormAttr.monto); htmlServ.selectValue($event)"
                      autocomplete="off"
                      (blur)="formatearMonto(transferenciaFormAttr.monto)" />
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="transferenciaFormAttr.numero_referencia" [form]="formGroup()">
                    <label class="control-label">Número de referencia: </label>
                    <input
                      type="text"
                      (keydown.enter)="saltar(htmlServ.getId($event))"
                      [id]="transferenciaFormFieldId.numero_referencia"
                      [formControlName]="transferenciaFormAttr.numero_referencia"
                      placeholder="Introduzca la referencia"
                      class="form-control"
                      (focus)="htmlServ.selectValue($event)"
                      autocomplete="off" />
                    <span id="msgContainer"></span>
                  </div>
                </div>

                <div class="col-12 p-0">
                  <div class="form-group" [appMsgError]="transferenciaFormAttr.comentario" [form]="formGroup()">
                    <label class="control-label" requiredFieldLabel>Comentarios: </label>
                    <textarea placeholder="Ingresar comentario" class="form-control form-control-sm" [id]="transferenciaFormFieldId.comentario" [formControlName]="transferenciaFormAttr.comentario" rows="3" pInputTextarea> </textarea>
                    <span id="msgContainer"></span>
                  </div>
                </div>
              </div>
            </form>
            <div class="p-0 w-100 mt-5 d-flex justify-content-between">
              <div class="d-flex column-gap-2">
                <button (click)="borrar()" class="btn btn-blanco">Borrar</button>
                <button [disabled]="formIsInvalid()" type="submit" (click)="requests()" class="btn btn-verde">{{ botonLabel }}</button>
                <!-- <button type="submit" (click)="checkIfSomethingIsDiferrent()" class="btn btn-gris" >test</button> -->
              </div>
              <div>
                <button class="btn btn-blanco" (click)="borrar(); isCreando = false">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <div class="list minForm {{ isCreando || transferenciaSelected ? 'FormList' : 'onlyList' }}">
        <div class="tituloCardClass d-flex justify-content-between align-items-center mb-2">
          <h4 class="mb-0">Listado de Transferencias</h4>
          <button *ngxPermissionsOnly="permissions.transferencia.create || permissions.transferencia.update" [disabled]="transferenciaSelected || isCreando" (click)="nuevoRegistro()" class="btn btn-tema">Nuevo</button>
        </div>
        <div #cardTabla id="cardTabla" class="card cardContentClass">
          <div class="divTabla">
            <dinamic-table [cardTabla]="cardTabla" [(data)]="transferenciaList" [seleccionado]="transferenciaSelected?.id" [(TablasComponent)]="tablaComponent" [config]="table_config" (table_events)="handle_table_events($event)"></dinamic-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
