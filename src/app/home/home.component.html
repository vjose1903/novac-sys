<div class="home" style="background-color: #95f0a7">
  <div class="col-md-4">
    <mdb-card cascade="true" narrower="true">
      <div class="view view-cascade waves-light" mdbWavesEffect>
        <mdb-card-img src="assets/img/admLogo_opt.png" alt="Logo ADM"></mdb-card-img>
        <a>
          <div class="mask rgba-white-slight"></div>
        </a>
      </div>

      <mdb-card-body cascade="true" class="px-5">
        <form [formGroup]="loginForm" (ngSubmit)="login(loginForm)" class="" method="post">
          <div class="form-group" id="usuario-group">
            <label for="" class="formulario__label d-block">Usuario:</label>
            <input type="text" class="form-control" formControlName="usuario" id="Iusuario" autofocus />
            <span class="error text-danger mt-0">{{ errorU }}</span>
          </div>

          <div class="form-group" id="password-group">
            <label for="" class="formulario__label d-block">Contraseña:</label>
            <input type="password" class="form-control" formControlName="password" id="Ipassword" />
            <span class="error text-danger mt-0">{{ errorC }}</span>
          </div>

          <div class="d-flex justify-content-center">
            <button class="waves-light" mdbWavesEffect id="boton" class="btn btn-success text-center"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
          </div>
        </form>
        <button class="waves-light" mdbWavesEffect id="boton" (click)="printTest()" class="btn btn-warning text-center"><i class="fas fa-sign-in-alt"></i> print</button>
      <!--   <button class="waves-light" mdbWavesEffect id="boton" (click)="pruebaRecibo()" class="btn btn-danger text-center"><i class="fas fa-sign-in-alt"></i> print</button>-->
      <!--   <button class="waves-light" mdbWavesEffect id="boton" (click)="pruebaConduce()" class="btn btn-primary text-center"><i class="fas fa-sign-in-alt"></i> print</button>-->
      </mdb-card-body>
    </mdb-card>
  </div>
</div>
