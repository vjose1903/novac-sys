<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      .spinner {
        position: absolute;
        right: 4.5rem;
        top: 6.4rem;
        width: 1.3rem;
        height: 1.3rem;
        border: 3px solid #515bec6d;
        border-top: 3px solid #0721a3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body style="-webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; outline: 0">
    <img class="inspot" src="./imgs/splash.png" style="width: -webkit-fill-available; pointer-events: none" />
    <div class="spinner"></div>
  </body>
</html>
