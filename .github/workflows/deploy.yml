name: Build and Deploy

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      # 🔑 Configurar cache de npm en Windows
      - name: Configure npm cache dir
        run: npm config set cache "$env:USERPROFILE\AppData\Roaming\npm-cache" --global
        shell: pwsh

      # 🔑 Generar hash de dependencias (package.json + package-lock.json)
      - name: Generate dependencies hash
        id: deps-hash
        run: |
          $files = Get-Content package.json, package-lock.json -Raw
          $hash = [System.Security.Cryptography.HashAlgorithm]::Create('SHA256').ComputeHash([System.Text.Encoding]::UTF8.GetBytes($files)) | ForEach-Object { $_.ToString('x2') } | Join-String
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 🔑 Cache de npm y node_modules
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            $env:USERPROFILE\AppData\Roaming\npm-cache
            node_modules
          key: ${{ runner.os }}-npm-${{ steps.deps-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 🔑 Instalar dependencias
      - name: Install dependencies
        run: npm ci

