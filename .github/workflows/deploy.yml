name: Build and Deploy

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Generate dependencies hash (ignoring version)
        id: deps-hash
        run: |
          $packageJson = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $packageJson.PSObject.Properties.Remove('version')
          $depsJson = $packageJson | ConvertTo-Json -Compress
          $hash = [System.Security.Cryptography.HashAlgorithm]::Create('SHA256').ComputeHash([System.Text.Encoding]::UTF8.GetBytes($depsJson)) | ForEach-Object { $_.ToString('x2') } | Join-String
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Get npm cache path
        id: npm-cache-path
        run: |
          $cachePath = npm config get cache
          echo "cache-path=$cachePath" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Ensure cache path exists
        run: New-Item -ItemType Directory -Force -Path "${{ steps.npm-cache-path.outputs.cache-path }}"
        shell: pwsh

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-path.outputs.cache-path }}
          key: ${{ runner.os }}-npm-${{ steps.deps-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

