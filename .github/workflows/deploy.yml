name: Build and Deploy

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Check out Git repository
        uses: actions/checkout@v6

      # 2️⃣ Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      # 6️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      # 7️⃣ Ejecutar script de configuración (opcional)
      - name: Ejecutar script de configuración
        run: node ./scripts/start.js -p -c vasquez

      # 8️⃣ Build de la aplicación (opcional)
      - name: Build Novac App
        id: build-novac-app
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_TOKEN }}
          GH_TOKEN: ${{ secrets.CUSTOM_TOKEN }}
        run: npm run windows:prod
