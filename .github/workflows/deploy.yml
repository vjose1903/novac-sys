name: Build and Deploy

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Check out Git repository
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      # 3️⃣ Configurar cache de npm en Windows
      - name: Configure npm cache dir
        run: npm config set cache "$env:USERPROFILE\AppData\Roaming\npm-cache" --global
        shell: pwsh

      # 4️⃣ Generar hash de dependencias (ignorar version)
      - name: Generate dependencies hash (ignoring version)
        id: deps-hash
        run: |
          $packageJson = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $packageJson.PSObject.Properties.Remove('version')
          $depsJson = $packageJson | ConvertTo-Json -Compress
          $hash = [System.Security.Cryptography.HashAlgorithm]::Create('SHA256').ComputeHash([System.Text.Encoding]::UTF8.GetBytes($depsJson)) | ForEach-Object { $_.ToString('x2') } | Join-String
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 5️⃣ Cache de npm y node_modules
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            $env:USERPROFILE\AppData\Roaming\npm-cache
            node_modules
          key: ${{ runner.os }}-npm-${{ steps.deps-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 6️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 7️⃣ Ejecutar script de configuración (opcional)
      # - name: Ejecutar script de configuración
      #   run: node ./scripts/start.js -p -c agrodemi

      # 8️⃣ Build de la aplicación (opcional)
