name: Build and Deploy

on:
  push:
    tags:
      - v* # Push events to matching v*, i.e. v1.0, v10.15.10

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        os: [windows-latest]

    steps:
      - name: Exit if not on actualizaciones branch
        run: |
          echo github.ref
          echo endsWith(github.ref, 'update_test')
        if: endsWith(github.ref, 'update_test') == false
        run: exit -1

      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 16

      - name: Testing
        run: |
          ls
          git branch
