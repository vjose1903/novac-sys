name: Build and Deploy

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: windows-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Check out Git repository
        uses: actions/checkout@v6

      # 2️⃣ Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      - name: Get npm cache directory
        id: npm-cache
        shell: pwsh
        run: '"path=$(npm config get cache)" >> $env:GITHUB_OUTPUT'

      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: ${{ runner.os }}-node-22-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-npm-

      # 6️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      # 7️⃣ Ejecutar script de configuración (opcional)
      - name: Ejecutar script de configuración
        run: node ./scripts/start.js -p -c agrodemi

      # 8️⃣ Build de la aplicación (opcional)
      - name: Build Novac App
        id: build-novac-app
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_TOKEN }}
          GH_TOKEN: ${{ secrets.CUSTOM_TOKEN }}
        run: npm run windows:prod
