name: Build and Deploy

on:
  push:
    tags:
      - v* # Push events to matching v*, i.e. v1.0, v10.15.10

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        os: [windows-latest]

    steps:
      - name: Verificacion de la rama
        run: echo "ESTAS EN LA RAMA ${{ github.event.base_ref }}"

      - name: Exit if not on actualizaciones branch
        if: endsWith(github.event.base_ref, 'update_test') == false
        run: exit -1

      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'
          # cache-dependency-path: '**/package-lock.json'
      # - name: Get npm cache directory
      #   id: npm-cache-dir
      #   run: echo "::set-output name=dir::$(npm config get cache)"

      # - name: Get npm cache
      #   uses: actions/cache@v3
      #   id: npm-cache
      #   with:
      #     path: ${{ steps.npm-cache-dir.outputs.dir }}
      #     key: ${{ runner.os }}-${{ env.cache-name }}-novac-system
      #     restore-keys: ${{ runner.os }}-${{ env.cache-name }}-novac-system

      # - if: ${{ steps.npm-cache.outputs.cache-hit == 'false' }}
      #   name: List the state of node modules
      #   continue-on-error: true
      #   run: npm list

      - name: Install dependencies
        run: npm ci

      - name: Build Novac App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:windows64

