name: Build and Deploy

on:
  push:
    tags:
      - v* # Push events to matching v*, i.e. v1.0, v10.15.10

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        os: [windows-latest]

    steps:
      - name: get branch_name
        run: |
          echo '==> ( ${{ github.event.base_ref }} )'
          echo '---> ( ${{ endsWith(github.event.base_ref, 'update_test') }} )'
          echo '---> ( ${{ endsWith(github.event.base_ref, 'test_2') }} )'

      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 16

      - name: Testing
        run: |
          ls
          git branch
