name: Build and Deploy

on:
  push:
    tags:
      - test* # Push events to matching v*, i.e. v1.0, v10.15.10

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        os: [windows-latest]
    env:
      TAG_NAME: ${{ v2.0.1 }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: {{ env.TAG_NAME }}
          release_name: 2.0.1
          owner: vjose1903
          repo: novac-system-agrodemi

