name: Release test

on:
  push:
    tags:
      - test* # Push events to matching v*, i.e. v1.0, v10.15.10

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_PATH: actualizacion/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
